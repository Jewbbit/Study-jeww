<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Jew 복구</title>
<style>
body{margin:0;background:#f5f5f7;color:#171719;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:520px;margin:0 auto;padding:40px 18px}.card{background:#fff;border:1px solid #e4e4e8;border-radius:16px;padding:18px}.title{font-size:20px;font-weight:750;margin-bottom:10px}.state{font-size:14px;line-height:1.6;color:#555;margin:10px 0 16px}.ok{color:#23855a;font-weight:700}.bad{color:#b54740}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:11px;padding:12px 14px;background:#171719;color:#fff;font-size:15px;text-align:center;text-decoration:none}.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}.note{margin-top:12px;font-size:12px;line-height:1.55;color:#888}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="title">앱 코드 복구</div><div id="state" class="state">안전한 서비스워커로 교체하는 중입니다…</div><a id="open" class="btn" href="./edit.html?stable=20260915-1345" aria-disabled="true">앱 열기</a><div class="note">이 페이지는 공부 데이터나 로컬 저장 내용을 수정하지 않습니다. 코드 캐시만 정상 버전으로 교체합니다.</div></div></div>
<script>
(async()=>{
  const state=document.getElementById('state'),open=document.getElementById('open');
  const ready=()=>{state.innerHTML='<span class="ok">복구 준비가 끝났습니다.</span><br>아래 버튼으로 앱을 새 탭 상태에서 다시 여세요.';open.setAttribute('aria-disabled','false')};
  if(!('serviceWorker' in navigator)){state.innerHTML='<span class="bad">이 브라우저에서는 서비스워커를 사용할 수 없습니다.</span>';return}
  let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(done)return;done=true;setTimeout(ready,150)});
  try{
    const reg=await navigator.serviceWorker.register('./sw.js?stable=20260915-1345',{scope:'./',updateViaCache:'none'});
    await reg.update().catch(()=>{});
    const started=Date.now();
    const timer=setInterval(async()=>{
      try{
        const r=await navigator.serviceWorker.getRegistration('./');
        const url=r?.active?.scriptURL||'';
        if(url.includes('stable=20260915-1345')||Date.now()-started>7000){clearInterval(timer);if(!done){done=true;ready()}}
      }catch{}
    },250);
  }catch(e){state.innerHTML='<span class="bad">코드 복구 실패</span><br>'+String(e?.message||e);}
})();
</script>
</body>
</html>
