<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>국어 복습</title>
<style>
:root {
  --bg:#f5f5f7; --card:#fff; --line:#d9d9df; --text:#1d1d1f;
  --sub:#6e6e73; --ok:#16784a; --bad:#b42318; --accent:#2f5fb3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.94);backdrop-filter:blur(14px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}
.tab{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;white-space:nowrap;font-size:14px}
.tab.active{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.toolbar{display:flex;gap:7px;overflow:auto;margin-top:9px}
button{font:inherit}
.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:12px 10px 80px}
.sheet-title{font-size:18px;font-weight:700;margin:4px 4px 10px}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.group-head{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:#fff;padding:12px 14px;font-weight:700;font-size:16px;text-align:left}
.group-head .meta{font-size:12px;font-weight:500;color:var(--sub)}
.group.collapsed .rows{display:none}
.row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(180px,1.35fr) 76px;gap:8px;align-items:start;padding:9px 10px;border-top:1px solid #ececf0}
.answer-wrap{min-width:0}
input.answer{width:100%;border:1px solid #c9c9cf;border-radius:9px;padding:10px 11px;font-size:16px;background:#fff}
input.answer:focus{outline:2px solid rgba(47,95,179,.2);border-color:var(--accent)}
input.answer.correct{border-color:var(--ok);background:#f2fbf6}
input.answer.wrong{border-color:var(--bad);background:#fff5f4}
.hint{font-size:14px;line-height:1.45;color:#333;white-space:pre-wrap;word-break:keep-all;padding:8px 4px}
.note{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.4}
.status{font-size:13px;font-weight:700;text-align:center;padding-top:11px}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.empty{color:#aaa}
.revealed{font-size:13px;color:var(--accent);margin-top:6px;display:none}
.show-answers .revealed{display:block}
.small-btn{border:1px solid var(--line);background:#fafafa;border-radius:8px;padding:5px 8px;font-size:12px;margin-top:6px}
.footer-note{color:var(--sub);font-size:12px;padding:4px 5px 18px}
@media(max-width:720px){
  .row{grid-template-columns:1fr 66px}
  .hint{grid-column:1 / -1;grid-row:2}
  .status{grid-column:2;grid-row:1}
}
</style>
</head>
<body>
<header>
  <h1>국어 복습</h1>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <button class="action" id="clearBtn">입력 전체 지우기</button>
    <button class="action" id="fillBtn">정답 한꺼번에 채우기</button>
    <button class="action" id="toggleAnswerBtn">정답 보기</button>
    <button class="action" id="foldBtn">전체 접기</button>
  </div>
</header>
<main id="app"></main>

const STORE_KEY = "korean-review-v1";
let state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let currentSheet = state.currentSheet || DATA.sheets[0].name;
let showAnswers = false;
let allFolded = false;

function norm(s) {
  return (s || "").trim().replace(/\s/g,"").replace(/[·,]/g,"").toLowerCase();
}
function key(sheet,row) { return sheet+"::"+row; }
function save() { state.currentSheet=currentSheet; localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function renderTabs() {
  const tabs=document.getElementById("tabs"); tabs.innerHTML="";
  DATA.sheets.forEach(s=>{
    const b=document.createElement("button");
    b.className="tab"+(s.name===currentSheet?" active":"");
    b.textContent=s.name;
    b.onclick=()=>{currentSheet=s.name; save(); render();};
    tabs.appendChild(b);
  });
}

function statusFor(value, answer) {
  if (!value) return ["", "empty"];
  return norm(value)===norm(answer) ? ["정답","ok"] : ["오답","bad"];
}

function render() {
  renderTabs();
  const root=document.getElementById("app"); root.innerHTML="";
  root.classList.toggle("show-answers", showAnswers);
  const sheet=DATA.sheets.find(s=>s.name===currentSheet);
  const title=document.createElement("div"); title.className="sheet-title"; title.textContent=sheet.name; root.appendChild(title);

  sheet.groups.forEach((g,gi)=>{
    const box=document.createElement("section"); box.className="group"+(allFolded?" collapsed":"");
    const head=document.createElement("button"); head.className="group-head";
    head.innerHTML=`<span>${g.title}</span><span class="meta">${g.rows.length}개 · 접기/펴기</span>`;
    head.onclick=()=>box.classList.toggle("collapsed");
    box.appendChild(head);
    const rows=document.createElement("div"); rows.className="rows";

    g.rows.forEach(item=>{
      const k=key(sheet.name,item.row);
      const saved=(state.answers && state.answers[k]) || "";
      const [st,cl]=statusFor(saved,item.answer);
      const row=document.createElement("div"); row.className="row";
      const aw=document.createElement("div"); aw.className="answer-wrap";
      const inp=document.createElement("input"); inp.className="answer "+(cl==="ok"?"correct":cl==="bad"?"wrong":"");
      inp.value=saved; inp.placeholder="답 입력"; inp.autocomplete="off"; inp.spellcheck=false;
      const rv=document.createElement("div"); rv.className="revealed"; rv.textContent="정답: "+item.answer;
      const one=document.createElement("button"); one.className="small-btn"; one.textContent="이 답 채우기";
      one.onclick=()=>{ inp.value=item.answer; inp.dispatchEvent(new Event("input")); };
      aw.append(inp,rv,one);

      const hint=document.createElement("div"); hint.className="hint";
      let hintText=item.hint || " ";
      hint.textContent=hintText;
      if(item.note) {
        const note=document.createElement("div"); note.className="note"; note.textContent=item.note;
        hint.appendChild(note);
      }
      const status=document.createElement("div"); status.className="status "+cl; status.textContent=st || "—";

      inp.oninput=()=>{
        state.answers ||= {};
        state.answers[k]=inp.value; save();
        const [nst,ncl]=statusFor(inp.value,item.answer);
        inp.classList.toggle("correct",ncl==="ok"); inp.classList.toggle("wrong",ncl==="bad");
        status.className="status "+ncl; status.textContent=nst || "—";
      };
      row.append(aw,hint,status); rows.appendChild(row);
    });
    box.appendChild(rows); root.appendChild(box);
  });
  const fn=document.createElement("div"); fn.className="footer-note";
  fn.textContent="원본 Excel 채점 방식과 같이 공백·가운뎃점(·)·쉼표는 무시하여 비교합니다. 입력 내용은 이 기기의 브라우저에 자동 저장됩니다.";
  root.appendChild(fn);
}

document.getElementById("clearBtn").onclick=()=>{
  if(!confirm("현재 시트의 입력 답을 모두 지울까요?")) return;
  state.answers ||= {};
  const sheet=DATA.sheets.find(s=>s.name===currentSheet);
  sheet.groups.flatMap(g=>g.rows).forEach(item=>delete state.answers[key(sheet.name,item.row)]);
  save(); render();
};
document.getElementById("fillBtn").onclick=()=>{
  state.answers ||= {};
  const sheet=DATA.sheets.find(s=>s.name===currentSheet);
  sheet.groups.flatMap(g=>g.rows).forEach(item=>state.answers[key(sheet.name,item.row)]=item.answer);
  save(); render();
};
document.getElementById("toggleAnswerBtn").onclick=(e)=>{
  showAnswers=!showAnswers; e.target.textContent=showAnswers?"정답 숨기기":"정답 보기"; render();
};
document.getElementById("foldBtn").onclick=(e)=>{
  allFolded=!allFolded; e.target.textContent=allFolded?"전체 펴기":"전체 접기"; render();
};
render();
</script>
