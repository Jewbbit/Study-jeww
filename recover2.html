<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>교육과정 복구 진단</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#171719;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e0e0e5;border-radius:14px;padding:14px;margin-bottom:10px}h1{font-size:19px;margin:0 0 8px}p{font-size:12px;line-height:1.55;color:#666;margin:6px 0}.warn{color:#a34}.row{border:1px solid #dddde3;border-radius:10px;padding:10px;margin:7px 0;background:#fafafa}.row strong{display:block;font-size:13px;word-break:break-all}.row small{display:block;color:#666;line-height:1.5;margin-top:4px;word-break:break-all}.good{border-color:#9dc8ae;background:#f4fbf7}.zero{opacity:.65}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all}.empty{padding:15px;text-align:center;color:#777}button{font:inherit;border:1px solid #d9d9df;background:#fff;border-radius:9px;padding:8px 10px}.copy{width:100%;margin-top:8px}.status{font-size:11px;color:#777;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>교육과정 복구 진단</h1>
    <p>이 페이지는 저장 데이터를 <b>읽기만</b> 합니다. 복구나 삭제를 자동으로 실행하지 않습니다.</p>
    <p class="warn">기존 앱 탭은 닫거나 새로고침하지 마세요.</p>
  </div>
  <div id="known" class="card"></div>
  <div id="found" class="card"></div>
  <div class="card"><button id="copy" class="copy" type="button">진단 결과 복사</button><div id="copyStatus" class="status"></div></div>
</div>
<script>
(()=>{
  const captured=[];
  const parsed=[];
  const storageSets=[["localStorage",localStorage],["sessionStorage",sessionStorage]];
  for(const [storeName,store] of storageSets){
    for(let i=0;i<store.length;i++){
      const key=store.key(i);let raw="";try{raw=store.getItem(key)||""}catch{}
      captured.push({storeName,key,bytes:raw.length,raw});
      try{parsed.push({storeName,key,value:JSON.parse(raw),bytes:raw.length})}catch{}
    }
  }

  const obj=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};
  const looks=v=>v&&typeof v==="object"&&!Array.isArray(v)&&(
    Object.prototype.hasOwnProperty.call(v,"standardBlankOverrides")||
    Object.prototype.hasOwnProperty.call(v,"standardNotes")||
    Object.prototype.hasOwnProperty.call(v,"considerationAssignments")
  );
  function counts(cp){
    const c=obj(cp),sp=obj(c.standardBlankOverrides),notes=obj(c.standardNotes),assign=obj(c.considerationAssignments);
    let blanks=0,noteFields=0;
    for(const xs of Object.values(sp))if(Array.isArray(xs))blanks+=xs.length;
    for(const n of Object.values(notes)){if(!n||typeof n!=="object")continue;if(String(n.content||"").trim())noteFields++;if(String(n.memo||"").trim())noteFields++}
    return {blanks,noteFields,assign:Object.keys(assign).length,score:blanks*4+noteFields*3+Object.keys(assign).length};
  }
  function walk(root,baseMeta){
    const seen=new WeakSet(),out=[];
    function rec(v,path,depth,nearestTime){
      if(!v||typeof v!=="object"||depth>10)return;
      if(seen.has(v))return;seen.add(v);
      const ownTime=Number(v.updatedAt||v.at||v.timestamp||0)||nearestTime||0;
      if(looks(v)){const c=counts(v);out.push({...baseMeta,path,time:ownTime,cp:v,...c})}
      if(Array.isArray(v)){for(let i=0;i<v.length&&i<200;i++)rec(v[i],`${path}[${i}]`,depth+1,ownTime)}
      else{for(const [k,x] of Object.entries(v))rec(x,path?`${path}.${k}`:k,depth+1,ownTime)}
    }
    rec(root,"",0,0);return out;
  }

  let candidates=[];
  for(const p of parsed)candidates.push(...walk(p.value,{storeName:p.storeName,key:p.key,bytes:p.bytes}));
  const sideExp=(()=>{try{return Object.keys(obj(JSON.parse(localStorage.getItem("study-jew-explanation-blanks-v1")||"{}"))).length}catch{return 0}})();
  const sideCon=(()=>{try{return Object.keys(obj(JSON.parse(localStorage.getItem("study-jew-consideration-blanks-v1")||"{}"))).length}catch{return 0}})();

  const knownKeys=["study-jew-v4","study-jew-v4-study-edit","study-jew-v4-study-drafts","study-jew-curriculum-safety-v1","study-jew-explanation-blanks-v1","study-jew-consideration-blanks-v1"];
  const known=document.getElementById("known");
  const kt=document.createElement("p");kt.innerHTML="<strong>저장소 확인</strong>";known.append(kt);
  for(const key of knownKeys){const hit=captured.find(x=>x.storeName==="localStorage"&&x.key===key);const d=document.createElement("div");d.className="row "+(hit?"good":"zero");d.innerHTML=`<strong>${key}</strong><small>${hit?`있음 · ${hit.bytes.toLocaleString()}자`:"없음"}</small>`;known.append(d)}

  const found=document.getElementById("found");
  const ft=document.createElement("p");ft.innerHTML=`<strong>교육과정 데이터 후보 ${candidates.length}개</strong><br>별도 해설 빈칸 묶음 ${sideExp} · 적용 시 고려 빈칸 묶음 ${sideCon}`;found.append(ft);
  candidates.sort((a,b)=>b.score-a.score||(b.time||0)-(a.time||0));
  if(!candidates.length){const e=document.createElement("div");e.className="empty";e.textContent="localStorage/sessionStorage에서 교육과정 편집 데이터 후보를 찾지 못했습니다.";found.append(e)}
  else candidates.forEach((x,i)=>{const d=document.createElement("div");d.className="row "+(x.score?"good":"zero");const ts=x.time?new Date(x.time).toLocaleString("ko-KR"):"시간 정보 없음";d.innerHTML=`<strong>${i+1}. ${x.storeName} · ${x.key}</strong><small>경로: <span class="mono">${x.path||"(root)"}</span><br>${ts}<br>성취기준 빈칸 ${x.blanks} · 내용요소/메모 ${x.noteFields} · 연결설정 ${x.assign}</small>`;found.append(d)});

  const report=()=>{
    const lines=["[교육과정 복구 진단]","저장소:"];
    for(const key of knownKeys){const hit=captured.find(x=>x.storeName==="localStorage"&&x.key===key);lines.push(`- ${key}: ${hit?`있음 ${hit.bytes}자`:"없음"}`)}
    lines.push(`- 해설 빈칸 묶음: ${sideExp}`);lines.push(`- 적용 시 고려 빈칸 묶음: ${sideCon}`);lines.push("후보:");
    candidates.forEach((x,i)=>lines.push(`${i+1}) ${x.storeName}/${x.key} :: ${x.path||"(root)"} :: 빈칸 ${x.blanks}, 내용/메모 ${x.noteFields}, 연결 ${x.assign}, 시간 ${x.time?new Date(x.time).toLocaleString("ko-KR"):"없음"}`));
    return lines.join("\n");
  };
  document.getElementById("copy").onclick=async()=>{const text=report();try{await navigator.clipboard.writeText(text);document.getElementById("copyStatus").textContent="복사됨"}catch{document.getElementById("copyStatus").textContent=text}};
})();
</script>
</body>
</html>
