/* 현재 DB에서 회차 후보 생성: 암기 대주제 1개 = 미션 1개, 진도 길 세트 1개 = 미션 1개 */
function plannerMemoryUnits(){
  const out=[];
  for(const subject of app.study.subjects||[]){
    for(const sheet of subject.sheets||[]){
      if(sheet.archived)continue;
      const rows=sheet.rows||[];
      const count=rows.filter(r=>r?.type!=="section"&&(r.correct||r.category||r.memo)).length;
      if(!count)continue;
      out.push({
        id:`m:${subject.id}:${sheet.id}:all`,
        kind:"memory",
        subject:subject.name||"암기",
        subjectId:subject.id,
        sheetId:sheet.id,
        rowId:"",
        title:`${subject.name} › ${sheet.name}`,
        detail:`시트 전체 · ${count}항목`,
        weight:Math.max(1,Math.sqrt(count))
      });
    }
  }
  return out;
}
function plannerPathKey(sheetId,order,setIndex){return `${sheetId}:${order}:${setIndex}`}
function plannerPathUnits(sheetIds=null,{includeArchived=false}={}){
  const out=[];
  const wanted=sheetIds?new Set(sheetIds):null;
  for(const sheet of (app.bank.sheets||[]).filter(x=>!x.legacyWrong&&(includeArchived||!x.archived)&&(!wanted||wanted.has(x.id)))){
    try{
      const state=adventureSheetState(sheet.id),order=state.activeOrder==="random"?"random":"sequence";
      const cfg=adventureConfig(sheet.id,{quiet:true,order});if(!cfg)continue;
      const meta=bankSheetMeta(sheet),total=adventureSetCount(cfg);
      for(let i=0;i<total;i++){
        const ids=adventureSetIds(cfg,i),n=ids.length;if(!n)continue;
        out.push({
          id:`bp:${sheet.id}:${order}:${i}`,kind:"bankPath",subject:meta.subject||"문제은행",
          sheetId:sheet.id,order,setIndex:i,pathKey:plannerPathKey(sheet.id,order,i),
          title:`${meta.subject||"문제은행"} › ${meta.area||sheet.name} › ${i+1}세트`,
          detail:`${order==="random"?"랜덤길":"순서길"} · ${n}문제`,weight:1,
          problemIds:[...ids]
        });
      }
    }catch(err){console.warn("planner path skipped",sheet?.name,err)}
  }
  return out;
}
function plannerBaseKey(){
  const sheetSig=(app.bank.sheets||[]).filter(s=>!s.legacyWrong).map(s=>`${s.id}:${s.archived?1:0}:${(s.items||[]).length}`).join(",");
  const studySig=(app.study.subjects||[]).map(x=>`${x.id}:${(x.sheets||[]).map(s=>`${s.id}:${s.archived?1:0}:${(s.rows||[]).length}`).join(",")}`).join("|");
  const pathSig=Object.entries(app.ui.quizAdventure?.configs||{}).map(([id,state])=>{
    const order=state?.activeOrder||"sequence",cfg=state?.paths?.[order]||{};
    return `${id}:${order}:${cfg.size||20}:${(cfg.orderIds||[]).length}`;
  }).join("|");
  return `${studySig}__${sheetSig}__${pathSig}`;
}
function plannerBaseUnits(){
  const key=plannerBaseKey();if(plannerBaseCache.key===key)return plannerBaseCache;
  const raw=[...plannerMemoryUnits(),...plannerPathUnits()],buckets=new Map();
  for(const u of raw){
    const k=`${u.kind}:${u.subject}`;
    if(!buckets.has(k))buckets.set(k,[]);
    buckets.get(k).push(u);
  }
  const groups=[...buckets.values()],units=[];let remaining=true;
  while(remaining){
    remaining=false;
    for(const g of groups){if(g.length){units.push(g.shift());remaining=true}}
  }
  plannerBaseCache={key,units,map:new Map(units.map(u=>[u.id,u]))};return plannerBaseCache;
}
function plannerUnitByMission(m){
  if(!m)return null;
  return {...m};
}

/* 회차 생성 시 전체 미션을 기간 전체에 한 번만 고정 배정 */
function plannerSnapshotMissions(start,end,scope=null){
  let base;
  if(scope){
    const memorySet=new Set(scope.memorySheetIds||[]);
    const bankIds=[...(scope.bankSheetIds||[])];
    const scopedMemory=plannerMemoryUnits().filter(u=>memorySet.has(u.sheetId));
    const scopedBank=plannerPathUnits(bankIds);
    const buckets=new Map();
    for(const u of [...scopedMemory,...scopedBank]){
      const k=`${u.kind}:${u.subject}`;
      if(!buckets.has(k))buckets.set(k,[]);
      buckets.get(k).push(u);
    }
    const groups=[...buckets.values()];base=[];let remaining=true;
    while(remaining){
      remaining=false;
      for(const g of groups){if(g.length){base.push(g.shift());remaining=true}}
    }
  }else{
    base=plannerBaseUnits().units;
  }
  const dates=plannerDates(start,end);
  if(!dates.length)return [];
  const loads=dates.map(()=>0),counts=dates.map(()=>0);
  const p=plannerStore();
  return base.map(u=>{
    let best=0,bestScore=Infinity;
    for(let i=0;i<dates.length;i++){
      const score=loads[i]+counts[i]*0.45;
      if(score<bestScore-1e-9){bestScore=score;best=i}
    }
    const weight=Number(u.weight)||1;
    loads[best]+=weight;counts[best]++;
    const mission={
      id:u.id,date:dates[best],kind:u.kind,subject:u.subject||"",
      title:u.title||"",detail:u.detail||"",
      subjectId:u.subjectId||"",sheetId:u.sheetId||"",rowId:u.rowId||"",
      order:u.order||"",setIndex:Number.isFinite(u.setIndex)?u.setIndex:null,
      pathKey:u.pathKey||"",weight
    };
    if(u.kind==="bankPath"){
      mission.pathBaseline=Number(p.pathProgress[u.pathKey]?.count)||0;
      mission.problemIds=Array.isArray(u.problemIds)?[...u.problemIds]:[];
      if(!mission.problemIds.length){
        const cfg=adventureConfig(u.sheetId,{quiet:true,order:u.order||"sequence"});
        mission.problemIds=cfg?adventureSetIds(cfg,u.setIndex):[];
      }
      mission.completionMode="round-v2";
    }
    return mission;
  }).sort((x,y)=>x.date.localeCompare(y.date));
}
function plannerNextRoundNumber(){
  const nums=plannerStore().rounds.map(r=>Number(String(r.name||"").match(/^(\d+)회독$/)?.[1])||0);
  return Math.max(0,...nums)+1;
}
function plannerRoundById(id){return plannerStore().rounds.find(r=>r.id===id)||null}
function plannerRepairMissingBankSnapshot(round,{persist=true}={}){
  if(!round||!Array.isArray(round.scope?.bankSheetIds)||!round.scope.bankSheetIds.length)return false;
  if(!Array.isArray(round.missions))round.missions=[];
  const represented=new Set(round.missions.filter(m=>m.kind==="bankPath").map(m=>m.sheetId));
  const missing=[...new Set(round.scope.bankSheetIds)].filter(id=>!represented.has(id)&&!!adventureSheet(id));
  if(!missing.length)return false;
  const repaired=plannerSnapshotMissions(round.start,round.end,{memorySheetIds:[],bankSheetIds:missing}).filter(m=>m.kind==="bankPath");
  if(!repaired.length)return false;
  round.missions.push(...repaired);
  round.missions.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.id||"").localeCompare(String(b.id||"")));
  round.progressSnapshotVersion=2;
  if(persist){
    plannerSaveLocal();
    if(cloudUser)plannerSaveRound(round);
  }
  return true;
}
function plannerRoundsForDate(date){return plannerStore().rounds.filter(r=>r.start<=date&&date<=(r.reviewDate||r.end))}
function plannerMissionDisplayDate(round,mission){
  if(plannerMissionDone(round,mission)){
    const completed=plannerMissionState(round,mission).completedDate;
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(completed||"")))return completed;
  }
  return mission.date;
}
function plannerMissionsForDate(round,date,{includeExcluded=false}={}){
  return (round?.missions||[]).filter(m=>plannerMissionDisplayDate(round,m)===date&&(includeExcluded||!plannerMissionExcluded(round,m)));
}
function plannerMissionStateKey(roundId,missionId){return `${roundId}::${missionId}`}
function plannerMissionState(round,mission){return plannerStore().missionState[plannerMissionStateKey(round.id,mission.id)]||{}}
function plannerMissionExcluded(round,mission){return !!plannerMissionState(round,mission).excluded}
function plannerMissionDone(round,mission){
  if(!round||!mission||plannerMissionExcluded(round,mission))return false;
  if(mission.kind==="roundWrong"){
    if(round.wrongReviewDone||plannerMissionState(round,mission).done)return true;
    return plannerToday()>=(mission.date||round.reviewDate||round.end)&&!(round.wrongIds||[]).length;
  }
  if(mission.kind==="bankPath"){
    if(mission.completionMode==="round-v2")return !!plannerMissionState(round,mission).done;
    const count=Number(plannerStore().pathProgress[mission.pathKey]?.count)||0;
    return count>Number(mission.pathBaseline||0);
  }
  return !!plannerMissionState(round,mission).done;
}
function plannerRoundProgress(round){
  const missions=(round?.missions||[]).filter(m=>!plannerMissionExcluded(round,m));
  const done=missions.filter(m=>plannerMissionDone(round,m)).length;
  return {done,total:missions.length,remaining:Math.max(0,missions.length-done)};
}

function plannerRealtimeText(){

function plannerBackfillCompletedDates(date=plannerToday()){
  if(!cloudUser)return 0;
  const p=plannerStore(),todo=[];
  for(const round of p.rounds){
    for(const mission of (round.missions||[])){
      if(plannerMissionExcluded(round,mission)||!plannerMissionDone(round,mission))continue;
      if(plannerMissionState(round,mission).completedDate)continue;
      todo.push([round,mission]);
    }
  }
  todo.forEach(([round,mission])=>plannerSetMissionState(round,mission,{completedDate:date}));
  return todo.length;
}

async function plannerSyncNow({quiet=false}={}){
  if(!cloudUser){if(!quiet)toast("로그인이 필요합니다");return false}
  plannerSetRealtime("syncing");
  try{
    /* 이 기기에서 막 보낸 체크/진도 저장이 있으면 먼저 서버 전송을 끝낸 뒤 내려받음 */
    await plannerWaitPendingWrites();

    const uid=cloudUser.uid;
    const [roundSnap,stateSnap,manualSnap,logSnap,pathSnap]=await Promise.all([
      getDocsFromServer(collection(db,"users",uid,"planner7Rounds")),
      getDocsFromServer(collection(db,"users",uid,"planner7MissionState")),
      getDocsFromServer(collection(db,"users",uid,"planner7Manual")),
      getDocsFromServer(collection(db,"users",uid,"planner7Logs")),
      getDocsFromServer(collection(db,"users",uid,"planner7Paths"))
    ]);

    const p=plannerStore();

    const localDirtyRounds=(p.rounds||[]).filter(r=>r?._localDirty).map(r=>({...r}));
    const rounds=[];
    roundSnap.forEach(ds=>{
      const r=ds.data();
      if(r?.id&&r.start&&r.end&&Array.isArray(r.missions))rounds.push(r);
    });
    for(const local of localDirtyRounds){
      const i=rounds.findIndex(r=>r.id===local.id);
      if(i<0)rounds.push(local);else if((local.createdAt||0)>=(rounds[i].createdAt||0))rounds[i]=local;
    }
    rounds.sort((a,b)=>a.start.localeCompare(b.start));
    p.rounds=rounds;

    const dirtyLocal={};
    for(const [key,value] of Object.entries(p.missionState||{})){
      if(value?.dirty)dirtyLocal[key]={...value};
    }
    const states={};
    stateSnap.forEach(ds=>{
      const d=ds.data();
      if(!d?.roundId||!d?.missionId)return;
      states[plannerMissionStateKey(d.roundId,d.missionId)]={
        done:!!d.done,excluded:!!d.excluded,
        completedDate:/^\d{4}-\d{2}-\d{2}$/.test(String(d.completedDate||""))?d.completedDate:"",
        updatedAt:Number(d.updatedAt)||0
      };
    });
    for(const [key,value] of Object.entries(dirtyLocal)){
      const remote=states[key];
      if(!remote||(Number(value.updatedAt)||0)>(Number(remote.updatedAt)||0))states[key]=value;
    }
    p.missionState=states;

    const manual={};
    manualSnap.forEach(ds=>{
      const d=ds.data();if(!d?.date)return;
      if(!manual[d.date])manual[d.date]=[];
      manual[d.date].push({...d,id:ds.id});
    });
    Object.values(manual).forEach(arr=>arr.sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0)));
    p.manual=manual;

    const logs={};
    logSnap.forEach(ds=>{
      const d=ds.data();
      logs[ds.id]={memory:Number(d.memory)||0,bank:Number(d.bank)||0,typing:Number(d.typing)||0};
    });
    p.logs=logs;

    const paths={};
    pathSnap.forEach(ds=>{
      const d=ds.data();if(!d?.pathKey)return;
      paths[d.pathKey]={count:Number(d.count)||0,lastAt:Number(d.lastAt)||0};
    });
    p.pathProgress=paths;

    /* 기존 완료분은 이번 전환 시점의 실제 완료일(오늘)로 한 번만 보정 */
    plannerBackfillCompletedDates(plannerToday());

    plannerRealtime.lastAt=Date.now();
    plannerSaveLocal();
    if(bankStatsHydrated)reconcilePlannerDoneIntoAdventure({persist:true});
    plannerSetRealtime("saved");
    plannerScheduleUiRender();
    if(!document.getElementById("bankEditView")?.classList.contains("hidden"))plannerOfferExistingTrashMissionCleanup();
    if(!quiet)toast("동기화 완료");
    return true;
  }catch(e){
    plannerSignalError("sync",e);
    if(!quiet)toast("동기화 실패 · 현재 기기 기록은 유지됨");
    return false;
  }
}
function plannerSaveRound(round){
  if(!round)return Promise.resolve(false);
  round._localDirty=true;plannerSaveLocal();
  if(!cloudUser)return Promise.resolve(false);
  const payload={...round};delete payload._localDirty;
  const write=setDoc(plannerRoundDoc(cloudUser.uid,round.id),payload);
  plannerQueueWrite(write);
  write.then(()=>{if(round._localDirty){delete round._localDirty;plannerSaveLocal()}}).catch(()=>{});
  return write;
}

  round.missions.push({id:`rw:${roundId}`,roundId,date:reviewDate,kind:"roundWrong",subject:"오답",title:`${roundName} 오답 데이`,detail:"이 회독에서 틀린 문제만 다시 풀기",weight:1,completionMode:"round-v2"});
  p.rounds.push(round);p.rounds.sort((a,b)=>a.start.localeCompare(b.start));
  app.ui.activePlannerRoundId=round.id;

function plannerSetMissionState(round,mission,patch){
  if(!round||!mission)return;
  const p=plannerStore(),key=plannerMissionStateKey(round.id,mission.id),prev=p.missionState[key]||{};
  const next={
    done:patch.done!==undefined?!!patch.done:!!prev.done,
    excluded:patch.excluded!==undefined?!!patch.excluded:!!prev.excluded,
    completedDate:patch.completedDate!==undefined?String(patch.completedDate||""):String(prev.completedDate||""),
    updatedAt:Date.now(),
    dirty:true
  };
  p.missionState[key]=next;
  plannerSaveLocal();
  plannerScheduleUiRender();
  if(!cloudUser)return Promise.resolve(next);
  const write=setDoc(plannerStateDoc(cloudUser.uid,round.id,mission.id),{
    roundId:round.id,missionId:mission.id,
    done:next.done,excluded:next.excluded,
    completedDate:next.completedDate,
    updatedAt:next.updatedAt
  },{merge:true});
  plannerQueueWrite(write);
  write.then(()=>{
    const cur=plannerStore().missionState[key];
    if(cur&&cur.updatedAt===next.updatedAt){delete cur.dirty;plannerSaveLocal()}
  }).catch(()=>{});
  return write;
}
function plannerToggleMission(round,mission){
  if(mission.kind==="roundWrong")return openPlannerUnit(mission,round);

    return toast(plannerMissionDone(round,mission)?"진도 길에서 완료된 세트입니다":"진도 길 세트를 끝내면 자동 완료됩니다");
  }
  const willDone=!plannerMissionDone(round,mission);
  plannerSetMissionState(round,mission,{done:willDone,completedDate:willDone?plannerToday():""});
}

}
function plannerRestoreMission(round,mission){plannerSetMissionState(round,mission,{excluded:false})}
function plannerPendingMissionsForBankSheet(sheetId){
  const out=[],prefix=`${sheetId}:`,idPrefix=`bp:${sheetId}:`;
  for(const round of plannerStore().rounds){
    for(const mission of (round.missions||[])){
      if(mission.kind!=="bankPath")continue;
      const sameSheet=mission.sheetId===sheetId
        ||String(mission.pathKey||"").startsWith(prefix)
        ||String(mission.id||"").startsWith(idPrefix);
      if(!sameSheet)continue;
      if(plannerMissionExcluded(round,mission)||plannerMissionDone(round,mission))continue;
      out.push([round,mission]);
    }
  }
  return out;
}
function plannerExcludePendingBankSheetMissions(sheetId){
  const targets=plannerPendingMissionsForBankSheet(sheetId);
  if(!targets.length)return 0;
  for(const [round,mission] of targets)plannerSetMissionState(round,mission,{excluded:true});
  return targets.length;
}
let plannerTrashCleanupPromptSig="";
function plannerOfferExistingTrashMissionCleanup(){
  const groups=[];
  for(const sheet of app.bank.trashSheets||[]){
    const pending=plannerPendingMissionsForBankSheet(sheet.id);
    if(pending.length)groups.push({sheet,pending});
  }
  const total=groups.reduce((n,g)=>n+g.pending.length,0);
  if(!total)return;

  const sig=groups.map(g=>`${g.sheet.id}:${g.pending.length}`).sort().join("|");
  if(plannerTrashCleanupPromptSig===sig)return;
  plannerTrashCleanupPromptSig=sig;

  setTimeout(()=>{
    const names=groups.slice(0,4).map(g=>`${g.sheet.name} ${g.pending.length}개`).join("\n");
    const more=groups.length>4?`\n외 ${groups.length-4}개 시트`:"";
    if(!confirm(
      `휴지통에 보낸 시트의 미완료 회독 미션이 ${total}개 남아 있습니다.\n\n${names}${more}\n\n`+
      `한꺼번에 회독에서 제외할까요?\n완료 기록과 다른 시트 미션은 그대로 유지됩니다.`
    ))return;
    let excluded=0;
    for(const g of groups)excluded+=plannerExcludePendingBankSheetMissions(g.sheet.id);
    plannerTrashCleanupPromptSig="";
    renderWidePlannerSide();
    if(app.study.mode==="planner")renderPlanner();
    toast(`휴지통 시트 회독 미션 ${excluded}개 제외`);
  },80);
}

/* 진도 길 완료 이벤트: 세트별 카운터를 원자적으로 +1, 모든 기기에서 실시간 공유 */
function plannerRecordPathProgress(adv){
  if(!adv||adv.review||adv.setIndex==null)return;
  const pathKey=plannerPathKey(adv.sheetId,adv.order||"sequence",Number(adv.setIndex));
  const p=plannerStore(),prev=Number(p.pathProgress[pathKey]?.count)||0,now=Date.now();
  p.pathProgress[pathKey]={count:prev+1,lastAt:now};
  plannerSaveLocal();
  const completedDate=plannerToday();
  for(const round of p.rounds){
    for(const mission of (round.missions||[])){
      if(mission.kind!=="bankPath"||mission.pathKey!==pathKey||plannerMissionExcluded(round,mission))continue;
      if(plannerMissionDone(round,mission)&&!plannerMissionState(round,mission).completedDate){
        plannerSetMissionState(round,mission,{completedDate});
      }
    }
  }
  plannerScheduleUiRender();
  if(!cloudUser)return;
  plannerQueueWrite(setDoc(plannerPathDoc(cloudUser.uid,pathKey),{
    pathKey,count:increment(1),lastAt:now
  },{merge:true}));
}
/* 뽀개기에서 이미 완료로 확인되는 진도 미션이 있는데 진도길 completed가 유실된 경우만 복구한다.
   회독 snapshot/미션 ID/기존 완료 세트는 바꾸지 않는다. */
function reconcilePlannerDoneIntoAdventure({persist=true}={}){
  const p=plannerStore();let changed=0;
  for(const round of p.rounds||[]){
    for(const mission of round.missions||[]){
      if(mission.kind!=="bankPath"||plannerMissionExcluded(round,mission)||!plannerMissionDone(round,mission))continue;
      const sheet=adventureSheet(mission.sheetId);if(!sheet)continue;
      const order=mission.order==="random"?"random":"sequence";
      const cfg=adventureConfig(mission.sheetId,{quiet:true,order});if(!cfg)continue;
      const i=Number(mission.setIndex);if(!Number.isInteger(i)||i<0||!adventureSetIds(cfg,i).length)continue;
      if(cfg.completed?.[String(i)])continue;
      const lastAt=Number(p.pathProgress?.[mission.pathKey]?.lastAt)||Date.now();
      cfg.completed[String(i)]={completedAt:lastAt,correct:0,wrong:0,reviewCount:0};
      cfg.lastTouchedAt=Math.max(Number(cfg.lastTouchedAt)||0,lastAt);changed++;
    }
  }
  if(changed){
    adventureStructureDirty=true;
    saveLocal();
    if(persist)flushAdventureStructureCloud();
    renderQuiz();
  }
  return changed;
}

/* 원본 열기 */
function plannerMissionIsCurrent(mission){
  if(!mission)return false;
  const ws=app.ui.workspace||"memory";
  if(mission.kind==="memory"){
    if(ws!=="memory"||app.study.mode!=="study")return false;
    const subject=(app.study.subjects||[]).find(x=>x.id===mission.subjectId);
    return !!subject&&app.study.subjectId===mission.subjectId&&subject.currentId===mission.sheetId;
  }
  if(mission.kind==="roundWrong")return !!quizSession?.roundWrongReview&&quizSession.plannerRoundId===mission.roundId;
  if(mission.kind==="bankPath"){
    if(ws!=="bank"||(app.ui.bankMode||"quiz")!=="quiz")return false;
    const adv=quizSession?.adventure;
    if(adv){
      return adv.sheetId===mission.sheetId
        && String(adv.order||quizSession.quizOrder||"sequence")===String(mission.order||"sequence")
        && Number(adv.setIndex)===Number(mission.setIndex);
    }
    const active=app.ui.activePlannerMissionId||"";
    return active===mission.id&&app.ui.quizHomeMode==="path";
  }
  return false;
}

async function openPlannerUnit(unit,round=null){
  if(!unit)return;
  app.ui.activePlannerMissionId=unit.id||"";
  if(unit.kind==="memory"){
    if(round?.id)app.ui.activePlannerRoundId=round.id;
    const subject=(app.study.subjects||[]).find(x=>x.id===unit.subjectId);
    const sheet=subject?.sheets?.find(x=>x.id===unit.sheetId);
    if(!subject||!sheet){
      app.ui.activePlannerMissionId="";
      saveLocal();renderWidePlannerSide();
      return toast("현재 암기판에서 이 미션의 원본을 찾지 못했습니다");
    }
    suspendQuizForWorkspaceNavigation();
    app.study.subjectId=subject.id;subject.currentId=sheet.id;app.study.mode="study";app.ui.workspace="memory";app.ui.typingPractice=true;
    saveLocalNow();render();
    if(unit.rowId)setTimeout(()=>document.querySelector(`[data-study-row-id="${CSS.escape(unit.rowId)}"]`)?.scrollIntoView({block:"start",behavior:"auto"}),50);
    return;
  }
  if(unit.kind==="roundWrong"){
    const rr=round||plannerRoundById(unit.roundId||"");
    if(!rr)return toast("회독을 찾지 못했습니다");
    suspendQuizForWorkspaceNavigation();startRoundWrongReview(rr,unit);return;
  }
  if(unit.kind==="bankPath"){
    /* 새로고침 직후 IndexedDB 복원이 끝나기 전에 눌러도 원본 시트를 기다린다. */
    if(bankCacheReadyPromise)await bankCacheReadyPromise;
    let sheet=adventureSheet(unit.sheetId);
    if(!sheet&&cloudUser){
      try{
        const snap=await getDocFromServer(bankSheetDoc(cloudUser.uid,unit.sheetId));
        if(snap.exists()){
          const fresh=snap.data();
          const i=(app.bank.sheets||[]).findIndex(x=>x.id===unit.sheetId);
          if(i>=0)app.bank.sheets[i]=fresh;else app.bank.sheets.push(fresh);
          await writeBankCacheNow();
          saveLocalNow();
          sheet=adventureSheet(unit.sheetId);
        }
      }catch(e){console.warn("planner source fetch failed",e)}
    }
    if(!sheet){
      app.ui.activePlannerMissionId="";
      saveLocal();renderWidePlannerSide();
      return toast("현재 문제은행에서 이 진도 길을 찾지 못했습니다");
    }
    setAdventureOrder(unit.sheetId,unit.order);
    adventureStore().activeSheetId=unit.sheetId;
    app.ui.workspace="bank";app.ui.bankMode="quiz";app.ui.quizHomeMode="path";
    saveLocalNow();renderMode();
    const cfg=adventureConfig(unit.sheetId,{quiet:true,order:unit.order});
    if(round&&unit.completionMode==="round-v2")startAdventureRoundMission(round,unit);
    else startAdventureSet(unit.sheetId,unit.setIndex,{replay:!!cfg?.completed?.[String(unit.setIndex)]});
    renderWidePlannerSide();
  }
}
let plannerUiRenderTimer=0;
let plannerMissionInteractionUntil=0;
const plannerMissionActionLocks=new Set();
/* iPad/Safari는 pointerup 뒤 합성 click의 hit-test를 새 DOM에서 다시 하면서
   방금 눌렀던 행이 사라지거나 이동하면 바로 아래 행이 눌릴 수 있다.
   보조패널의 터치는 pointerup에서 원래 미션에 고정하고, 이어지는 합성 click 1회는 좌표 기준으로 삼킨다. */
let plannerSyntheticClickGuard={until:0,x:0,y:0};
document.addEventListener("click",e=>{
  const g=plannerSyntheticClickGuard;
  if(!g.until||Date.now()>g.until)return;
  const dx=Number(e.clientX||0)-g.x,dy=Number(e.clientY||0)-g.y;
  if((dx*dx+dy*dy)<=1600){
    e.preventDefault();
    e.stopImmediatePropagation();
    plannerSyntheticClickGuard={until:0,x:0,y:0};
  }
},true);
function plannerScheduleUiRender(){
  if(plannerUiRenderTimer)clearTimeout(plannerUiRenderTimer);
  const wait=Math.max(0,plannerMissionInteractionUntil-Date.now());
  plannerUiRenderTimer=setTimeout(()=>{
    plannerUiRenderTimer=0;
    if(app.study.mode==="planner")renderPlanner();
    renderWidePlannerSide();
    if(!document.getElementById("mobileMissionBackdrop")?.classList.contains("hidden"))renderMobileMissionSheet();
    updatePlannerQuickButton();
  },wait+24);
}
function plannerTaskRow(round,mission,{compact=false}={}){
  const done=plannerMissionDone(round,mission),row=document.createElement("div");
  const missionKey=plannerMissionStateKey(round.id,mission.id);
  row.className="planner-task"+(done?" done":"")+(compact?" planner-task-compact":"")+(plannerMissionIsCurrent(mission)?" current":"")+(mission.kind==="roundWrong"?" round-wrong":"");
  row.dataset.missionKey=missionKey;

  const run=(e,fn)=>{
    e.preventDefault();e.stopPropagation();
    const now=Date.now();
    if(now<plannerMissionInteractionUntil||plannerMissionActionLocks.has(missionKey))return;
    plannerMissionInteractionUntil=now+460;
    plannerMissionActionLocks.add(missionKey);
    try{fn()}finally{setTimeout(()=>plannerMissionActionLocks.delete(missionKey),500)}
  };
  const bindAction=(button,fn)=>{
    let pointerId=null,startX=0,startY=0,armed=false;
    button.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse"||e.isPrimary===false)return;
      pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;armed=true;
    });
    button.addEventListener("pointermove",e=>{
      if(!armed||e.pointerId!==pointerId)return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      if(dx*dx+dy*dy>144)armed=false; // 12px 이상 움직였으면 스크롤로 취급
    });
    button.addEventListener("pointercancel",e=>{
      if(e.pointerId===pointerId){pointerId=null;armed=false}
    });
    button.addEventListener("pointerup",e=>{
      if(e.pointerType==="mouse"||e.pointerId!==pointerId)return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      const fire=armed&&(dx*dx+dy*dy<=144);
      pointerId=null;armed=false;
      if(!fire)return;
      plannerSyntheticClickGuard={until:Date.now()+650,x:e.clientX,y:e.clientY};
      run(e,fn);
    });
    button.addEventListener("click",e=>{
      // 마우스/키보드는 일반 click 경로를 사용한다. 터치 뒤 합성 click은 위 capture guard가 먼저 차단한다.
      run(e,fn);
    });
  };

  const check=document.createElement("button");check.type="button";check.className="planner-task-check";
  check.textContent=done?"✓":"○";
  bindAction(check,()=>mission.kind==="roundWrong"?openPlannerUnit(mission,round):plannerToggleMission(round,mission));
  if(mission.kind==="bankPath")check.title=done?"이번 회독에서 완료된 세트":"이 회독 세트를 끝내면 자동 완료";
  if(mission.kind==="roundWrong")check.title=done?"오답 복습 완료":"오답 데이 시작";

  const text=document.createElement("button");text.type="button";text.className="planner-task-text planner-task-link";
  const title=document.createElement("span");title.textContent=mission.title;
  const sub=document.createElement("small");sub.textContent=mission.kind==="roundWrong"?`이 회독 오답 ${(round.wrongIds||[]).length}문제 · 전부 맞힐 때까지`:(mission.detail||"");
  text.append(title,sub);
  bindAction(text,()=>openPlannerUnit(mission,round));

  const exclude=document.createElement("button");exclude.type="button";exclude.className="planner-task-exclude";exclude.textContent="제외";
  bindAction(exclude,()=>plannerExcludeMission(round,mission));

  row.append(check,text,exclude);return row;
}
function plannerExcludedBlock(round){
  const excluded=(round.missions||[]).filter(m=>plannerMissionExcluded(round,m));
  if(!excluded.length)return null;

}

  const area=document.getElementById("plannerArea");if(!area)return;
  // iOS 날짜 선택기/체크박스를 만지는 동안 Firestore 응답이 와도 폼 DOM을 갈아치우지 않는다.
  // 폼이 재생성되면 native picker가 닫히거나 체크가 원상복구되어 "화면이 종료되는" 것처럼 보인다.

    const todayBtn=document.createElement("button");todayBtn.type="button";todayBtn.textContent="오늘";todayBtn.onclick=()=>plannerSelectDate(today);

        const prog=plannerRoundProgress(r),line=document.createElement("div");line.className="planner-v7-overview-row";
        const txt=document.createElement("span");txt.innerHTML=`<strong>${escapeHtml(r.name)}</strong> ${prog.done}/${prog.total} · ${prog.remaining} 남음`;

      const checked=draft.memorySheetIds.size+draft.bankSheetIds.size;
      const totalCount=catalog.memory.length+catalog.bank.length;
      scopeSummary.textContent=`범위 선택 · ${checked}/${totalCount}`;
    };
    const syncBuiltChecks=()=>{
      if(!scopeBuilt)return;
      scopeBox.querySelectorAll('input[data-planner-scope]').forEach(cb=>{
        const set=cb.dataset.plannerScope==="memory"?draft.memorySheetIds:draft.bankSheetIds;
        cb.checked=set.has(cb.value);
      });
    };
    const buildScope=()=>{
      if(scopeBuilt)return;scopeBuilt=true;
      const makeGroup=(titleText,items,type)=>{
        const group=document.createElement("div");group.className="planner-scope-group";
        const title=document.createElement("strong");title.textContent=titleText;group.append(title);
        const set=type==="memory"?draft.memorySheetIds:draft.bankSheetIds;
        for(const item of items){
          const label=document.createElement("label");label.className="planner-scope-item";
          const cb=document.createElement("input");cb.type="checkbox";cb.checked=set.has(item.id);cb.value=item.id;cb.dataset.plannerScope=type;
          cb.onchange=()=>{if(cb.checked)set.add(item.id);else set.delete(item.id);refreshScopeSummary();plannerTouchRoundForm(3000)};
          const txt=document.createElement("span");txt.innerHTML=`${escapeHtml(item.label)} <small>${item.count}${type==="memory"?"항목":"문제"}</small>`;
          label.append(cb,txt);group.append(label);
        }
        scopeBox.append(group);
      };
      makeGroup("암기판",catalog.memory,"memory");
      makeGroup("문제은행",catalog.bank,"bank");
      syncBuiltChecks();
    };
    allBtn.onclick=e=>{e.preventDefault();catalog.memory.forEach(x=>draft.memorySheetIds.add(x.id));catalog.bank.forEach(x=>draft.bankSheetIds.add(x.id));syncBuiltChecks();refreshScopeSummary();plannerTouchRoundForm(3000)};
    noneBtn.onclick=e=>{e.preventDefault();draft.memorySheetIds.clear();draft.bankSheetIds.clear();syncBuiltChecks();refreshScopeSummary();plannerTouchRoundForm(3000)};
    scopeTools.append(allBtn,noneBtn);scopeBox.append(scopeSummary,scopeTools);
    scopeBox.addEventListener("toggle",()=>{draft.scopeOpen=scopeBox.open;plannerTouchRoundForm(scopeBox.open?5000:1400);if(scopeBox.open)buildScope()});
    if(scopeBox.open)buildScope();
    refreshScopeSummary();

    const create=document.createElement("button");create.type="button";create.textContent="새 회독 만들기";create.onclick=plannerAddRound;
    form.append(name,startInput,endInput,scopeBox,create);rounds.append(form);
    const note=document.createElement("div");note.className="planner-note";
    note.textContent="선택한 범위만 새 회독에 고정합니다. 이미 진행 중인 회독은 바뀌지 않습니다. 이후 원본을 추가·수정해도 만들어진 회독 일정은 유지됩니다.";
    rounds.append(note);area.append(rounds);
  }catch(err){
    console.error("planner v7 render failed",err);
    area.innerHTML=`<div class="planner-empty"><strong>뽀개기 화면 오류</strong><small>${escapeHtml(String(err?.message||err||"알 수 없는 오류").slice(0,180))}</small></div>`;
  }
}

function renderWidePlannerSchedule(list,count,date){
  const p=plannerStore(),today=plannerToday(),pending=[],done=[];
  for(const round of p.rounds){
    for(const mission of plannerMissionsForDate(round,date)){
      (plannerMissionDone(round,mission)?done:pending).push([round,mission]);
    }
  }

  const overdue=[];
  /* 밀린 미션은 오늘을 볼 때만 함께 보여준다. 다른 날짜는 그 날짜의 미션만 표시 */
  if(date===today){
    for(const round of p.rounds){
      for(const mission of (round.missions||[])){
        if(mission.date<today&&!plannerMissionExcluded(round,mission)&&!plannerMissionDone(round,mission))overdue.push([round,mission]);
      }
    }
    overdue.sort((a,b)=>a[1].date.localeCompare(b[1].date));
  }

  const unfinished=overdue.length+pending.length;
  count.textContent=`${done.length}/${unfinished+done.length} 완료`;

  if(overdue.length){
    const label=document.createElement("div");label.className="wide-planner-label";label.textContent=`밀린 미션 ${overdue.length}`;
    list.append(label);
    overdue.forEach(([r,m])=>{
      const row=plannerTaskRow(r,m,{compact:true});
      const badge=document.createElement("small");badge.className="wide-planner-date";badge.textContent=m.date;
      row.querySelector(".planner-task-text")?.prepend(badge);
      list.append(row);
    });
  }
  pending.forEach(([r,m])=>list.append(plannerTaskRow(r,m,{compact:true})));

  if((overdue.length||pending.length)&&done.length){
    const line=document.createElement("div");line.className="wide-planner-divider";list.append(line);
  }
  done.forEach(([r,m])=>list.append(plannerTaskRow(r,m,{compact:true})));

  if(!overdue.length&&!pending.length&&!done.length){
    const empty=document.createElement("div");empty.className="wide-planner-empty";
    empty.textContent=date===today?"오늘 표시할 미션이 없습니다.":"이 날짜에 표시할 미션이 없습니다.";
    list.append(empty);
  }
}
function renderWidePlannerSide(){
  const side=document.getElementById("widePlannerSide"),list=document.getElementById("widePlannerList");
  const count=document.getElementById("widePlannerCount"),toggle=document.getElementById("widePlannerToggle");
  const todayTab=document.getElementById("widePlannerTodayTab"),songTab=document.getElementById("widePlannerSongTab");
  const dateNav=document.getElementById("widePlannerDateNav"),dateLabel=document.getElementById("widePlannerDateLabel");
  const datePicker=document.getElementById("widePlannerDatePicker"),todayButton=document.getElementById("widePlannerTodayButton");
  if(!side||!list||!count||!toggle||!todayTab||!songTab||!dateNav||!dateLabel||!datePicker||!todayButton)return;

  const eligible=widePlannerSideEligible();
  side.classList.toggle("eligible",eligible);
  document.body.classList.toggle("wide-planner-eligible",eligible);

  /* 보조패널은 태블릿 이상에서 항상 펼친 상태로 고정한다.
     기존 collapsed 값은 데이터 호환을 위해 남겨두되 UI에서는 사용하지 않는다. */
  side.classList.remove("collapsed");
  document.body.classList.remove("wide-planner-collapsed");
  toggle.hidden=true;

  todayTab.classList.toggle("active",widePlannerSideTab==="today");
  songTab.classList.toggle("active",widePlannerSideTab==="songs");
  todayTab.setAttribute("aria-selected",widePlannerSideTab==="today"?"true":"false");
  songTab.setAttribute("aria-selected",widePlannerSideTab==="songs"?"true":"false");

  const selectedDate=widePlannerSelectedDate(),today=plannerToday();
  const renderKey=`${widePlannerSideTab}:${widePlannerSideTab==="today"?selectedDate:"songs"}`;
  const keepScroll=renderKey===widePlannerLastRenderKey;
  const previousScrollTop=keepScroll?list.scrollTop:0;
  dateNav.classList.toggle("hidden",widePlannerSideTab!=="today");
  datePicker.value=selectedDate;
  const d=plannerDate(selectedDate);
  const md=`${d.getMonth()+1}/${d.getDate()}`;
  dateLabel.textContent=md;
  dateLabel.title=selectedDate;
  todayButton.disabled=selectedDate===today;
  todayButton.classList.toggle("current",selectedDate===today);

  list.innerHTML="";count.textContent="";
  widePlannerLastRenderKey=renderKey;
  if(!eligible)return;
  if(widePlannerSideTab==="songs")renderWidePlannerSongs(list,count);
  else renderWidePlannerSchedule(list,count,selectedDate);
  if(keepScroll)requestAnimationFrame(()=>{
    const max=Math.max(0,list.scrollHeight-list.clientHeight);
    list.scrollTop=Math.min(previousScrollTop,max);
  });
}
function toggleWidePlannerSide(){
  /* 2026-09: 태블릿 보조패널은 고정. 과거 접기 핸들 호환용 no-op. */
  app.ui.widePlannerCollapsed=false;

    const elapsed=c.endedAt-c.startedAt;
    text=`완료 · ${typingSpeed(c.targetChars,elapsed)}타 · ${formatTypingTime(elapsed)}`;
  }else if(c.startedAt){
    const elapsed=Math.max(0,Date.now()-c.startedAt);

  }
  badge.textContent=text;badge.classList.remove("hidden");

const FONT_DB_NAME="study-jew-fonts";
const FONT_DB_STORE="files";
let activeFontFace=null;
let activeFontUrl="";
function openFontDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(FONT_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FONT_DB_STORE))db.createObjectStore(FONT_DB_STORE)};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function saveFontBlob(blob,name){
  const db=await openFontDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(FONT_DB_STORE,"readwrite");
    tx.objectStore(FONT_DB_STORE).put({blob,name},"custom");
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
  db.close();
}
async function loadFontBlob(){
  const db=await openFontDb();
  const value=await new Promise((resolve,reject)=>{
    const tx=db.transaction(FONT_DB_STORE,"readonly");
    const req=tx.objectStore(FONT_DB_STORE).get("custom");
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
  });
  db.close();return value;
}
async function clearFontBlob(){
  const db=await openFontDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(FONT_DB_STORE,"readwrite");
    tx.objectStore(FONT_DB_STORE).delete("custom");
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
  db.close();
}
async function installLocalFont(blob){
  let url="";
  try{
    if(activeFontFace)document.fonts.delete(activeFontFace);
    if(activeFontUrl){URL.revokeObjectURL(activeFontUrl);activeFontUrl=""}
    url=URL.createObjectURL(blob);
    const face=new FontFace("StudyUserFont",`url(${url})`);
    await face.load();
    document.fonts.add(face);
    activeFontFace=face;
    activeFontUrl=url;
    document.documentElement.style.setProperty("--app-font-family",'"StudyUserFont", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif');
    document.documentElement.classList.add("custom-font-active");
    await document.fonts.ready;
    void document.documentElement.offsetWidth;
    return true;
  }catch(e){
    if(url&&url!==activeFontUrl)URL.revokeObjectURL(url);
    console.error(e);return false
  }
}

/* cloud: transient study answer text/user UI are NOT synchronized */
function cloudStudyPayload(){
  const copy=JSON.parse(JSON.stringify(app.study));
  delete copy.mode;delete copy.subjectId;delete copy.planner;
  copy.subjects.forEach(s=>{delete s.currentId;s.sheets.forEach(sh=>sh.rows.forEach(r=>{delete r.user;delete r.last;delete r.revealed}))});
  return copy;
}
function mergeCloudStudy(remote){
  const localPlanner=app.study.planner;
  const localTransient=new Map();
  app.study.subjects.forEach(s=>s.sheets.forEach(sh=>sh.rows.forEach(r=>{localTransient.set(r.id,{user:r.user||"",last:r.last||"",revealed:!!r.revealed})})));
  const localSubjectId=app.study.subjectId,localMode=app.study.mode;
  const localCurrent=new Map(app.study.subjects.map(s=>[s.id,s.currentId]));
  const incoming=JSON.parse(JSON.stringify(remote));
  incoming.subjects?.forEach(s=>{s.currentId=localCurrent.get(s.id)||s.sheets?.[0]?.id;s.sheets?.forEach(sh=>sh.rows?.forEach(r=>{const t=localTransient.get(r.id)||{};r.user=t.user||"";r.last=t.last||"";r.revealed=!!t.revealed}))});
  incoming.subjectId=incoming.subjects?.some(s=>s.id===localSubjectId)?localSubjectId:incoming.subjects?.[0]?.id;
  incoming.mode=localMode;
  incoming.planner=localPlanner;
  app.study=incoming;cleanup();saveLocal();
}
function studyContentCount(study=app.study){
  let n=0;
  for(const subject of study?.subjects||[]){
    for(const sheet of subject?.sheets||[]){
      for(const row of sheet?.rows||[]){
        if(!row)continue;
        if(row.type==="section"){
          if(String(row.title||"").trim())n++;
        }else if(String(row.category||row.correct||row.memo||"").trim())n++;
      }
    }
  }
  return n;
}
function currentStudySheetLooksEmpty(){
  try{
    const subject=(app.study.subjects||[]).find(x=>x.id===app.study.subjectId)||app.study.subjects?.[0];
    const sheet=subject?.sheets?.find(x=>x.id===subject.currentId)||subject?.sheets?.[0];
    return !sheet||!(sheet.rows||[]).some(r=>r&&(r.type==="section"?String(r.title||"").trim():String(r.category||r.correct||r.memo||"").trim()));
  }catch{return true}
}
let studyRecoveryPromise=null;
async function ensureStudyDataReady({force=false}={}){
  const localCount=studyContentCount();
  if(!force&&localCount>0&&!currentStudySheetLooksEmpty())return true;
  if(studyRecoveryPromise)return studyRecoveryPromise;
  studyRecoveryPromise=(async()=>{
    try{
      if(typeof auth.authStateReady==="function")await auth.authStateReady();
      const user=cloudUser||auth.currentUser;
      if(!user)return studyContentCount()>0;
      const snap=await getDocFromServer(studyDoc(user.uid));
      if(!snap.exists())return studyContentCount()>0;
      const d=snap.data(),remote=d.study;
      if(!remote)return studyContentCount()>0;
      const remoteCount=studyContentCount(remote);
      const shouldRestore=force
        || studyContentCount()===0
        || (currentStudySheetLooksEmpty()&&remoteCount>studyContentCount());
      if(shouldRestore){
        applyingRemote=true;
        mergeCloudStudy(remote);
        applyingRemote=false;
        restoreStudyDrafts();
        saveStudyQuickNow();
        saveLocal();
        render();
      }
      return studyContentCount()>0||remoteCount===0;
    }catch(e){
      console.warn("study recovery failed",e);
      return studyContentCount()>0;
    }finally{
      studyRecoveryPromise=null;
    }
  })();
  return studyRecoveryPromise;
}
async function openMemoryWorkspace(){
  suspendQuizForWorkspaceNavigation();
  const alreadyInMemoryStudy=(app.ui.workspace||"memory")==="memory"&&app.study.mode==="study";
  app.ui.workspace="memory";
  if(app.study.mode==="songs"||app.study.mode==="planner"||app.study.mode==="edit")app.study.mode="study";
  if(!alreadyInMemoryStudy)app.ui.typingPractice=true;
  saveLocal();
  renderMode();
  if(studyContentCount()===0||currentStudySheetLooksEmpty()){
    updateSync("…",!!(cloudUser||auth.currentUser));
    await ensureStudyDataReady();
    updateSync((cloudUser||auth.currentUser)?"✓":"로그인",!!(cloudUser||auth.currentUser));
    renderMode();
    renderStudy();
  }
}

onAuthStateChanged(auth,async user=>{
  cloudUser=user;
  bankStatsHydrated=false;
  adventureStructureDirty=false;
  for(const fn of [studyUnsub,plannerRoundsUnsub,plannerChecksUnsub,plannerManualUnsub,plannerLogsUnsub,bankIndexUnsub,bankStatsUnsub]){
    if(fn)try{fn()}catch{}
  }
  studyUnsub=plannerRoundsUnsub=plannerChecksUnsub=plannerManualUnsub=plannerLogsUnsub=bankIndexUnsub=bankStatsUnsub=null;
  plannerRealtime={state:user?"syncing":"off",uid:user?.uid?user.uid.slice(-6):"",lastAt:0,error:"",channels:{}};
  renderSubjects();if(!user){if(app.study.mode==="planner")renderPlanner();return}
  updateSync("…",true);
  try{
    const sref=studyDoc(user.uid);
    let ss;
    try{ss=await getDocFromServer(sref)}catch(e){console.warn("study server read fallback",e);ss=await getDoc(sref)}
    let legacyPlanner=null;
    if(ss.exists()){
      const d=ss.data();legacyPlanner=d.study?.planner||null;
      const localEmpty=studyContentCount()===0;
      const remoteHasContent=studyContentCount(d.study)>0;
      if(d.study&&((d.updatedAt||0)>(app.study.updatedAt||0)||(localEmpty&&remoteHasContent))){
        applyingRemote=true;mergeCloudStudy(d.study);applyingRemote=false;
        restoreStudyDrafts();saveStudyQuickNow();render();
      }else scheduleStudyCloud();
    }else scheduleStudyCloud();

    await plannerV7Init(user);

    studyUnsub=onSnapshot(sref,snap=>{
      if(!snap.exists())return;
      const d=snap.data();
      if(d.study&&(d.updatedAt||0)>(app.study.updatedAt||0)){
        applyingRemote=true;mergeCloudStudy(d.study);applyingRemote=false;render();
      }
    },err=>console.error("study realtime",err));

    await bankCacheReadyPromise;
    const bref=bankIndexDoc(user.uid),bi=await getDoc(bref);
    if(bi.exists()){
      const d=bi.data();
      if((d.updatedAt||0)>(app.bank.contentUpdatedAt||0))await loadBankFromCloud(user.uid,d);
    }else if(app.bank.sheets.length)await syncImportedBankSheets(app.bank.sheets);

    bankIndexUnsub=onSnapshot(bref,async snap=>{
      if(!snap.exists())return;
      const d=snap.data();
      if((d.updatedAt||0)>(app.bank.contentUpdatedAt||0))await loadBankFromCloud(user.uid,d);
    },err=>console.error("bank index realtime",err));

    const statRef=bankStatsDoc(user.uid),stat=await getDoc(statRef);
    const remoteStatsAt=stat.exists()?(stat.data().updatedAt||0):0;
    const localStatsWereNewer=(app.bank.statsUpdatedAt||0)>remoteStatsAt;
    if(stat.exists()){
      const d=stat.data();
      if((d.updatedAt||0)>(app.bank.statsUpdatedAt||0)){
        app.bank.stats=d.stats||{};
        if(d.adventure&&typeof d.adventure==="object")app.ui.quizAdventure=d.adventure;
        app.bank.statsUpdatedAt=d.updatedAt||0;saveLocal();renderQuiz();
        if(app.study.mode==="planner")renderPlanner();
      }
    }
    // 서버 상태를 먼저 받은 뒤 누락 문제를 기존 길 뒤에 보정하고, 뽀개기 완료분이 진도길에서 빠졌으면 복구한다.
    reconcileExistingAdventureRoutes({persist:false});
    reconcilePlannerDoneIntoAdventure({persist:false});
    bankStatsHydrated=true;
    if(!flushAdventureStructureCloud()&&(localStatsWereNewer||!stat.exists()))scheduleBankStatsCloud();
    bankStatsUnsub=onSnapshot(statRef,snap=>{
      if(!snap.exists())return;
      const d=snap.data();
      if((d.updatedAt||0)<(app.bank.statsUpdatedAt||0))return;
      applyingRemote=true;
      app.bank.stats=d.stats||{};
      if(d.adventure&&typeof d.adventure==="object")app.ui.quizAdventure=d.adventure;
      app.bank.statsUpdatedAt=d.updatedAt||Date.now();saveLocal();
      applyingRemote=false;
      reconcileExistingAdventureRoutes({persist:false});
      reconcilePlannerDoneIntoAdventure({persist:false});
      flushAdventureStructureCloud();
      renderQuiz();if(app.study.mode==="planner")renderPlanner();
    },err=>console.error("bank stats realtime",err));

    updateSync("✓",true);
  }catch(e){
    console.error(e);
    plannerSetRealtime("error",e.code||e.message||"연결 실패");
    updateSync(e.code==="permission-denied"?"규칙":"!",false);
    if(app.study.mode==="planner")renderPlanner();
  }
});

function bindModeSwitchTap(el,handler,{release=true}={}){
  if(!el)return;
  let sx=0,sy=0,lastTouch=0;
  const run=()=>{
    flushTypingSave();
    if(release)releaseActiveField();
    closeAllMenus();
    handler();
  };
  el.addEventListener("touchstart",e=>{
    const t=e.touches?.[0];if(!t)return;sx=t.clientX;sy=t.clientY;
  },{passive:true});
  el.addEventListener("touchend",e=>{
    const t=e.changedTouches?.[0];if(!t)return;
    if(el.dataset.skipClick||el.classList.contains("reorder-dragging"))return;
    if(Math.hypot(t.clientX-sx,t.clientY-sy)>14)return;
    lastTouch=Date.now();
    e.preventDefault();e.stopPropagation();
    run();
  },{passive:false});
  el.onclick=e=>{
    if(el.dataset.skipClick||el.classList.contains("reorder-dragging"))return;
    if(Date.now()-lastTouch<700){e.preventDefault();e.stopPropagation();return}
    e.preventDefault();e.stopPropagation();
    run();
  };
}

function runDataDiagnostic(){
  const activeMemory=app.study.subjects.reduce((n,subject)=>n+activeStudySheets(subject).length,0);
  const archivedMemory=app.study.subjects.reduce((n,subject)=>n+archivedStudySheets(subject).length,0);
  const activeBank=activeBankSheets(),archBank=archivedBankSheets();
  let problemCount=0,routeMissing=0,missionMissing=0,missionTotal=0;
  activeBank.forEach(sheet=>{problemCount+=(sheet.items||[]).length});
  for(const sheetId of Object.keys(adventureStore().configs||{})){if(!app.bank.sheets.some(x=>x.id===sheetId))routeMissing++}
  for(const round of plannerStore().rounds){
    for(const mission of round.missions||[]){
      missionTotal++;
      if(mission.kind==="bankPath"&&!app.bank.sheets.some(x=>x.id===mission.sheetId))missionMissing++;
      if(mission.kind==="memory"){
        const subject=app.study.subjects.find(x=>x.id===mission.subjectId);
        if(!subject?.sheets?.some(x=>x.id===mission.sheetId))missionMissing++;
      }
    }
  }
  alert(`[읽기 전용 데이터 검사]

활성 암기 시트 ${activeMemory} · 보관 ${archivedMemory}
활성 문제 시트 ${activeBank.length} · 보관 ${archBank.length}
활성 문제 ${problemCount}
회독 ${plannerStore().rounds.length} · 미션 ${missionTotal}
현재 없는 시트를 참조하는 진도길 ${routeMissing}
현재 없는 원본을 참조하는 회독 미션 ${missionMissing}
문제 통계 ${Object.keys(app.bank.stats||{}).length}

자동 수정은 하지 않았습니다.`);
}
function showArchivedSheets(){
  const mem=[];for(const subject of app.study.subjects)for(const sheet of archivedStudySheets(subject))mem.push(`${subject.name} › ${sheet.name}`);
  const bank=archivedBankSheets().map(x=>x.name);
  const memText=mem.slice(0,30).join("\n")||"없음";
  const bankText=bank.slice(0,30).join("\n")||"없음";
  alert(`암기판 보관 ${mem.length}
${memText}${mem.length>30?`\n외 ${mem.length-30}개`:""}

문제은행 보관 ${bank.length}
${bankText}${bank.length>30?`\n외 ${bank.length-30}개`:""}

복원은 각 시트의 ••• 메뉴에서 할 수 있습니다.`);
}

document.getElementById("fontFile").onchange=async e=>{
  const file=e.target.files?.[0];e.target.value="";if(!file)return;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!["ttf","otf","woff","woff2"].includes(ext))return toast("ttf / otf / woff / woff2 파일만 가능");
  if(file.size>15*1024*1024)return toast("폰트 파일이 너무 큽니다");
  const ok=await installLocalFont(file);
  if(!ok)return toast("이 폰트를 불러오지 못했습니다");
  try{
    await saveFontBlob(file,file.name);
    app.ui.settings.fontName=file.name;saveLocal();applyAppearanceSettings();toast("폰트 적용됨");
  }catch(err){console.error(err);toast("폰트 저장 실패")}
};
document.getElementById("fontReset").onclick=async()=>{
  try{await clearFontBlob()}catch(e){console.error(e)}
  if(activeFontFace){document.fonts.delete(activeFontFace);activeFontFace=null}
  if(activeFontUrl){URL.revokeObjectURL(activeFontUrl);activeFontUrl=""}
  document.documentElement.classList.remove("custom-font-active");
  app.ui.settings.fontName="";saveLocal();applyAppearanceSettings();toast("기본 글꼴로 변경됨");
};

document.getElementById("memoryFontUp").onclick=()=>changeSettingSize("memoryFontSize",1,12,20);
document.getElementById("quizFontDown").onclick=()=>changeSettingSize("quizFontSize",-1,14,24);

document.getElementById("settingsResetAll").onclick=async()=>{
  if(!confirm("글꼴과 화면 설정을 기본값으로 돌릴까요?"))return;
  try{await clearFontBlob()}catch(e){console.error(e)}
  if(activeFontFace){document.fonts.delete(activeFontFace);activeFontFace=null}
  if(activeFontUrl){URL.revokeObjectURL(activeFontUrl);activeFontUrl=""}
  document.documentElement.classList.remove("custom-font-active");
  app.ui.settings={fontName:"",memoryFontSize:14,quizFontSize:17,density:"compact"};
  saveLocal();applyAppearanceSettings();toast("설정 초기화됨");
};
