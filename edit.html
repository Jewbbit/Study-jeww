<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f6f7;
  --card:#fff;
  --line:#e5e5e8;
  --text:#171719;
  --sub:#8e8e93;
  --ok:#22865a;
  --bad:#c94b45;
  --accent:#6d5dfc;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
button,input,textarea{font:inherit}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(246,246,247,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px 12px 8px;
}
.row{
  display:flex;
  gap:6px;
  overflow:auto;
  scrollbar-width:none;
}
.row + .row{margin-top:7px}
.chip{
  border:0;
  background:#fff;
  color:#555;
  padding:8px 11px;
  border-radius:999px;
  white-space:nowrap;
}
.chip.active{
  background:#171719;
  color:#fff;
}
.icon{
  border:0;
  background:#fff;
  width:34px;
  height:34px;
  border-radius:10px;
  flex:0 0 auto;
}
.sheet-delete{color:#aaa;font-size:20px}
.sheet-delete:active{color:#c94b45}
main{
  max-width:820px;
  margin:0 auto;
  padding:12px 10px 60px;
}
.switch{
  display:flex;
  gap:6px;
  margin-bottom:10px;
}
.switch button{
  border:0;
  background:transparent;
  color:var(--sub);
  padding:6px 8px;
  border-radius:8px;
}
.switch button.active{
  color:var(--text);
  background:#fff;
}
.sheet-title{
  font-size:22px;
  font-weight:800;
  margin:4px 2px 12px;
}
.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
}
.card.flagged{
  box-shadow:inset 3px 0 0 #d6b000;
}
.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  min-height:20px;
  margin-bottom:5px;
}
.category{
  font-size:11px;
  color:var(--sub);
}
.right{
  display:flex;
  align-items:center;
  gap:4px;
}
.rate{
  font-size:11px;
  color:var(--sub);
}
.star{
  border:0;
  background:transparent;
  width:28px;
  height:28px;
  padding:0;
  font-size:18px;
  color:#bbb;
}
.star.on{color:#d2a900}
.answerline{
  display:grid;
  grid-template-columns:1fr 58px;
  gap:8px;
}
.answer{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  font-size:17px;
  background:#fff;
  outline:none;
}
.answer:focus{border-color:#cfcaff}
.answer.correct{border-color:#b7dec9;background:#f7fcf9}
.answer.wrong{border-color:#efc3c0;background:#fff8f7}
.result{
  text-align:center;
  font-weight:800;
  font-size:13px;
  padding-top:13px;
}
.result.ok{color:var(--ok)}
.result.bad{color:var(--bad)}
.result.empty{color:#c3c3c7}
.memo-btn{
  border:0;
  background:transparent;
  color:#8d83dc;
  font-size:11px;
  padding:6px 0 0;
}
.memo{
  display:none;
  margin-top:6px;
  font-size:12px;
  line-height:1.45;
  color:#555;
  background:#f7f7f9;
  border-radius:9px;
  padding:8px;
}
.memo.show{display:block}
.edit-wrap{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}
.edit-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border-bottom:1px solid var(--line);
}
.edit-head input{
  flex:1;
  border:0;
  outline:none;
  font-weight:800;
  font-size:19px;
}
.table-wrap{overflow:auto}
table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}
th,td{
  border-bottom:1px solid var(--line);
  padding:6px;
  vertical-align:middle;
}
th{
  text-align:left;
  font-size:11px;
  color:var(--sub);
  font-weight:600;
  background:#fafafa;
}
td:last-child,th:last-child{
  width:42px;
  text-align:center;
}
.edit-input,.edit-memo{
  width:100%;
  border:0;
  background:#f8f8fa;
  border-radius:9px;
  padding:9px;
  outline:none;
}
.edit-memo{
  min-height:40px;
  resize:vertical;
}
.delete{
  border:0;
  background:transparent;
  font-size:20px;
  color:#aaa;
}
.add{
  width:100%;
  border:0;
  background:#fafafa;
  color:var(--accent);
  padding:11px;
  font-weight:700;
}
.hidden{display:none!important}
.empty{
  color:var(--sub);
  font-size:13px;
  padding:16px 4px;
}

.section-title{
  margin:12px 2px 4px;
  padding:8px 2px 5px;
  font-size:14px;
  font-weight:800;
  color:#444;
  border-bottom:1px solid var(--line);
}
.section-edit{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 6px;
  background:#fafafa;
  border-bottom:1px solid var(--line);
}
.section-edit input{
  flex:1;
  border:0;
  background:transparent;
  outline:none;
  font-weight:800;
  font-size:14px;
}
.adds{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);
}
.adds.single{grid-template-columns:1fr}
.adds button{
  border:0;
  background:#fafafa;
  color:var(--accent);
  padding:11px;
  font-weight:700;
}
.adds button + button{border-left:1px solid var(--line)}


.action-cell{position:relative;width:42px;text-align:center}
.more{
  border:0;background:transparent;width:32px;height:32px;border-radius:8px;
  font-size:17px;color:#a0a0a6;line-height:1
}
.more:active{background:#efeff2;color:#555}
.menu{
  position:absolute;right:6px;top:34px;z-index:50;
  min-width:108px;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.12)
}
.menu button{
  display:block;width:100%;border:0;background:transparent;text-align:left;
  padding:9px 10px;border-radius:8px;font-size:13px;color:#333
}
.menu button:active{background:#f2f2f4}
.menu button.danger{color:var(--bad)}

</style>
</head>
<body>
<header>
  <div class="row" id="subjects"></div>
  <div class="row" id="sheets"></div>
</header>

<main>
  <div class="switch">
    <button id="studyBtn" class="active">복습</button>
    <button id="editBtn">편집</button>
    <button id="flagBtn">★만</button>
  </div>

  <section id="studyView">
    <div class="sheet-title" id="studyTitle"></div>
    <div class="list" id="studyList"></div>
  </section>

  <section id="editView" class="hidden">
    <div class="edit-wrap">
      <div class="edit-head">
        <input id="sheetName">
        <button class="icon" id="excelImport" title="엑셀 가져오기">↥</button>
        <button class="icon" id="addSheet" title="시트 추가">＋</button>
        <button class="icon sheet-delete" id="deleteSheet" title="시트 삭제">×</button>
        <input id="excelFile" class="hidden" type="file" accept=".xlsx,.xlsm,.xls,.xlsb">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>카테고리</th>
              <th>정답</th>
              <th>메모</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="editRows"></tbody>
        </table>
      </div>
      <div class="adds single">
        <button id="addSection">＋ 소제목</button>
      </div>
    </div>
  </section>
</main>

<script>
const KEY="study-min-v1";
function row(){return {type:"item",category:"",correct:"",memo:"",user:"",attempts:0,wrong:0,flagged:false,last:""}}
function sectionRow(){return {type:"section",title:""}}
function sheet(name){return {name,rows:[row()]}}
function subject(name){return {name,current:"기본",sheets:[sheet("기본")]}}
function init(){return {subject:"국어",mode:"study",subjects:[subject("국어")]}}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||init()}catch(e){state=init()}
let flaggedOnly=false;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function sub(){return state.subjects.find(x=>x.name===state.subject)||state.subjects[0]}
function sh(){return sub().sheets.find(x=>x.name===sub().current)||sub().sheets[0]}
function norm(s){return (s||"").trim().replace(/\s/g,"").replace(/[·,]/g,"").toLowerCase()}
function isBlankItem(r){
  return r && r.type!=="section" && !(r.category||"").trim() && !(r.correct||"").trim() && !(r.memo||"").trim();
}
function ensureTrailingBlank(){
  const rows=sh().rows;
  if(!rows.length || rows[rows.length-1].type==="section" || !isBlankItem(rows[rows.length-1])){
    rows.push(row());
  }
}
function grade(u,c){
  if(!u)return["","empty"];
  if(!c)return["","empty"];
  return norm(u)===norm(c)?["정답","ok"]:["오답","bad"];
}

function renderSubjects(){
  const el=document.getElementById("subjects");el.innerHTML="";
  state.subjects.forEach(s=>{
    const b=document.createElement("button");
    b.className="chip"+(s.name===state.subject?" active":"");
    b.textContent=s.name;
    b.onclick=()=>{state.subject=s.name;save();render()};
    el.appendChild(b);
  });
  const plus=document.createElement("button");
  plus.className="icon";plus.textContent="＋";
  plus.onclick=()=>{
    const n=prompt("과목");
    if(!n)return;
    if(state.subjects.some(s=>s.name===n))return;
    state.subjects.push(subject(n));state.subject=n;save();render();
  };
  el.appendChild(plus);
}
function renderSheets(){
  const el=document.getElementById("sheets");el.innerHTML="";
  sub().sheets.forEach(s=>{
    const b=document.createElement("button");
    b.className="chip"+(s.name===sub().current?" active":"");
    b.textContent=s.name;
    b.onclick=()=>{sub().current=s.name;save();render()};
    el.appendChild(b);
  });
}

function renderStudy(){
  document.getElementById("studyTitle").textContent=sh().name;
  const list=document.getElementById("studyList");list.innerHTML="";
  let rows=sh().rows.filter(r=>r.type==="section" ? (r.title||"").trim() : (r.correct||r.category||r.memo));
  if(flaggedOnly){
    const filtered=[];
    let pendingSection=null;
    rows.forEach(r=>{
      if(r.type==="section"){
        pendingSection=r;
      }else if(r.flagged){
        if(pendingSection){filtered.push(pendingSection);pendingSection=null;}
        filtered.push(r);
      }
    });
    rows=filtered;
  }
  if(!rows.length){
    const e=document.createElement("div");e.className="empty";e.textContent="";list.appendChild(e);return;
  }
  rows.forEach((r,idx)=>{
    if(r.type==="section"){
      const sec=document.createElement("div");
      sec.className="section-title";
      sec.textContent=r.title||"";
      list.appendChild(sec);
      return;
    }
    const card=document.createElement("div");card.className="card"+(r.flagged?" flagged":"");

    const meta=document.createElement("div");meta.className="meta";
    const cat=document.createElement("div");cat.className="category";cat.textContent=r.category||"";
    const right=document.createElement("div");right.className="right";
    const rate=document.createElement("div");rate.className="rate";
    const pct=r.attempts?Math.round((r.wrong/r.attempts)*100):0;
    rate.textContent=r.attempts?`${pct}%`:"";
    const star=document.createElement("button");star.className="star"+(r.flagged?" on":"");star.textContent=r.flagged?"★":"☆";
    star.onclick=()=>{r.flagged=!r.flagged;save();renderStudy()};
    right.append(rate,star);meta.append(cat,right);

    const line=document.createElement("div");line.className="answerline";
    const input=document.createElement("input");input.className="answer";input.value=r.user||"";input.placeholder="";
    input.dataset.studyIndex=String(idx);
    const result=document.createElement("div");result.className="result empty";result.textContent="";

    function refresh(){
      const [t,c]=grade(r.user,r.correct);
      result.className="result "+c;result.textContent=t;
      input.classList.toggle("correct",c==="ok");
      input.classList.toggle("wrong",c==="bad");
    }
    if(r.last===r.user&&r.user)refresh();

    input.oninput=e=>{
      r.user=e.target.value;r.last="";save();
      result.className="result empty";result.textContent="";
      input.classList.remove("correct","wrong");
    };
    const submitAnswer=()=>{
      if(!r.user)return;
      const ok=norm(r.user)===norm(r.correct);
      r.attempts=(r.attempts||0)+1;
      if(!ok)r.wrong=(r.wrong||0)+1;
      r.last=r.user;
      save();
      refresh();
      const pct=r.attempts?Math.round((r.wrong/r.attempts)*100):0;
      rate.textContent=r.attempts?`${pct}%`:"";
    };
    input.onchange=submitAnswer;
    input.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        submitAnswer();
        const inputs=[...document.querySelectorAll(".answer")];
        const pos=inputs.indexOf(input);
        if(pos>=0 && pos<inputs.length-1){
          inputs[pos+1].focus();
          inputs[pos+1].select();
        }else{
          input.blur();
        }
      }
    };

    line.append(input,result);
    card.append(meta,line);

    if(r.memo){
      const mb=document.createElement("button");mb.className="memo-btn";mb.textContent="메모";
      const memo=document.createElement("div");memo.className="memo";memo.textContent=r.memo;
      mb.onclick=()=>{memo.classList.toggle("show");mb.textContent=memo.classList.contains("show")?"닫기":"메모"};
      card.append(mb,memo);
    }
    list.appendChild(card);
  });
}


function moveRow(index,delta){
  const rows=sh().rows;
  const target=index+delta;
  if(target<0 || target>=rows.length)return;
  const item=rows.splice(index,1)[0];
  rows.splice(target,0,item);
  save();
  renderEdit();
}
function makeActionMenu(index){
  const td=document.createElement("td");
  td.className="action-cell";

  const more=document.createElement("button");
  more.className="more";
  more.textContent="•••";
  more.title="항목 메뉴";

  const menu=document.createElement("div");
  menu.className="menu hidden";

  const up=document.createElement("button");
  up.textContent="위로";
  up.disabled=index===0;
  up.onclick=e=>{e.stopPropagation();moveRow(index,-1)};

  const down=document.createElement("button");
  down.textContent="아래로";
  down.disabled=index>=sh().rows.length-1;
  down.onclick=e=>{e.stopPropagation();moveRow(index,1)};

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="삭제";
  del.onclick=e=>{
    e.stopPropagation();
    sh().rows.splice(index,1);
    ensureTrailingBlank();
    save();
    renderEdit();
  };

  menu.append(up,down,del);
  more.onclick=e=>{
    e.stopPropagation();
    document.querySelectorAll(".menu").forEach(m=>{if(m!==menu)m.classList.add("hidden")});
    menu.classList.toggle("hidden");
  };

  td.append(more,menu);
  return td;
}
document.addEventListener("click",()=>document.querySelectorAll(".menu").forEach(m=>m.classList.add("hidden")));

function renderEdit(){
  ensureTrailingBlank();
  document.getElementById("sheetName").value=sh().name;
  const tbody=document.getElementById("editRows");tbody.innerHTML="";
  sh().rows.forEach((r,i)=>{
    if(!r.type) r.type="item";

    if(r.type==="section"){
      const tr=document.createElement("tr");
      const td=document.createElement("td");
      td.colSpan=3;
      td.style.padding="0";

      const wrap=document.createElement("div");
      wrap.className="section-edit";

      const input=document.createElement("input");
      input.value=r.title||"";
      input.placeholder="소제목";
      input.oninput=e=>{r.title=e.target.value;save()};
      input.onkeydown=e=>{
        if(e.key==="Enter"){
          e.preventDefault();
          const next=row();
          sh().rows.splice(i+1,0,next);
          save();
          renderEdit();
          requestAnimationFrame(()=>{
            const corrects=[...document.querySelectorAll(".edit-correct")];
            const target=corrects.find(x=>Number(x.dataset.rowIndex)===i+1);
            if(target)target.focus();
          });
        }
      };

      wrap.append(input);
      td.appendChild(wrap);
      tr.append(td,makeActionMenu(i));
      tbody.appendChild(tr);
      return;
    }

    const tr=document.createElement("tr");

    const catTd=document.createElement("td");
    const cat=document.createElement("input");
    cat.className="edit-input";
    cat.value=r.category||"";
    cat.oninput=e=>{
      r.category=e.target.value;
      const rows=sh().rows;
      if(rows.indexOf(r)===rows.length-1 && !isBlankItem(r)){
        rows.push(row());
        save();
        renderEdit();
        requestAnimationFrame(()=>{
          const current=[...document.querySelectorAll("#editRows tr")][rows.length-2];
          const input=current?.querySelector(".edit-input");
          if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}
        });
      }else save();
    };
    cat.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        cor.focus();
        cor.select();
      }
    };
    catTd.appendChild(cat);

    const corTd=document.createElement("td");
    const cor=document.createElement("input");
    cor.className="edit-input edit-correct";
    cor.dataset.rowIndex=String(i);
    cor.value=r.correct||"";
    cor.oninput=e=>{
      r.correct=e.target.value;
      const rows=sh().rows;
      if(rows.indexOf(r)===rows.length-1 && !isBlankItem(r)){
        rows.push(row());
        save();
        renderEdit();
        requestAnimationFrame(()=>{
          const target=[...document.querySelectorAll(".edit-correct")]
            .find(x=>Number(x.dataset.rowIndex)===rows.length-2);
          if(target){target.focus();target.setSelectionRange(target.value.length,target.value.length);}
        });
      }else save();
    };
    cor.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        const currentIndex=sh().rows.indexOf(r);
        let nextIndex=currentIndex+1;
        while(nextIndex<sh().rows.length && sh().rows[nextIndex].type==="section"){
          nextIndex++;
        }
        if(nextIndex>=sh().rows.length){
          sh().rows.push(row());
          nextIndex=sh().rows.length-1;
          save();
          renderEdit();
          requestAnimationFrame(()=>{
            const target=[...document.querySelectorAll(".edit-correct")].find(x=>Number(x.dataset.rowIndex)===nextIndex);
            if(target)target.focus();
          });
        }else{
          const target=[...document.querySelectorAll(".edit-correct")].find(x=>Number(x.dataset.rowIndex)===nextIndex);
          if(target){target.focus();target.select();}
        }
      }
    };
    corTd.appendChild(cor);

    const memoTd=document.createElement("td");
    const memo=document.createElement("textarea");
    memo.className="edit-memo";
    memo.value=r.memo||"";
    memo.oninput=e=>{
      r.memo=e.target.value;
      const rows=sh().rows;
      if(rows.indexOf(r)===rows.length-1 && !isBlankItem(r)){
        rows.push(row());
        save();
        renderEdit();
      }else save();
    };
    memoTd.appendChild(memo);

    const actionTd=makeActionMenu(i);

    tr.append(catTd,corTd,memoTd,actionTd);
    tbody.appendChild(tr);
  });
}

function renderMode(){
  const study=state.mode!=="edit";
  document.getElementById("studyView").classList.toggle("hidden",!study);
  document.getElementById("editView").classList.toggle("hidden",study);
  document.getElementById("studyBtn").classList.toggle("active",study);
  document.getElementById("editBtn").classList.toggle("active",!study);
}

function cellValue(ws, addr){
  const c=ws[addr];
  if(!c || c.v==null)return "";
  return String(c.w!=null?c.w:c.v).trim();
}
function colHidden(ws, colIndex){
  return !!(ws["!cols"] && ws["!cols"][colIndex] && ws["!cols"][colIndex].hidden);
}
function refsFromFormula(formula, row1){
  const out=[];
  const re=/(?:'[^']+'!|[A-Za-z0-9_가-힣]+!)?\$?([A-Z]{1,3})\$?(\d+)/g;
  let m;
  while((m=re.exec(formula||""))){
    const rr=Number(m[2]);
    if(rr!==row1)continue;
    const col=XLSX.utils.decode_col(m[1]);
    out.push({col,row:rr-1,addr:XLSX.utils.encode_cell({r:rr-1,c:col})});
  }
  return out;
}
function detectFormulaRow(ws, r, range){
  let best=null;
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r,c});
    const cell=ws[addr];
    if(!cell || !cell.f)continue;

    const refs=refsFromFormula(cell.f,r+1).filter(x=>x.addr!==addr);
    if(refs.length<2)continue;

    const counts=new Map();
    refs.forEach(x=>counts.set(x.addr,(counts.get(x.addr)||0)+1));
    const uniq=[...counts.keys()].map(a=>{
      const pos=XLSX.utils.decode_cell(a);
      const val=cellValue(ws,a);
      let score=(counts.get(a)||0);
      if(val)score+=5;
      if(colHidden(ws,pos.c))score+=8;
      if(pos.c>c)score+=2;
      score+=Math.min(3,Math.abs(pos.c-c)/4);
      return {addr:a,col:pos.c,val,score,count:counts.get(a)||0};
    }).sort((a,b)=>b.score-a.score);

    const answer=uniq[0];
    if(!answer || !answer.val)continue;

    // input = the other heavily-referenced cell, useful for locating a nearby memo column
    const input=uniq.slice(1).sort((a,b)=>{
      if(b.count!==a.count)return b.count-a.count;
      return Math.abs(a.col-c)-Math.abs(b.col-c);
    })[0];

    let memo="";
    if(input){
      const rightAddr=XLSX.utils.encode_cell({r,c:input.col+1});
      const right=ws[rightAddr];
      if(right && !right.f && input.col+1!==answer.col){
        memo=cellValue(ws,rightAddr);
      }
    }

    // If the guessed memo is just the same answer duplicated elsewhere, drop it.
    if(norm(memo)===norm(answer.val))memo="";

    const candidate={answer:answer.val,memo,formulaCol:c,inputCol:input?input.col:null,answerCol:answer.col};
    if(!best || answer.score>(best._score||-1)){
      candidate._score=answer.score;
      best=candidate;
    }
  }
  return best;
}
function headingAt(ws,r,range){
  const preferred=[0,1,11,13]; // A, B, L, N are common heading locations in existing sheets
  const candidates=[];
  preferred.forEach(c=>{
    if(c<range.s.c || c>range.e.c)return;
    const addr=XLSX.utils.encode_cell({r,c});
    const cell=ws[addr];
    if(!cell || cell.f)return;
    const v=cellValue(ws,addr);
    if(v)candidates.push(v);
  });
  if(!candidates.length){
    for(let c=range.s.c;c<=range.e.c;c++){
      const addr=XLSX.utils.encode_cell({r,c});
      const cell=ws[addr];
      if(!cell || cell.f)continue;
      const v=cellValue(ws,addr);
      if(v && v.length<=40)candidates.push(v);
    }
  }
  return candidates.find(v=>!/^hint$/i.test(v) && v!=="정답" && v!=="오답")||"";
}
function convertWorksheet(ws,name){
  if(!ws["!ref"])return null;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const detected=new Map();
  for(let r=range.s.r;r<=range.e.r;r++){
    const d=detectFormulaRow(ws,r,range);
    if(d)detected.set(r,d);
  }
  const formulaRows=[...detected.keys()].sort((a,b)=>a-b);
  if(!formulaRows.length)return null;

  const rows=[];
  let prev=null;
  let lastSection="";
  formulaRows.forEach((r,idx)=>{
    // Look immediately above the new run for a section heading.
    const runBreak=prev==null || r>prev+1;
    if(runBreak){
      const start=prev==null?Math.max(range.s.r,r-2):prev+1;
      let heading="";
      for(let rr=r-1;rr>=start;rr--){
        if(detected.has(rr))continue;
        const h=headingAt(ws,rr,range);
        if(h){heading=h;break;}
      }
      if(heading && heading!==lastSection){
        rows.push({type:"section",title:heading});
        lastSection=heading;
      }
    }

    const d=detected.get(r);
    rows.push({
      type:"item",
      category:"",
      correct:d.answer,
      memo:d.memo||"",
      user:"",
      attempts:0,
      wrong:0,
      flagged:false,
      last:""
    });
    prev=r;
  });

  return {name,rows};
}
function uniqueSubjectName(base){
  let n=base||"가져온 자료";
  if(!state.subjects.some(s=>s.name===n))return n;
  let i=2;
  while(state.subjects.some(s=>s.name===`${n} ${i}`))i++;
  return `${n} ${i}`;
}
async function importWorkbook(file){
  if(typeof XLSX==="undefined"){
    alert("엑셀 읽기 기능을 불러오지 못했습니다.");
    return;
  }
  const ab=await file.arrayBuffer();
  const wb=XLSX.read(ab,{cellFormula:true,cellStyles:true});
  const sheets=[];
  wb.SheetNames.forEach(name=>{
    const converted=convertWorksheet(wb.Sheets[name],name);
    if(converted && converted.rows.some(r=>r.type==="item"))sheets.push(converted);
  });
  if(!sheets.length){
    alert("판정 수식에서 정답 위치를 찾지 못했습니다.");
    return;
  }
  const base=file.name.replace(/\.(xlsx|xlsm|xlsb|xls)$/i,"");
  const subjectName=uniqueSubjectName(base);
  const ns={name:subjectName,current:sheets[0].name,sheets};
  state.subjects.push(ns);
  state.subject=subjectName;
  state.mode="edit";
  save();
  render();
}

function render(){
  renderSubjects();renderSheets();renderStudy();renderEdit();renderMode();
}
document.getElementById("studyBtn").onclick=()=>{state.mode="study";save();renderMode()};
document.getElementById("editBtn").onclick=()=>{state.mode="edit";save();renderMode()};
document.getElementById("flagBtn").onclick=e=>{
  flaggedOnly=!flaggedOnly;
  e.target.classList.toggle("active",flaggedOnly);
  renderStudy();
};
document.getElementById("addSection").onclick=()=>{
  ensureTrailingBlank();
  const rows=sh().rows;
  const insertAt=rows.length-1;
  rows.splice(insertAt,0,sectionRow());
  save();
  renderEdit();
  requestAnimationFrame(()=>{
    const sections=[...document.querySelectorAll(".section-edit input")];
    if(sections.length)sections[sections.length-1].focus();
  });
};
document.getElementById("excelImport").onclick=()=>document.getElementById("excelFile").click();
document.getElementById("excelFile").onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;
  try{
    await importWorkbook(file);
  }catch(err){
    console.error(err);
    alert("엑셀을 읽는 중 오류가 났습니다.");
  }
  e.target.value="";
};
document.getElementById("deleteSheet").onclick=()=>{
  const s=sub();
  if(s.sheets.length<=1){
    alert("시트는 하나 이상 있어야 합니다.");
    return;
  }
  const current=sh();
  if(!confirm(`'${current.name}' 시트를 삭제할까요?`))return;
  const index=s.sheets.indexOf(current);
  s.sheets.splice(index,1);
  const next=s.sheets[Math.min(index,s.sheets.length-1)];
  s.current=next.name;
  save();
  render();
};
document.getElementById("addSheet").onclick=()=>{
  const n=prompt("시트");
  if(!n)return;
  if(sub().sheets.some(s=>s.name===n))return;
  sub().sheets.push(sheet(n));sub().current=n;save();render();
};
document.getElementById("sheetName").onchange=e=>{
  const n=e.target.value.trim();if(!n)return;
  sh().name=n;sub().current=n;save();render();
};
render();
</script>
