<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Jew</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{
  --bg:#f5f5f7;--card:#fff;--line:#e4e4e8;--text:#171719;--sub:#8d8d94;
  --ok:#23855a;--bad:#c94b45;--accent:#6557e8;--soft:#f2f2f5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:rgba(245,245,247,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.navline{display:flex;align-items:center;gap:7px;padding:7px 10px}
.scrolltabs{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.scrolltabs::-webkit-scrollbar{display:none}
.right-tools{display:flex;align-items:center;gap:5px;margin-left:auto;flex:0 0 auto}
.chip,.icon,.modebar button,.small-btn,.tool-btn{
  border:0;background:var(--card);border-radius:10px;color:var(--text)
}
.chip{padding:7px 11px;white-space:nowrap;flex:0 0 auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;touch-action:pan-y}
.chip.active{background:var(--text);color:#fff}
.icon{width:33px;height:33px;flex:0 0 auto;font-size:17px}
.icon.muted{color:#aaa}
.sync-btn{width:auto;min-width:38px;padding:0 9px;font-size:11px;color:#777}
.sync-btn.signed{color:var(--ok)}
.reorder-dragging{opacity:.4;transform:scale(.97)}
.reorder-target{outline:2px solid #aaa;outline-offset:2px}
main{max-width:1050px;margin:0 auto;padding:10px 10px 44px}
.modebar{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto;scrollbar-width:none}
.modebar::-webkit-scrollbar{display:none}
.modebar button{padding:8px 11px;color:var(--sub);white-space:nowrap}
.modebar button.active{background:var(--text);color:#fff}
.study-head,.edit-head,.page-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sheet-title,.page-title{font-size:20px;font-weight:750;flex:1;min-width:0;padding:3px 2px}
.study-menu-wrap,.subject-menu-wrap,.section-menu-wrap{position:relative;flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.card.flagged{border-color:#c7c1ff}
.meta{display:flex;align-items:center;gap:6px;min-height:19px;margin-bottom:5px}
.category{font-size:11px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{font-size:11px;color:var(--sub)}
.star{border:0;background:transparent;font-size:18px;color:#c5c5ca;padding:0 1px}
.star.on{color:#e4a500}
.answer-line{display:flex;align-items:center;gap:6px}
.answer{
  flex:0 1 68%;min-width:120px;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:8px 10px;font-size:15px;outline:none
}
.answer:focus{border-color:#aaa}
.answer.correct{border-color:var(--ok);background:#f4fbf7}
.answer.wrong{border-color:var(--bad);background:#fff6f5}
.answer-action{border:0;background:var(--soft);border-radius:8px;padding:8px 9px;font-size:11px;color:#555;white-space:nowrap}
.clear-answer{width:32px;height:32px;padding:0;font-size:17px}
.revealed-answer{display:none!important;margin-top:6px;padding:8px 9px;background:#f4f4f6;border-radius:8px;font-weight:650;white-space:pre-wrap;font-size:13px}
.memo-btn{margin-top:6px;border:0;background:transparent;color:var(--sub);padding:0;font-size:11px}
.memo{display:none;margin-top:6px;font-size:12px;color:#555;white-space:pre-wrap}
.memo.show{display:block}
.section-study-head{display:flex;align-items:center;gap:4px;margin-top:4px}
.section-title{font-weight:760;font-size:14px;flex:1;padding:6px 2px 4px}
.section-toggle{border:0;background:transparent;color:#888;padding:4px 5px}
.more{border:0;background:transparent;color:#999;width:30px;height:30px;border-radius:8px}
.more:active{background:#ececef;color:#555}
.menu{position:absolute;right:0;top:36px;z-index:80;min-width:155px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;box-shadow:0 9px 30px rgba(0,0,0,.13)}
.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:7px;font-size:12px;color:#333}
.menu button:active{background:#f2f2f4}
.menu .danger{color:var(--bad)}
.menu-sep{height:1px;background:var(--line);margin:4px}
.edit-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.edit-head{margin:0;padding:7px;border-bottom:1px solid var(--line)}
#sheetName{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:720;padding:5px;outline:none}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:7px;border-bottom:1px solid var(--line)}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
td input,td textarea{width:100%;border:0;background:transparent;padding:7px;outline:none;border-radius:6px}
td input:focus,td textarea:focus{background:#f7f7f9}
.edit-memo{min-height:34px;resize:vertical}
.edit-correct{font-weight:600}
.action-cell{position:relative;width:39px;text-align:center}
.section-edit{background:#f7f7f9;padding:3px 5px}
.section-edit input{font-weight:750}
.draft-row td{background:#fbfbfc}
.draft-row input,.draft-row textarea{color:#555}
.adds{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.adds button{border:0;background:#fff;padding:10px;color:#777}
.modal-backdrop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(360px,100%);background:#fff;border-radius:17px;padding:13px;box-shadow:0 15px 45px rgba(0,0,0,.2)}
.modal-title{font-weight:750;padding:5px 4px 10px}
.modal-choice{display:block;width:100%;border:0;background:#f5f5f7;border-radius:11px;padding:12px;text-align:left;margin:6px 0}
.modal-cancel{display:block;width:100%;border:0;background:transparent;color:#888;padding:9px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:150;background:#222;color:#fff;border-radius:20px;padding:8px 13px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}

/* problem bank */
.bank-toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px}
.bank-toolbar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bank-toolbar select,.bank-toolbar button,.bank-toolbar input{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:12px
}
.bank-toolbar select{max-width:220px}
.primary{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}
.question-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.q-top{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.q-tag{font-size:11px;color:var(--sub);flex:1}
.q-progress{font-size:11px;color:var(--sub)}
.question{font-size:17px;line-height:1.55;font-weight:650;white-space:pre-wrap;margin:8px 0 13px}
.choices{display:grid;gap:7px}
.choice{display:flex;align-items:flex-start;gap:9px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left}
.choice .num{flex:0 0 22px;font-weight:700;color:var(--sub)}
.choice.correct{border-color:var(--ok);background:#f4fbf7}
.choice.wrong{border-color:var(--bad);background:#fff5f4}
.quiz-answer{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
.quiz-answer.correct{border-color:var(--ok);background:#f4fbf7}
.quiz-answer.wrong{border-color:var(--bad);background:#fff5f4}
.write-answer{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;outline:none}
.quiz-actions{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.quiz-actions button{border:0;background:var(--soft);border-radius:9px;padding:9px 10px;font-size:12px}
.quiz-actions .primary{margin-left:auto}
.answer-panel{margin-top:10px;padding:10px;border-radius:10px;background:#f4f4f6;white-space:pre-wrap;font-size:13px}
.bank-empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:30px 15px;text-align:center;color:#777}
.bank-empty button{margin-top:10px;border:0;background:var(--text);color:#fff;border-radius:10px;padding:10px 13px}
.wrong-list{display:flex;flex-direction:column;gap:6px}
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.wrong-item-top{display:flex;gap:7px;align-items:center}
.wrong-q{font-size:13px;line-height:1.4;flex:1}
.wrong-stat{font-size:11px;color:var(--bad)}
.wrong-meta{font-size:11px;color:var(--sub);margin-top:4px}
.bank-manage{margin-left:auto}
.bank-source-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.bank-source-chip{background:var(--soft);border:0;border-radius:8px;padding:6px 8px;font-size:11px}
.empty{height:20px}

/* tablet */
@media(min-width:641px) and (max-width:1100px){
  main{max-width:none;padding:8px 8px 38px}
  .navline{padding:6px 8px}
  .chip{padding:6px 10px}
  .card{padding:8px 9px}
  .list{gap:5px}
  .answer{padding:7px 9px;flex-basis:62%}
  .answer-action{padding:7px 8px}
  .section-title{padding-top:5px}
}
/* phone */
@media(max-width:640px){
  main{padding:8px 7px 74px}
  .navline{padding:6px 7px}
  .chip{padding:6px 9px}
  .modebar{gap:5px;margin-bottom:7px}
  .modebar button{padding:7px 9px;font-size:12px}
  .sheet-title,.page-title{font-size:18px}
  .answer-line{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:5px}
  .answer{max-width:none;width:100%;min-width:0}
  .card{padding:8px;border-radius:11px}
  .table-wrap{overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--bg)}
  tr{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 38px 5px 5px}
  td{border:0;padding:1px}
  td:has(.edit-input)::before{content:"카테고리";display:block;font-size:10px;color:var(--sub);padding:2px 7px}
  td:has(.edit-correct)::before{content:"정답";display:block;font-size:10px;color:var(--sub);padding:2px 7px}
  td:has(.edit-memo)::before{content:"메모";display:block;font-size:10px;color:var(--sub);padding:2px 7px}
  .action-cell{position:absolute;right:4px;top:4px;width:32px}
  .section-row{padding:0 38px 0 0}
  .section-row td:first-child{padding:0}
  .section-edit{border-radius:9px;background:#f2f2f4}
  .draft-row{border-style:dashed}
  .question-card{padding:11px}
  .question{font-size:15px}
  .bank-toolbar select{max-width:100%;flex:1}
  .bank-toolbar-row>*{min-width:0}
}

.workspace-line{padding-top:7px;padding-bottom:5px}
.workspace-switch{display:inline-flex;background:#e9e9ed;border-radius:11px;padding:3px;gap:2px}
.workspace-btn{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:12px;color:#666}
.workspace-btn.active{background:#fff;color:#171719;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bank-editor{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bank-edit-table{width:100%;border-collapse:collapse}
.bank-edit-table th{position:sticky;top:0;background:#fff;z-index:2}
.bank-edit-table td{padding:4px;border-bottom:1px solid var(--line)}
.bank-edit-table input,.bank-edit-table textarea{width:100%;border:0;background:transparent;padding:7px;outline:none;border-radius:6px}
.bank-edit-table input:focus,.bank-edit-table textarea:focus{background:#f7f7f9}
.bank-edit-table textarea{min-height:36px;resize:vertical}
.bank-row-actions{white-space:nowrap;text-align:center}
.bank-row-actions button{border:0;background:transparent;color:#999;padding:6px}
.quiz-status{display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:11px;color:var(--sub)}
.round-pill{background:#ededf1;border-radius:999px;padding:4px 8px}
.quiz-inline-edit{margin-top:10px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fafafd;display:grid;gap:6px}
.quiz-inline-edit input,.quiz-inline-edit textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.quiz-inline-edit textarea{min-height:70px;resize:vertical}
.mini-note{font-size:11px;color:var(--sub)}
@media(max-width:640px){
  .workspace-btn{padding:6px 10px}
  .bank-edit-table,.bank-edit-table tbody,.bank-edit-table tr,.bank-edit-table td{display:block;width:100%}
  .bank-edit-table thead{display:none}
  .bank-edit-table tbody{display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--bg)}
  .bank-edit-table tr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 36px 6px 6px;position:relative}
  .bank-edit-table td{border:0;padding:1px}
  .bank-row-actions{position:absolute;right:4px;top:4px;width:32px}
}


.compact-summary{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.summary-btn{border:0;background:transparent;padding:5px 4px;font-size:13px;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.summary-sep{color:#aaa;font-size:11px}
#memoryHeader.collapsed .navline{display:none}
#bankControlsWrap.collapsed{display:none}
.quiz-running #bankControlsWrap{display:none!important}
.quiz-running #bankEditBtn{display:none}
.header-toggle{border:0;background:var(--card);border-radius:9px;padding:6px 8px;font-size:11px;color:#666;white-space:nowrap}
@media(max-width:640px){.summary-btn{font-size:12px}.header-toggle{padding:5px 7px}}


/* 문제풀이 가독성 */
#quizArea{max-width:860px;margin:0 auto}
.question-card{
  padding:20px 22px 18px;
  border-radius:16px;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.q-top{margin-bottom:12px}
.q-tag{font-size:11px;color:#98989f}
.q-progress{font-size:12px;font-weight:650;color:#707077}
.question{
  font-size:20px;
  line-height:1.68;
  font-weight:700;
  letter-spacing:-.015em;
  margin:4px 0 18px;
  padding:15px 16px;
  background:#f7f7f9;
  border-radius:12px;
  white-space:pre-wrap;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
.answer-mask{
  display:inline-block;
  width:4.6em;
  height:1.05em;
  margin:0 .08em;
  border-radius:4px;
  background:#242428;
  color:transparent;
  vertical-align:-.08em;
  user-select:none;
  overflow:hidden;
}
.choices{gap:9px}
.choice{
  min-height:48px;
  padding:12px 13px;
  border-radius:12px;
  line-height:1.5;
  font-size:15px;
  align-items:flex-start;
}
.choice .num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;height:24px;
  flex:0 0 24px;
  border-radius:7px;
  background:#f0f0f3;
  color:#55555c;
  font-size:12px;
  margin-top:-1px;
}
.choice.correct .num{background:#e4f5eb;color:var(--ok)}
.choice.wrong .num{background:#fde7e5;color:var(--bad)}
.quiz-status{margin:0 0 12px}
.quiz-actions{margin-top:14px}
.quiz-actions button{padding:9px 11px}
.quiz-answer{font-size:16px;padding:12px 13px}
.write-answer{font-size:15px;line-height:1.6;padding:12px 13px}
.answer-panel{font-size:14px;line-height:1.65;padding:12px 13px}
@media(min-width:641px) and (max-width:1100px){
  #quizArea{max-width:900px}
  .question-card{padding:17px 18px}
  .question{font-size:19px;line-height:1.62;padding:13px 14px;margin-bottom:15px}
  .choice{font-size:15px;padding:11px 12px}
}
@media(max-width:640px){
  #quizArea{max-width:none}
  .question-card{padding:13px 12px}
  .question{font-size:17px;line-height:1.62;padding:12px 11px;margin:3px 0 13px}
  .choice{font-size:14px;min-height:45px;padding:10px}
  .q-top{margin-bottom:8px}
}


/* 문제풀이 텍스트 색상 보정 */
.question,.choice,.choice span,.quiz-answer,.write-answer,.answer-panel,.revealed-answer{display:none!important;
  color:#202024;
}
.choice:visited,.choice:focus,.choice:active{color:#202024}
.choice.correct,.choice.correct span{color:#202024}
.choice.wrong,.choice.wrong span{color:#202024}
.answer-panel{background:#f2f2f4}
.revealed-answer{display:none!important;color:#202024}


/* 리더기처럼 오래 읽기 편한 본문 설정 */
body{font-weight:400;letter-spacing:-.01em}
.question{
  font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:600;
  letter-spacing:-.012em;
}
.choice,.quiz-answer,.write-answer,.answer-panel{
  font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:400;
}
.choice .num{font-weight:600}


/* 문제 편집: 긴 내용 전체 표시 */
.bank-edit-table textarea{
  overflow:hidden;
  resize:none;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.bank-edit-table td{vertical-align:top}
.bank-question{font-weight:500}
.bank-answer{font-weight:500}
@media(max-width:640px){
  .bank-edit-table textarea{font-size:14px;line-height:1.55}
}


/* 암기판 밀도 조정 */
#studyView .list{gap:4px}
#studyView .card{
  padding:6px 8px;
  border-radius:10px;
}
#studyView .meta{
  min-height:15px;
  margin-bottom:2px;
  gap:5px;
}
#studyView .category,#studyView .rate{font-size:10px}
#studyView .star{
  font-size:16px;
  line-height:16px;
  height:18px;
}
#studyView .answer-line{gap:4px}
#studyView .answer{
  padding:6px 8px;
  min-height:32px;
}
#studyView .answer-action{
  padding:6px 7px;
  min-height:32px;
  font-size:10px;
}
#studyView .clear-answer{
  width:30px;
  height:32px;
  min-height:32px;
}
#studyView .memo-inline.active{background:#e8e8ec;color:#333}
#studyView .memo{
  margin-top:4px;
  padding:6px 8px;
  background:#f6f6f8;
  border-radius:7px;
  line-height:1.45;
}
#studyView .revealed-answer{display:none!important;
  margin-top:4px;
  padding:6px 8px;
}
#studyView .section-title{padding:4px 2px 2px}
#studyView .section-study-head{margin-top:2px}
@media(min-width:641px) and (max-width:1100px){
  #studyView .card{padding:5px 7px}
  #studyView .answer{padding:5px 7px;min-height:30px}
  #studyView .answer-action{padding:5px 6px;min-height:30px}
  #studyView .clear-answer{height:30px;min-height:30px}
}
@media(max-width:640px){
  #studyView .answer-line{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto 30px;
    gap:4px;
  }
  #studyView .answer-line:not(:has(.memo-inline)){
    grid-template-columns:minmax(0,1fr) auto 30px;
  }
  #studyView .card{padding:6px 7px}
}


.danger-sheet-btn{
  border:1px solid #ead1cf!important;
  color:#b94d47!important;
  background:#fff!important;
}
.danger-sheet-btn:active{background:#fff4f3!important}


/* 모바일 암기판 오조작 방지 */
#studyView .meta{
  justify-content:flex-start;
}
#studyView .meta .category{order:1}
#studyView .meta .star{order:2;margin-left:2px}
#studyView .meta .rate{order:3;margin-left:auto}
#studyView .clear-answer{
  margin-left:4px;
}
.account-menu{
  position:absolute;
  right:10px;
  top:46px;
  z-index:80;
  min-width:132px;
  padding:6px;
  border:1px solid #e5e5e8;

/* 2026-08 visual system: color + shape, e-ink safe */
:root{

  --ok-soft:#edf8f1;
  --ok-ink:#2f7d50;
  --bad-soft:#fff0ee;
  --bad-ink:#b75f56;
  --star-soft:#fff8df;
  --star-ink:#9a6900;
}
body{color:var(--ink)}
.study-field{position:relative;min-width:0}
.study-field .study-answer,.study-field .section-memory-input{padding-right:27px!important}
.answer-status{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:850;line-height:1;color:transparent;pointer-events:none
}
.answer-status.correct{color:var(--ok-ink)}
.answer-status.wrong{color:var(--bad-ink)}
.study-answer.correct,.section-memory-input.correct{
  border:2px solid var(--ok-ink)!important;background:var(--ok-soft)!important
}
.study-answer.wrong,.section-memory-input.wrong{
  border:2px dashed var(--bad-ink)!important;background:var(--bad-soft)!important
}
.study-row.flagged{
  background:var(--star-soft)!important;border-left:2px solid var(--star-ink);padding-left:5px
}
.star.on,.quiz-star.on{color:var(--star-ink)!important}
.revealed-answer{display:none!important;border-left:2px solid #76777d;background:#f6f6f7!important}
.choice{position:relative;border-color:var(--hair)!important}
.choice.correct{border:2px solid var(--ok-ink)!important;background:var(--ok-soft)!important}
.choice.wrong{border:2px dashed var(--bad-ink)!important;background:var(--bad-soft)!important}
.choice-text{flex:1;min-width:0}
.choice-mark{margin-left:auto;min-width:18px;text-align:center;font-weight:850;font-size:15px;line-height:1.4}
.choice.correct .choice-mark{color:var(--ok-ink)}
.choice.wrong .choice-mark{color:var(--bad-ink)}
.quiz-answer.correct{border:2px solid var(--ok-ink)!important;background:var(--ok-soft)!important}
.quiz-answer.wrong{border:2px dashed var(--bad-ink)!important;background:var(--bad-soft)!important}
.workspace-btn,.modebar button{transition:none!important}

  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}

  .study-answer.correct,.section-memory-input.correct,.choice.correct,.quiz-answer.correct{
    border:2px solid #111!important;background:#fff!important

  }

function canonicalProblemKey(item){
  const q=norm(item?.question||""),a=norm(item?.answer||"");
  return q+"\u0001"+a;
}
function canonicalProblemId(item){
  return item?.canonicalId||("q_"+hashString(canonicalProblemKey(item)));
}
function mergeDuplicateQuizItems(items){
  const map=new Map(),out=[];
  for(const item of items){
    if(!item?.question)continue;
    const key=canonicalProblemKey(item);
    if(!map.has(key)){
      const first={...item};
      first.canonicalId=canonicalProblemId(item);
      first.origins=[{
        source:item.source||"",
        sheetId:item.sheetId||"",
        sheetName:item.sheetName||"",
        category:item.category||""
      }];
      map.set(key,first);out.push(first);
    }else{
      const first=map.get(key);
      const origin={source:item.source||"",sheetId:item.sheetId||"",sheetName:item.sheetName||"",category:item.category||""};
      if(!first.origins.some(o=>o.source===origin.source&&o.sheetId===origin.sheetId&&o.category===origin.category))first.origins.push(origin);
      // 빈 메모/카테고리는 다른 원본의 값을 보충하되 기존 값을 덮어쓰지 않음.
      if(!first.memo&&item.memo)first.memo=item.memo;
      if(!first.category&&item.category)first.category=item.category;
    }
  }
  return out;
}

    if(composing||e.isComposing||e.keyCode===229){queued=true;return}
    e.preventDefault();setTimeout(handler,40);
  });
}

    const bs=getButtons();bs.forEach(b=>b.classList.remove("reorder-target"));
    const target=bs.find(b=>{const r=b.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
    if(target&&target!==button)target.classList.add("reorder-target");
  });

function renderStudy(){

        const paintSectionState=()=>{
          input.classList.remove("correct","wrong","showing-answer");
          status.classList.remove("correct","wrong");status.textContent="";
          if(showingAnswer){input.classList.add("showing-answer");return}
          if(r.user&&r.last===r.user){
            const ok=norm(r.user)===norm(r.title);
            input.classList.add(ok?"correct":"wrong");
            status.classList.add(ok?"correct":"wrong");
            status.textContent=ok?"✓":"×";
          }
        };
        paintSectionState();
        input.oninput=e=>{if(showingAnswer)return;r.user=e.target.value;r.last="";r.revealed=false;paintSectionState()};
        const checkSectionAnswer=()=>{if(showingAnswer||!r.user)return;r.last=r.user;paintSectionState()};
        input.onchange=checkSectionAnswer;
        bindSafeEnter(input,()=>{if(showingAnswer){r.revealed=false;renderStudy();return}checkSectionAnswer();focusNextStudyField(input)});
        field.append(input,status);

        const reveal=document.createElement("button");reveal.className="section-memory-reveal";
        reveal.textContent=showingAnswer?"숨김":"답";

        content.append(field,reveal);      }else{

      const m=document.createElement("div");m.className="menu hidden";

      const clear=document.createElement("button");clear.textContent="이 구간 입력 지우기";
      clear.onclick=e=>{e.stopPropagation();const original=sh().rows.indexOf(r);clearReviewRow(r);const [a,z]=sectionRange(sh().rows,original);for(let i=a;i<z;i++)clearReviewRow(sh().rows[i]);renderStudy()};
      m.append(collapse,clear);b.onclick=e=>{e.stopPropagation();m.classList.toggle("hidden")};w.append(b,m);
      head.append(content,w);list.append(head);return;
    }
    if(hiddenBySection)return;

    const row=document.createElement("div");row.className="study-row"+(r.flagged?" flagged":"");

    }

    const starCount=document.createElement("span");starCount.className="star-count";starCount.textContent=r.flagCount?String(r.flagCount):"";
    star.append(starGlyph,starCount);

    star.onclick=e=>{
      e.stopPropagation();
      if(!r.flagged){r.flagged=true;r.flagCount=(r.flagCount||0)+1}
      else r.flagged=false;
      markStudyCloud();renderStudy();
    };

    const field=document.createElement("div");field.className="study-field";
    const showingAnswer=!!(r.revealed||app.ui.showAllStudyAnswers);
    const input=document.createElement("input");input.className="study-answer";input.type="text";
    input.value=showingAnswer?(r.correct||""):(r.user||"");
    input.readOnly=showingAnswer;
    input.autocomplete="off";input.spellcheck=false;

    const status=document.createElement("span");status.className="answer-status";status.setAttribute("aria-hidden","true");
    const paintState=()=>{
      input.classList.remove("correct","wrong","showing-answer");
      status.classList.remove("correct","wrong");status.textContent="";
      if(showingAnswer){input.classList.add("showing-answer");return}
      if(r.user&&r.last===r.user){
        const ok=norm(r.user)===norm(r.correct);
        input.classList.add(ok?"correct":"wrong");
        status.classList.add(ok?"correct":"wrong");
        status.textContent=ok?"✓":"×";
      }
    };
    paintState();
    input.oninput=e=>{if(showingAnswer)return;r.user=e.target.value;r.last="";r.revealed=false;paintState()};
    input.onchange=()=>{if(showingAnswer)return;submitStudyAnswer(r,input);paintState()};
    bindSafeEnter(input,()=>{
      if(showingAnswer){r.revealed=false;renderStudy();return}
      submitStudyAnswer(r,input);paintState();focusNextStudyField(input)
    });
    field.append(input,status);

    const reveal=document.createElement("button");reveal.className="study-action answer-toggle";
    reveal.textContent=showingAnswer?"숨김":"답";
    reveal.setAttribute("aria-label",showingAnswer?"정답 숨기기":"정답 보기");
    reveal.onclick=e=>{e.stopPropagation();r.revealed=!r.revealed;renderStudy()};

    let memo=null;
    if(r.memo){memo=document.createElement("div");memo.className="memo"+(app.ui.showAllStudyMemos?" show":"");memo.textContent=r.memo}

    const rowMenuWrap=document.createElement("div");rowMenuWrap.className="study-row-menu-wrap";
    const rowMore=document.createElement("button");rowMore.className="study-action row-more";rowMore.textContent="•••";rowMore.setAttribute("aria-label","항목 메뉴");
    const rowMenu=document.createElement("div");rowMenu.className="menu study-row-menu hidden";
    if(r.memo){
      const memoToggle=document.createElement("button");memoToggle.textContent=app.ui.showAllStudyMemos?"메모 숨기기":"메모 보기";
      memoToggle.onclick=e=>{e.stopPropagation();memo.classList.toggle("show");rowMenu.classList.add("hidden")};
      rowMenu.append(memoToggle);
    }
    const clear=document.createElement("button");clear.textContent="현재 입력 지우기";
    clear.onclick=e=>{e.stopPropagation();r.user="";r.last="";r.revealed=false;rowMenu.classList.add("hidden");renderStudy()};
    rowMenu.append(clear);
    rowMore.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      const opening=rowMenu.classList.contains("hidden");
      document.querySelectorAll(".menu").forEach(m=>m.classList.add("hidden"));
      rowMenu.classList.toggle("hidden",!opening);
    };
    rowMenu.onclick=e=>e.stopPropagation();
    rowMenuWrap.append(rowMore,rowMenu);

    line.append(star,field,reveal,rowMenuWrap);
    row.append(line);
    if(memo)row.append(memo);

    row.onclick=e=>{
      if(e.target.closest("button,input,textarea,.memo"))return;
      focusStudyField(input);
    };
    list.append(row);
  });
}

const STUDY_COLORS=[
  ["","없음"],["#f1c84b","노랑"],["#ef9a9a","분홍"],["#9fc5e8","파랑"],
  ["#a9d6b2","초록"],["#c5b3e6","보라"],["#b9b9bf","회색"]
];
function colorTint(hex,alpha=.08){
  if(!hex||!/^#[0-9a-f]{6}$/i.test(hex))return "";
  const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}
function applyStudyColor(el,color,strong=false){
  if(!el)return;
  if(!color){el.style.removeProperty("--row-accent");el.style.removeProperty("--row-tint");el.classList.remove("has-row-color");return}
  el.style.setProperty("--row-accent",color);
  el.style.setProperty("--row-tint",colorTint(color,strong?.13:.075));
  el.classList.add("has-row-color");
}
function appendColorPalette(menu,row,onDone){

function makeItemRow(r,i,isDraft=false){

  const catTd=document.createElement("td"),corTd=document.createElement("td"),memoTd=document.createElement("td");

  const cor=document.createElement("input");cor.className="edit-correct";cor.value=r.correct||"";cor.placeholder=isDraft?"정답":"";cor.dataset.rowIndex=String(i);
  const memo=document.createElement("input");memo.type="text";memo.className="edit-memo";memo.value=r.memo||"";memo.placeholder=isDraft?"메모":"";
  if(isDraft){
    let committed=false;
    const commit=(field,value)=>{if(committed||!value)return;committed=true;const n=studyRow();n[field]=value;sh().rows.push(n);markStudyCloud();renderEdit()};
    cat.oninput=e=>commit("category",e.target.value);cor.oninput=e=>commit("correct",e.target.value);memo.oninput=e=>commit("memo",e.target.value);
  }else{
    cat.oninput=e=>{r.category=e.target.value;saveLocal()};cat.onchange=markStudyCloud;
    cor.oninput=e=>{r.correct=e.target.value;saveLocal()};cor.onchange=markStudyCloud;
    memo.oninput=e=>{r.memo=e.target.value;saveLocal()};memo.onchange=markStudyCloud;
    bindSafeEnter(cat,()=>{cor.focus();cor.select()});
    bindSafeEnter(cor,()=>{memo.focus();memo.select()});
    bindSafeEnter(memo,()=>{let next=i+1;while(next<sh().rows.length&&sh().rows[next].type==="section")next++;const target=[...document.querySelectorAll(".edit-correct")].find(x=>Number(x.dataset.rowIndex)===next);if(target){target.focus();target.select()}else document.querySelector(".draft-row .edit-correct")?.focus()});
  }
  catTd.append(cat);corTd.append(cor);memoTd.append(memo);tr.append(catTd,corTd,memoTd,isDraft?document.createElement("td"):makeActionMenu(i));return tr;

function cellValue(ws,addr){const c=ws[addr];return !c||c.v==null?"":cleanText(c.w!=null?c.w:c.v)}

function refsFromFormula(formula,row1){const out=[],re=/(?:'[^']+'!|[A-Za-z0-9_가-힣]+!)?\$?([A-Z]{1,3})\$?(\d+)/g;let m;while((m=re.exec(formula||""))){if(Number(m[2])!==row1)continue;const c=XLSX.utils.decode_col(m[1]);out.push({col:c,addr:XLSX.utils.encode_cell({r:row1-1,c})})}return out}
function detectFormulaRow(ws,r,range){
  let best=null;
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r,c}),cell=ws[addr];if(!cell||!cell.f)continue;
    const refs=refsFromFormula(cell.f,r+1).filter(x=>x.addr!==addr);if(refs.length<2)continue;
    const counts=new Map();refs.forEach(x=>counts.set(x.addr,(counts.get(x.addr)||0)+1));
    const uniq=[...counts.keys()].map(a=>{const p=XLSX.utils.decode_cell(a),v=cellValue(ws,a);let score=counts.get(a)||0;if(v)score+=5;if(colHidden(ws,p.c))score+=8;if(p.c>c)score+=2;return {addr:a,col:p.c,val:v,score,count:counts.get(a)||0}}).sort((a,b)=>b.score-a.score);
    const answer=uniq[0];if(!answer||!answer.val)continue;const input=uniq.slice(1).sort((a,b)=>b.count-a.count)[0];
    let memo="";if(input){const a=XLSX.utils.encode_cell({r,c:input.col+1}),x=ws[a];if(x&&!x.f&&input.col+1!==answer.col)memo=cellValue(ws,a)}
    if(norm(memo)===norm(answer.val))memo="";const cand={answer:answer.val,memo,_score:answer.score};if(!best||cand._score>best._score)best=cand;
  }return best;
}
function headingAt(ws,r,range){const vals=[];for(const c of [0,1,11,13]){if(c<range.s.c||c>range.e.c)continue;const a=XLSX.utils.encode_cell({r,c}),x=ws[a];if(x&&!x.f){const v=cellValue(ws,a);if(v)vals.push(v)}}return vals.find(v=>!/^hint$/i.test(v)&&v!=="정답"&&v!=="오답")||""}
function convertStudyWorksheet(ws,name){
  if(!ws["!ref"])return null;const range=XLSX.utils.decode_range(ws["!ref"]),det=new Map();
  for(let r=range.s.r;r<=range.e.r;r++){const d=detectFormulaRow(ws,r,range);if(d)det.set(r,d)}
  const rr=[...det.keys()].sort((a,b)=>a-b);if(!rr.length)return null;
  const rows=[];let prev=null,lastSec="";
  rr.forEach(r=>{if(prev==null||r>prev+1){const start=prev==null?Math.max(range.s.r,r-2):prev+1;let h="";for(let x=r-1;x>=start;x--){if(det.has(x))continue;const z=headingAt(ws,x,range);if(z){h=z;break}}if(h&&h!==lastSec){rows.push({...sectionRow(),title:h});lastSec=h}}
    const d=det.get(r);rows.push({...studyRow(),correct:d.answer,memo:d.memo||""});prev=r});
  return {id:uid(),name,rows};
}
async function workbookToStudySubject(file){
  const wb=XLSX.read(await file.arrayBuffer(),{cellFormula:true,cellStyles:true}),sheets=[];
  wb.SheetNames.forEach(name=>{const x=convertStudyWorksheet(wb.Sheets[name],name);if(x&&x.rows.some(r=>r.type==="item"))sheets.push(x)});
  if(!sheets.length)throw new Error("정답 위치를 찾지 못함");
  let name=file.name.replace(/\.(xlsx|xlsm|xlsb|xls)$/i,"");const base=name;let n=2;while(app.study.subjects.some(s=>s.name===name))name=`${base} ${n++}`;
  return {id:uid(),name,currentId:sheets[0].id,sheets};
}
async function importStudyFiles(files){
  const failed=[],made=[];
  for(const f of files){try{const s=await workbookToStudySubject(f);app.study.subjects.push(s);made.push(s)}catch{failed.push(f.name)}}
  if(made.length){app.study.subjectId=made[made.length-1].id;app.study.mode="edit";markStudyCloud();render()}
  if(failed.length)alert(`가져오지 못한 파일:\n${failed.join("\n")}`);else if(made.length)toast(`${made.length}개 과목 가져옴`);
}

/* Problem bank importer: A category / B question / C answer / D memo / E,F check flags / G tag */
function bankSheetId(source,name){return "b_"+hashString(source+"\u0000"+name)}
function makeBankItem(sheetId,rowNo,data){return {id:`${sheetId}_${rowNo}`,row:rowNo,...data}}
function isDerivedBankSheet(name){
  return name==="Sheet1"||name==="복습_문제은행";
}
function isLegacyWrongSheet(name){return name==="오답목록"||name==="복습_오답목록"}
function parseBankWorksheet(ws,source,name){
  if(!ws["!ref"])return null;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const hA=cellValue(ws,"A1"),hB=cellValue(ws,"B1"),hC=cellValue(ws,"C1");
  const looksLikeBank=/카테고리|분류/.test(hA)&&/문제|단어/.test(hB)&&/정답/.test(hC);
  if(!looksLikeBank)return null;
  const sid=bankSheetId(source,name),items=[];let inheritedCategory="",section="";
  for(let r=1;r<=range.e.r;r++){
    const a=cellValue(ws,XLSX.utils.encode_cell({r,c:0}));
    const q=cellValue(ws,XLSX.utils.encode_cell({r,c:1}));
    const ans=cellValue(ws,XLSX.utils.encode_cell({r,c:2}));
    const memo=cellValue(ws,XLSX.utils.encode_cell({r,c:3}));
    const e=ws[XLSX.utils.encode_cell({r,c:4})]?.v;
    const f=ws[XLSX.utils.encode_cell({r,c:5})]?.v;
    const g=cellValue(ws,XLSX.utils.encode_cell({r,c:6}));
    if(!a&&!q&&!ans&&!memo)continue;
    if(a)inheritedCategory=a;
    if(!q)continue;

    // 확실한 구분행만 제외한다. 애매한 행은 절대 버리지 않는다.
    const qn=norm(q), an=norm(ans);
    const singleLetter=/^[A-Za-z]$/.test(q.trim()) &&
      ((!a)||norm(a)===qn) &&
      ((!ans)||an===qn);
    const sameStructural=!!ans && qn===an && !a && !memo && q.trim().length<=24;
    if(singleLetter||sameStructural){section=q;continue}

    // 영어_단어장처럼 A열이 "001 accuracy 11" 형태의 원본 색인인 경우,
    // 문제와 같은 단어가 두 번 보이지 않도록 화면용 카테고리에서는 제거한다.
    // 원본 A열은 sourceLabel에 보존한다.
    let category=a||inheritedCategory||"";
    let sourceLabel="";
    const numbered=category.match(/^\s*\d{1,4}\s+(.+?)\s+\d{1,4}\s*$/);
    if(numbered && norm(numbered[1])===qn){
      sourceLabel=category;
      category="";
    }

    const made=makeBankItem(sid,r+1,{
      category,section,question:q,answer:ans,memo,
      excelCheck:!!e,excelCheck2:!!f,tag:g||"",sourceLabel,
      legacyWrong:isLegacyWrongSheet(name)
    });
    made.canonicalId=canonicalProblemId(made);
    items.push(made);
  }
  if(!items.length)return null;
  const seen=new Set(),deduped=[];
  for(const item of items){
    const key=[norm(item.category),norm(item.question),norm(item.answer),norm(item.memo),norm(item.section)].join("\u0001");
    if(seen.has(key))continue;
    seen.add(key);deduped.push(item);
  }
  return {id:sid,source,name,legacyWrong:isLegacyWrongSheet(name),items:deduped,updatedAt:Date.now()};
}
let bankImportBusy=false;
async function importBankFiles(files){
  if(bankImportBusy)return toast("가져오는 중입니다");
  if(typeof XLSX==="undefined")return alert("엑셀 읽기 기능을 불러오지 못했습니다.");
  bankImportBusy=true;
  const failed=[],newSheets=[],sources=[];
  try{
    toast("문제은행 읽는 중…");
    for(const file of files){
      try{
        // iPad/Safari에서 큰 XLSM을 읽을 때 UI가 완전히 멎지 않도록 한 번 양보.
        await new Promise(r=>setTimeout(r,0));
        const source=file.name.replace(/\.(xlsx|xlsm|xlsb|xls)$/i,"");
        const wb=XLSX.read(await file.arrayBuffer(),{cellFormula:true,cellStyles:true});
        sources.push(source);
        for(const name of wb.SheetNames){
          if(isDerivedBankSheet(name))continue;
          const parsed=parseBankWorksheet(wb.Sheets[name],source,name);
          if(parsed)newSheets.push(parsed);
        }
      }catch(e){
        console.error("bank import failed:",file.name,e);
        failed.push(file.name);
      }
    }

    if(newSheets.length){
      const sourceSet=new Set(sources);
      const oldIds=app.bank.sheets.filter(s=>sourceSet.has(s.source)).map(s=>s.id);

      // 같은 원본 파일을 다시 올리면 그 파일에서 왔던 시트만 교체.
      // 다른 원본 파일의 문제는 그대로 유지.
      app.bank.sheets=app.bank.sheets.filter(s=>!sourceSet.has(s.source)).concat(newSheets);
      cleanExistingBankData();

      if(!app.ui.quiz.sheetId){
        app.ui.quiz.sheetId="all";
      }else if(app.ui.quiz.sheetId!=="all"&&!String(app.ui.quiz.sheetId).startsWith("name:")){
        const oldSheet=app.bank.sheets.find(s=>s.id===app.ui.quiz.sheetId);
        app.ui.quiz.sheetId=oldSheet?("name:"+encodeURIComponent(oldSheet.name)):"all";
      }

      app.bank.contentUpdatedAt=Date.now();
      saveLocal();

      // 가장 중요: 화면에는 로컬 데이터를 즉시 보여준다.
      // Firestore 업로드가 끝날 때까지 기다리지 않는다.
      const total=newSheets.reduce((n,x)=>n+x.items.length,0);
      const unique=mergeDuplicateQuizItems(bankQuestions(true)).length;
      renderQuiz();renderBankEditor();
      toast(`${newSheets.length}개 시트 · ${total}문제 불러옴`);

      const deleted=oldIds.filter(id=>!newSheets.some(s=>s.id===id));
      if(cloudUser){
        updateSync("…",true);
        syncImportedBankSheets(newSheets,deleted).then(()=>{
          updateSync("✓",true);
          toast(`저장 완료 · 통합 ${unique}문제`);
        }).catch(e=>{
          console.error(e);
          updateSync("!",false);
          toast("기기에는 저장됨 · 클라우드 동기화 실패");
        });
      }
    }else if(!failed.length){
      alert("가져올 수 있는 문제 시트를 찾지 못했습니다.\nA열=카테고리/분류, B열=문제/단어, C열=정답 형식인지 확인해 주세요.");
    }

    if(failed.length)alert(`가져오지 못한 파일:\n${failed.join("\n")}`);
  }finally{
    bankImportBusy=false;
  }
}
function bankQuestions(includeLegacy=false){
  return app.bank.sheets.filter(s=>includeLegacy||!s.legacyWrong).flatMap(s=>s.items.map(i=>({...i,sheetId:s.id,sheetName:s.name,source:s.source})));
}
function cleanExistingBankData(){
  if(!app.bank?.sheets)return;
  let changed=false;
  app.bank.sheets.forEach(sheet=>{
    const cleaned=[],seen=new Set();
    let section="";
    (sheet.items||[]).forEach(item=>{
      item.question=cleanText(item.question);
      item.answer=cleanText(item.answer);
      item.memo=cleanText(item.memo);
      item.category=cleanText(item.category);
      item.section=cleanText(item.section);

      const q=(item.question||"").trim(), a=(item.answer||"").trim();
      const qn=norm(q), an=norm(a);
      const cid="q_"+hashString(qn+"\u0001"+an);
      if(item.canonicalId!==cid){item.canonicalId=cid;changed=true}

      // 기존에 가져온 영어 단어장 색인(A열)의 반복 표시만 정리.
      const numbered=(item.category||"").match(/^\s*\d{1,4}\s+(.+?)\s+\d{1,4}\s*$/);
      if(numbered && norm(numbered[1])===qn){
        item.sourceLabel=item.sourceLabel||item.category;
        item.category="";
        changed=true;
      }

      // A/B/C가 한 글자 알파벳인 명백한 구분행만 문제에서 제외.
      const single=/^[A-Za-z]$/.test(q) &&
        ((!item.category)||norm(item.category)===qn) &&
        ((!a)||an===qn);
      if(single){section=q;changed=true;return}

      // 문제=정답인 무분류 짧은 구분행(예: 기본이론)만 소제목으로 전환.
      const structural=q&&a&&qn===an&&!item.category&&!item.memo&&q.length<=24;
      if(structural){section=q;changed=true;return}

      if(!item.section&&section){item.section=section;changed=true}

      // 완전히 동일한 행만 하나로 합친다. 문제/정답만 같고 맥락이 다르면 유지.
      const key=[norm(item.category),qn,an,norm(item.memo),norm(item.section)].join("\\u0001");
      if(seen.has(key)){changed=true;return}
      seen.add(key);cleaned.push(item);
    });
    if(cleaned.length!==sheet.items.length){sheet.items=cleaned;sheet.updatedAt=Date.now()}
  });
  if(changed){app.bank.contentUpdatedAt=Date.now();saveLocal()}
}
function getStat(itemOrId){
  const id=typeof itemOrId==="string"?itemOrId:canonicalProblemId(itemOrId);
  if(!app.bank.stats[id])app.bank.stats[id]={attempts:0,wrong:0,correct:0,needsReview:false,lastWrongAt:0,flagged:false,flagCount:0};
  if(app.bank.stats[id].flagged==null)app.bank.stats[id].flagged=false;
  if(app.bank.stats[id].flagCount==null)app.bank.stats[id].flagCount=0;
  if(app.bank.stats[id].flagReason==null)app.bank.stats[id].flagReason="";
  return app.bank.stats[id];
}
function recordQuiz(item,ok){
  if(quizSession){if(ok)quizSession.correctCount=(quizSession.correctCount||0)+1;else quizSession.wrongCount=(quizSession.wrongCount||0)+1;}

  const st=getStat(item);st.attempts++;
  if(ok){st.correct++;}else{st.wrong++;st.needsReview=true;st.lastWrongAt=Date.now();if(quizSession?.mastery)quizSession.nextRound.push(item)}
  markBankStatsCloud();
}
function clearWrong(item){const st=getStat(item);st.needsReview=false;markBankStatsCloud();renderQuiz()}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function bankSheetMeta(sheet){
  const name=(sheet?.name||"").trim();
  const ix=name.indexOf("_");
  return ix>0?{subject:name.slice(0,ix).trim(),area:name.slice(ix+1).trim()}:{subject:"기타",area:name||"기타"};
}
function bankSubjects(){
  return [...new Set(app.bank.sheets.filter(s=>!s.legacyWrong).map(s=>bankSheetMeta(s).subject))];
}
function bankAreas(subject){
  return [...new Set(app.bank.sheets.filter(s=>!s.legacyWrong&&bankSheetMeta(s).subject===subject).map(s=>bankSheetMeta(s).area))];
}
function selectedBankSheets(){
  const q=app.ui.quiz;
  let sheets=app.bank.sheets.filter(s=>!s.legacyWrong);
  if(q.subject&&q.subject!=="all"){
    sheets=sheets.filter(s=>bankSheetMeta(s).subject===q.subject);
    const areas=bankAreas(q.subject);
    const picked=q.areaSelectionV2?(Array.isArray(q.areas)?q.areas:[]):areas;
    sheets=sheets.filter(s=>picked.includes(bankSheetMeta(s).area));
  }
  return sheets;
}
function quizRangeLabel(){
  const q=app.ui.quiz;
  if(q.subject==="all"||!q.subject)return "전체 과목";
  const all=bankAreas(q.subject),picked=q.areaSelectionV2?(q.areas||[]):all;
  if(picked.length===all.length)return `${q.subject} 전체`;if(!picked.length)return `${q.subject} · 선택 없음`;
  return picked.length===1?`${q.subject} · ${picked[0]}`:`${q.subject} · ${picked[0]} 외 ${picked.length-1}`;
}
function rememberQuizRange(){
  const q=app.ui.quiz,label=quizRangeLabel();
  const key=JSON.stringify([q.subject,[...(q.areas||[])].sort()]);
  q.recentRanges=(q.recentRanges||[]).filter(x=>x.key!==key);
  q.recentRanges.unshift({key,label,subject:q.subject,areas:[...(q.areas||[])]});
  q.recentRanges=q.recentRanges.slice(0,3);
}
function quizPool(){
  const q=app.ui.quiz;
  let sheets=selectedBankSheets();
  let items=sheets.flatMap(s=>s.items.map(i=>({...i,sheetId:s.id,sheetName:s.name,source:s.source,subject:bankSheetMeta(s).subject,area:bankSheetMeta(s).area})));
  if(q.filter==="unchecked")items=items.filter(i=>!i.excelCheck);
  if(q.filter==="checked")items=items.filter(i=>i.excelCheck);
  if(q.filter==="answered")items=items.filter(i=>i.answer);
  if(q.filter==="wrong")items=items.filter(i=>getStat(i).needsReview);
  if(q.filter==="starred")items=items.filter(i=>getStat(i).flagged);
  if(q.mode!=="write")items=items.filter(i=>i.answer);
  items=mergeDuplicateQuizItems(items);
  if(q.groupOrder==="mixed"||q.order==="random")return shuffled(items);
  return items;
}
let quizLastComplete=null;
function startQuiz(customItems=null,appendCount=null){
  const full=customItems?[...customItems]:quizPool();
  if(!full.length)return toast("출제할 문제가 없습니다");
  const limit=appendCount||app.ui.quiz.sessionSize;
  const n=limit==="all"?full.length:(Number(limit)||20);
  const items=full.slice(0,n),remaining=full.slice(n);
  rememberQuizRange();
  quizLastComplete=null;
  quizSession={items,index:0,remaining,answered:false,selected:null,showAnswer:false,draft:"",choices:[],round:1,nextRound:[],deferred:[],mastery:!!app.ui.quiz.mastery,rangeLabel:quizRangeLabel(),initialCount:items.length,correctCount:0,wrongCount:0};
  document.body.classList.add("quiz-running");
  buildChoices();saveQuizSessionLocal();saveLocal();renderQuizQuestion();
}
function currentQuizItem(){return quizSession?.items[quizSession.index]}
function buildChoices(){
  if(!quizSession||app.ui.quiz.mode!=="choice")return;
  const item=currentQuizItem();
  const same=mergeDuplicateQuizItems(bankQuestions(false)).filter(x=>{
    const metaSheet=app.bank.sheets.find(s=>s.id===x.sheetId);
    const meta=bankSheetMeta(metaSheet||{name:x.sheetName});
    return meta.subject===(item.subject||bankSheetMeta({name:item.sheetName}).subject) &&
      x.answer&&canonicalProblemId(x)!==canonicalProblemId(item)&&norm(x.answer)!==norm(item.answer);
  });
  const exactArea=same.filter(x=>bankSheetMeta({name:x.sheetName}).area===(item.area||bankSheetMeta({name:item.sheetName}).area));
  const sameCat=exactArea.filter(x=>x.category&&x.category===item.category);
  const candidates=[...shuffled(sameCat),...shuffled(exactArea.filter(x=>!sameCat.includes(x)))];
  const distract=[],seen=new Set([norm(item.answer)]);
  for(const x of candidates){const n=norm(x.answer);if(!n||seen.has(n))continue;seen.add(n);distract.push(x.answer);if(distract.length===3)break}
  quizSession.choices=shuffled([item.answer,...distract]);
}
function finishQuiz(){
  quizLastComplete={
    label:quizSession?.rangeLabel||quizRangeLabel(),
    count:quizSession?.initialCount||quizSession?.items?.length||0,
    correctCount:quizSession?.correctCount||0,
    wrongCount:quizSession?.wrongCount||0,
    remaining:[...(quizSession?.remaining||[])]
  };
  quizSession=null;clearSavedQuiz();document.body.classList.remove("quiz-running");renderQuiz();
}
function nextQuiz(){
  if(!quizSession)return;
  if(quizSession.index>=quizSession.items.length-1){
    if(quizSession.deferred?.length){
      const seen=new Set(),later=quizSession.deferred.filter(x=>{const k=canonicalProblemId(x);if(seen.has(k))return false;seen.add(k);return true});
      quizSession.items=later;quizSession.index=0;quizSession.deferred=[];quizSession.answered=false;quizSession.selected=null;quizSession.showAnswer=false;quizSession.draft="";
      buildChoices();saveQuizSessionLocal();toast(`나중에 ${later.length}문제`);renderQuizQuestion();return;
    }
    if(quizSession.mastery&&quizSession.nextRound.length){
      const seen=new Set(),remain=quizSession.nextRound.filter(x=>{const k=canonicalProblemId(x);if(seen.has(k))return false;seen.add(k);return true});
      quizSession.items=app.ui.quiz.order==="random"?shuffled(remain):remain;
      quizSession.index=0;quizSession.round++;quizSession.nextRound=[];quizSession.answered=false;quizSession.selected=null;quizSession.showAnswer=false;quizSession.draft="";
      buildChoices();saveQuizSessionLocal();toast(`${quizSession.round}회차 · ${quizSession.items.length}문제 남음`);renderQuizQuestion();return;
    }
    finishQuiz();return;
  }
  quizSession.index++;quizSession.answered=false;quizSession.selected=null;quizSession.showAnswer=false;quizSession.draft="";buildChoices();saveQuizSessionLocal();renderQuizQuestion();
}
function renderBankToolbar(){
  const box=document.getElementById("bankToolbar");box.innerHTML="";
  if(quizSession)return;

  const summary=document.createElement("button");summary.className="quiz-setup-summary";

function currentSessionScore(){
  if(!quizSession)return {correct:0,wrong:0};
  let correct=0,wrong=0;
  const seen=new Set();
  const all=[...(quizSession.items||[]),...(quizSession.done||[])];
  for(const it of all){
    const id=canonicalProblemId(it);
    if(seen.has(id))continue;
    seen.add(id);
    const st=quizSession.sessionResults?.[id];
    if(st==="correct")correct++;
    else if(st==="wrong")wrong++;
  }
  if(quizSession.correctCount!=null||quizSession.wrongCount!=null){
    return {correct:quizSession.correctCount||0,wrong:quizSession.wrongCount||0};
  }
  return {correct,wrong};
}

  setTimeout(()=>{if(quizSession?.answered)nextQuiz()}, ok?450:1000);
}
function checkSubjective(input){

function bankDuplicateAudit(sheet){
  const groups=new Map();
  (sheet?.items||[]).forEach(item=>{
    const q=norm(item.question),a=norm(item.answer);
    if(!q)return;
    const key=q+"\\u0001"+a;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(item);
  });
  return [...groups.values()].filter(g=>g.length>1);
}

/* local appearance settings */
const FONT_DB_NAME="study-jew-fonts";
const FONT_DB_STORE="files";
let activeFontFace=null;
function openFontDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(FONT_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FONT_DB_STORE))db.createObjectStore(FONT_DB_STORE)};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function saveFontBlob(blob,name){
  const db=await openFontDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(FONT_DB_STORE,"readwrite");
    tx.objectStore(FONT_DB_STORE).put({blob,name},"custom");
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
  db.close();
}
async function loadFontBlob(){
  const db=await openFontDb();
  const value=await new Promise((resolve,reject)=>{
    const tx=db.transaction(FONT_DB_STORE,"readonly");
    const req=tx.objectStore(FONT_DB_STORE).get("custom");
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
  });
  db.close();return value;
}
async function clearFontBlob(){
  const db=await openFontDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(FONT_DB_STORE,"readwrite");
    tx.objectStore(FONT_DB_STORE).delete("custom");
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
  db.close();
}
async function installLocalFont(blob){
  try{
    if(activeFontFace)document.fonts.delete(activeFontFace);
    const url=URL.createObjectURL(blob);
    const face=new FontFace("StudyUserFont",`url(${url})`);
    await face.load();document.fonts.add(face);activeFontFace=face;
    URL.revokeObjectURL(url);
    document.documentElement.style.setProperty("--app-font-family",'"StudyUserFont", "Noto Sans KR", sans-serif');
    return true;
  }catch(e){console.error(e);return false}
}
function applyAppearanceSettings(){
  const st=app.ui.settings||{};
  const memSize=st.memoryFontSize||14,quizSize=st.quizFontSize||17;
  const memScale=memSize/14,quizScale=quizSize/17;
  const root=document.documentElement.style;
  root.setProperty("--memory-font-size",`${memSize}px`);
  root.setProperty("--quiz-font-size",`${quizSize}px`);
  root.setProperty("--memory-control-h",`${Math.round(34*memScale)}px`);
  root.setProperty("--memory-button-h",`${Math.round(30*memScale)}px`);
  root.setProperty("--memory-row-vpad",`${Math.max(4,Math.round(5*memScale))}px`);
  root.setProperty("--memory-input-xpad",`${Math.max(7,Math.round(9*memScale))}px`);
  root.setProperty("--memory-star-size",`${Math.max(11,Math.min(16,Math.round(13*memScale)))}px`);
  root.setProperty("--quiz-choice-h",`${Math.round(48*quizScale)}px`);
  root.setProperty("--quiz-choice-vpad",`${Math.max(9,Math.round(12*quizScale))}px`);
  root.setProperty("--quiz-card-pad",`${Math.max(14,Math.round(20*quizScale))}px`);
  document.body.dataset.studyDensity=st.density||"compact";
  if(!st.fontName)root.setProperty("--app-font-family",'"Noto Sans KR", sans-serif');
  const mem=document.getElementById("memoryFontValue"),quiz=document.getElementById("quizFontValue"),name=document.getElementById("fontName");
  if(mem)mem.textContent=memSize;
  if(quiz)quiz.textContent=quizSize;
  if(name)name.textContent=st.fontName||"기본 글꼴";
  document.querySelectorAll("#densityControl button").forEach(b=>b.classList.toggle("active",b.dataset.density===(st.density||"compact")));
}
async function restoreLocalFont(){
  if(!app.ui.settings?.fontName){applyAppearanceSettings();return}
  try{
    const saved=await loadFontBlob();
    if(saved?.blob){const ok=await installLocalFont(saved.blob);if(!ok)throw new Error("font load failed")}
    else{app.ui.settings.fontName="";saveLocal()}
  }catch(e){console.error(e);app.ui.settings.fontName="";saveLocal()}
  applyAppearanceSettings();
}
function openSettings(){
  applyAppearanceSettings();
  document.getElementById("settingsModal").classList.remove("hidden");
}
function closeSettings(){document.getElementById("settingsModal").classList.add("hidden")}
function changeSettingSize(key,delta,min,max){
  const st=app.ui.settings;
  st[key]=Math.max(min,Math.min(max,(st[key]||min)+delta));
  saveLocal();applyAppearanceSettings();
}

/* cloud: transient study answer text/user UI are NOT synchronized */
function cloudStudyPayload(){
  const copy=JSON.parse(JSON.stringify(app.study));
  delete copy.mode;delete copy.subjectId;
  copy.subjects.forEach(s=>{delete s.currentId;s.sheets.forEach(sh=>sh.rows.forEach(r=>{delete r.user;delete r.last;delete r.revealed}))});
  return copy;
}
function mergeCloudStudy(remote){
  const localTransient=new Map();
  app.study.subjects.forEach(s=>s.sheets.forEach(sh=>sh.rows.forEach(r=>{localTransient.set(r.id,{user:r.user||"",last:r.last||"",revealed:!!r.revealed})})));
  const localSubjectId=app.study.subjectId,localMode=app.study.mode;
  const localCurrent=new Map(app.study.subjects.map(s=>[s.id,s.currentId]));
  const incoming=JSON.parse(JSON.stringify(remote));
  incoming.subjects?.forEach(s=>{s.currentId=localCurrent.get(s.id)||s.sheets?.[0]?.id;s.sheets?.forEach(sh=>sh.rows?.forEach(r=>{const t=localTransient.get(r.id)||{};r.user=t.user||"";r.last=t.last||"";r.revealed=!!t.revealed}))});
  incoming.subjectId=incoming.subjects?.some(s=>s.id===localSubjectId)?localSubjectId:incoming.subjects?.[0]?.id;
  incoming.mode=localMode;
  app.study=incoming;cleanup();saveLocal();
}

async function syncImportedBankSheets(sheets,deleted=[]){
  if(!cloudUser)return;
  // 한 번에 수십 개 Promise를 터뜨리지 않고 순차 저장해 iPad/모바일에서 안정적으로 처리.
  for(const sheet of sheets){

  if(!index?.sheets)return;
  const docs=await Promise.all(index.sheets.map(async x=>{const snap=await getDoc(bankSheetDoc(u,x.id));return snap.exists()?snap.data():null}));

onAuthStateChanged(auth,async user=>{
  cloudUser=user;if(studyUnsub){studyUnsub();studyUnsub=null}if(bankIndexUnsub){bankIndexUnsub();bankIndexUnsub=null}
  renderSubjects();if(!user)return;
  updateSync("…",true);
  try{
    const sref=studyDoc(user.uid),ss=await getDoc(sref);
    if(ss.exists()){
      const d=ss.data();if((d.updatedAt||0)>(app.study.updatedAt||0)&&d.study){applyingRemote=true;mergeCloudStudy(d.study);applyingRemote=false;render()}
      else scheduleStudyCloud();
    }else scheduleStudyCloud();
    studyUnsub=onSnapshot(sref,snap=>{if(!snap.exists())return;const d=snap.data();if(d.study&&(d.updatedAt||0)>(app.study.updatedAt||0)){applyingRemote=true;mergeCloudStudy(d.study);applyingRemote=false;render()}});
    const bref=bankIndexDoc(user.uid),bi=await getDoc(bref);
    if(bi.exists()){const d=bi.data();if((d.updatedAt||0)>(app.bank.contentUpdatedAt||0))await loadBankFromCloud(user.uid,d)}
    else if(app.bank.sheets.length)await syncImportedBankSheets(app.bank.sheets);
    bankIndexUnsub=onSnapshot(bref,async snap=>{if(!snap.exists())return;const d=snap.data();if((d.updatedAt||0)>(app.bank.contentUpdatedAt||0))await loadBankFromCloud(user.uid,d)});
    const stat=await getDoc(bankStatsDoc(user.uid));

    updateSync("✓",true);

});

document.getElementById("excelSubjectChoice").onclick=()=>document.getElementById("studyExcelFiles").click();
document.getElementById("studyExcelFiles").onchange=async e=>{const files=[...e.target.files];e.target.value="";document.getElementById("subjectModal").classList.add("hidden");if(files.length)await importStudyFiles(files)};
document.getElementById("bankExcelFiles").onchange=async e=>{const files=[...e.target.files];e.target.value="";if(files.length){try{await importBankFiles(files)}catch(err){console.error(err);bankImportBusy=false;alert("문제은행을 가져오는 중 오류가 났습니다. 다시 시도해 주세요.")}}};

document.getElementById("settingsClose").onclick=closeSettings;
document.getElementById("settingsModal").onclick=e=>{if(e.target.id==="settingsModal")closeSettings()};
document.getElementById("fontChoose").onclick=()=>document.getElementById("fontFile").click();
document.getElementById("fontFile").onchange=async e=>{
  const file=e.target.files?.[0];e.target.value="";if(!file)return;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!["ttf","otf","woff","woff2"].includes(ext))return toast("ttf / otf / woff / woff2 파일만 가능");
  if(file.size>15*1024*1024)return toast("폰트 파일이 너무 큽니다");
  const ok=await installLocalFont(file);
  if(!ok)return toast("이 폰트를 불러오지 못했습니다");
  try{
    await saveFontBlob(file,file.name);
    app.ui.settings.fontName=file.name;saveLocal();applyAppearanceSettings();toast("폰트 적용됨");
  }catch(err){console.error(err);toast("폰트 저장 실패")}
};
document.getElementById("fontReset").onclick=async()=>{
  try{await clearFontBlob()}catch(e){console.error(e)}
  if(activeFontFace){document.fonts.delete(activeFontFace);activeFontFace=null}
  app.ui.settings.fontName="";saveLocal();applyAppearanceSettings();toast("기본 글꼴로 변경됨");
};
document.getElementById("memoryFontDown").onclick=()=>changeSettingSize("memoryFontSize",-1,12,20);
document.getElementById("memoryFontUp").onclick=()=>changeSettingSize("memoryFontSize",1,12,20);
document.getElementById("quizFontDown").onclick=()=>changeSettingSize("quizFontSize",-1,14,24);
document.getElementById("quizFontUp").onclick=()=>changeSettingSize("quizFontSize",1,14,24);
document.querySelectorAll("#densityControl button").forEach(b=>b.onclick=()=>{app.ui.settings.density=b.dataset.density;saveLocal();applyAppearanceSettings()});
document.getElementById("settingsResetAll").onclick=async()=>{
  if(!confirm("글꼴과 화면 설정을 기본값으로 돌릴까요?"))return;
  try{await clearFontBlob()}catch(e){console.error(e)}
  if(activeFontFace){document.fonts.delete(activeFontFace);activeFontFace=null}
  app.ui.settings={fontName:"",memoryFontSize:14,quizFontSize:17,density:"compact"};
  saveLocal();applyAppearanceSettings();toast("설정 초기화됨");
};

window.addEventListener("resize",()=>renderSubjects());
applyAppearanceSettings();
restoreLocalFont();
render();
</script>
</body>
</html>
