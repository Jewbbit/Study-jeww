<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Jew</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
/* PWA */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js",{scope:"./"})
      .then(reg=>reg.update().catch(()=>{}))
      .catch(err=>console.warn("service worker registration failed",err));
  });
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{
  --bg:#f5f5f7;--card:#fff;--line:#e4e4e8;--text:#171719;--sub:#8d8d94;
  --ok:#23855a;--bad:#c94b45;--accent:#6557e8;--soft:#f2f2f5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;background:rgba(245,245,247,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.navline{display:flex;align-items:center;gap:7px;padding:7px 10px}
.scrolltabs{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.scrolltabs::-webkit-scrollbar{display:none}
.right-tools{display:flex;align-items:center;gap:5px;margin-left:auto;flex:0 0 auto}
.chip,.icon,.modebar button,.small-btn,.tool-btn{
  border:0;background:var(--card);border-radius:10px;color:var(--text)
}
.chip{padding:7px 11px;white-space:nowrap;flex:0 0 auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;touch-action:pan-y}
.chip.active{background:var(--text);color:#fff}
.icon{width:33px;height:33px;flex:0 0 auto;font-size:17px}
.icon.muted{color:#aaa}
.sync-btn{width:auto;min-width:38px;padding:0 9px;font-size:11px;color:#777}
.sync-btn.signed{color:var(--ok)}
.reorder-dragging{opacity:.4;transform:scale(.97)}
.reorder-target{outline:2px solid #aaa;outline-offset:2px}
.sheet-tab-tools{display:inline-flex;align-items:center;gap:1px;position:relative;flex:0 0 auto}
.sheet-tab-tool{border:0!important;background:transparent!important;color:#777!important;padding:5px 6px!important;min-width:27px}
.sheet-tab-tools .menu{top:31px;right:0;min-width:190px}

main{max-width:1050px;margin:0 auto;padding:10px 10px 44px}
.modebar{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto;scrollbar-width:none}
.modebar::-webkit-scrollbar{display:none}
.modebar button{padding:8px 11px;color:var(--sub);white-space:nowrap}
.modebar button.active{background:var(--text);color:#fff}
.study-head,.edit-head,.page-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sheet-title,.page-title{font-size:20px;font-weight:750;flex:1;min-width:0;padding:3px 2px}
.study-menu-wrap,.subject-menu-wrap,.section-menu-wrap{position:relative;flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.card.flagged{border-color:#c7c1ff}
.meta{display:flex;align-items:center;gap:6px;min-height:19px;margin-bottom:5px}
.category{font-size:11px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{font-size:11px;color:var(--sub)}
.star{border:0;background:transparent;font-size:18px;color:#c5c5ca;padding:0 1px}
.star.on{color:#e4a500}
.answer-line{display:flex;align-items:center;gap:6px}
.answer{
  flex:0 1 68%;min-width:120px;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:8px 10px;font-size:15px;outline:none
}
.answer:focus{border-color:#aaa}
.answer.correct{border-color:var(--ok);background:#f4fbf7}
.answer.wrong{border-color:var(--bad);background:#fff6f5}
.answer-action{border:0;background:var(--soft);border-radius:8px;padding:8px 9px;font-size:11px;color:#555;white-space:nowrap}
.clear-answer{width:32px;height:32px;padding:0;font-size:17px}
.revealed-answer{display:none!important;margin-top:6px;padding:8px 9px;background:#f4f4f6;border-radius:8px;font-weight:650;white-space:pre-wrap;font-size:13px}
.memo-btn{margin-top:6px;border:0;background:transparent;color:var(--sub);padding:0;font-size:11px}
.memo{display:none;margin-top:6px;font-size:12px;color:#555;white-space:pre-wrap}
.memo.show{display:block}
.section-study-head{display:flex;align-items:center;gap:4px;margin-top:4px}
.section-title{font-weight:760;font-size:14px;flex:1;padding:6px 2px 4px}
.section-toggle{border:0;background:transparent;color:#888;padding:4px 5px}
.more{border:0;background:transparent;color:#999;width:30px;height:30px;border-radius:8px}
.more:active{background:#ececef;color:#555}
.menu{position:absolute;right:0;top:36px;z-index:80;min-width:155px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;box-shadow:0 9px 30px rgba(0,0,0,.13)}
.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 9px;border-radius:7px;font-size:12px;color:#333}
.menu button:active{background:#f2f2f4}
.menu .danger{color:var(--bad)}
.menu-sep{height:1px;background:var(--line);margin:4px}
.edit-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.edit-head{margin:0;padding:7px;border-bottom:1px solid var(--line)}
#sheetName{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:720;padding:5px;outline:none}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--sub);font-weight:500;text-align:left;padding:7px;border-bottom:1px solid var(--line)}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
td input,td textarea{width:100%;border:0;background:transparent;padding:7px;outline:none;border-radius:6px}
td input:focus,td textarea:focus{background:#f7f7f9}
.edit-memo{min-height:34px;resize:vertical}
.edit-correct{font-weight:600;min-height:34px;resize:vertical}
.action-cell{position:relative;width:39px;text-align:center}
.section-edit{background:#f7f7f9;padding:3px 5px}
.section-edit input{font-weight:750}
.draft-row td{background:#fbfbfc}
.draft-row input,.draft-row textarea{color:#555}
.adds{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.adds button{border:0;background:#fff;padding:10px;color:#777}
.adds button+button{border-left:1px solid var(--line)}
.modal-backdrop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:min(360px,100%);background:#fff;border-radius:17px;padding:13px;box-shadow:0 15px 45px rgba(0,0,0,.2)}
.modal-title{font-weight:750;padding:5px 4px 10px}
.modal-choice{display:block;width:100%;border:0;background:#f5f5f7;border-radius:11px;padding:12px;text-align:left;margin:6px 0}
.modal-cancel{display:block;width:100%;border:0;background:transparent;color:#888;padding:9px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:150;background:#222;color:#fff;border-radius:20px;padding:8px 13px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}

/* problem bank */
.bank-toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px}
.bank-toolbar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bank-toolbar select,.bank-toolbar button,.bank-toolbar input{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:12px
}
.bank-toolbar select{max-width:220px}
.primary{background:var(--text)!important;color:#fff!important;border-color:var(--text)!important}
.question-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.q-top{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.q-tag{font-size:11px;color:var(--sub);flex:1}
.q-progress{font-size:11px;color:var(--sub)}
.question{font-size:17px;line-height:1.55;font-weight:650;white-space:pre-wrap;margin:8px 0 13px}
.choices{display:grid;gap:7px}
.choice{display:flex;align-items:flex-start;gap:9px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left}
.choice .num{flex:0 0 22px;font-weight:700;color:var(--sub)}
.choice.correct{border-color:var(--ok);background:#f4fbf7}
.choice.wrong{border-color:var(--bad);background:#fff5f4}
.quiz-answer{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
.quiz-answer.correct{border-color:var(--ok);background:#f4fbf7}
.quiz-answer.wrong{border-color:var(--bad);background:#fff5f4}
.write-answer{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;outline:none}
.quiz-actions{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.quiz-actions button{border:0;background:var(--soft);border-radius:9px;padding:9px 10px;font-size:12px}
.quiz-actions .primary{margin-left:auto}
.answer-panel{margin-top:10px;padding:10px;border-radius:10px;background:#f4f4f6;white-space:pre-wrap;font-size:13px}
.bank-empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:30px 15px;text-align:center;color:#777}
.bank-empty button{margin-top:10px;border:0;background:var(--text);color:#fff;border-radius:10px;padding:10px 13px}
.wrong-list{display:flex;flex-direction:column;gap:6px}
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.wrong-item-top{display:flex;gap:7px;align-items:center}
.wrong-q{font-size:13px;line-height:1.4;flex:1}
.wrong-stat{font-size:11px;color:var(--bad)}
.wrong-meta{font-size:11px;color:var(--sub);margin-top:4px}
.bank-manage{margin-left:auto}
.bank-source-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.bank-source-chip{background:var(--soft);border:0;border-radius:8px;padding:6px 8px;font-size:11px}
.empty{height:20px}

/* tablet */
@media(min-width:641px) and (max-width:1100px){
  main{max-width:none;padding:8px 8px 38px}
  .navline{padding:6px 8px}
  .chip{padding:6px 10px}
  .card{padding:8px 9px}
  .list{gap:5px}
  .answer{padding:7px 9px;flex-basis:62%}
  .answer-action{padding:7px 8px}
  .section-title{padding-top:5px}
}
/* phone */
@media(max-width:640px){
  main{padding:8px 7px 74px}
  .navline{padding:6px 7px}
  .chip{padding:6px 9px}
  .modebar{gap:5px;margin-bottom:7px}
  .modebar button{padding:7px 9px;font-size:12px}
  .sheet-title,.page-title{font-size:18px}
  .answer-line{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:5px}
  .answer{max-width:none;width:100%;min-width:0}
  .card{padding:8px;border-radius:11px}
  .table-wrap{overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--bg)}
  tr{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 38px 5px 5px}
  td{border:0;padding:1px}
  td:has(.edit-input)::before{content:"카테고리";display:block;font-size:10px;color:var(--sub);padding:2px 7px}
  td:has(.edit-correct)::before{content:"정답";display:block;font-size:10px;color:var(--sub);padding:2px 7px}
  td:has(.edit-memo)::before{content:"메모";display:block;font-size:10px;color:var(--sub);padding:2px 7px}
  .action-cell{position:absolute;right:4px;top:4px;width:32px}
  .section-row{padding:0 38px 0 0}
  .section-row td:first-child{padding:0}
  .section-edit{border-radius:9px;background:#f2f2f4}
  .draft-row{border-style:dashed}
  .question-card{padding:11px}
  .question{font-size:15px}
  .bank-toolbar select{max-width:100%;flex:1}
  .bank-toolbar-row>*{min-width:0}
}

.workspace-line{padding-top:7px;padding-bottom:5px}
.workspace-switch{display:inline-flex;background:#e9e9ed;border-radius:11px;padding:3px;gap:2px}
.workspace-btn{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:12px;color:#666}
.workspace-btn.active{background:#fff;color:#171719;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bank-editor{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bank-edit-table{width:100%;border-collapse:collapse}
.bank-edit-table th{position:sticky;top:0;background:#fff;z-index:2}
.bank-edit-table td{padding:4px;border-bottom:1px solid var(--line)}
.bank-edit-table input,.bank-edit-table textarea{width:100%;border:0;background:transparent;padding:7px;outline:none;border-radius:6px}
.bank-edit-table input:focus,.bank-edit-table textarea:focus{background:#f7f7f9}
.bank-edit-table textarea{min-height:36px;resize:vertical}
.bank-row-actions{white-space:nowrap;text-align:center}
.bank-row-actions button{border:0;background:transparent;color:#999;padding:6px}
.quiz-status{display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:11px;color:var(--sub)}
.round-pill{background:#ededf1;border-radius:999px;padding:4px 8px}
.quiz-inline-edit{margin-top:10px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fafafd;display:grid;gap:6px}
.quiz-inline-edit input,.quiz-inline-edit textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.quiz-inline-edit textarea{min-height:70px;resize:vertical}
.mini-note{font-size:11px;color:var(--sub)}
@media(max-width:640px){
  .workspace-btn{padding:6px 10px}
  .bank-edit-table,.bank-edit-table tbody,.bank-edit-table tr,.bank-edit-table td{display:block;width:100%}
  .bank-edit-table thead{display:none}
  .bank-edit-table tbody{display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--bg)}
  .bank-edit-table tr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 36px 6px 6px;position:relative}
  .bank-edit-table td{border:0;padding:1px}
  .bank-row-actions{position:absolute;right:4px;top:4px;width:32px}
}


.compact-summary{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.summary-btn{border:0;background:transparent;padding:5px 4px;font-size:13px;font-weight:650;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.summary-sep{color:#aaa;font-size:11px}
#memoryHeader.collapsed .subject-navline{display:none}
#memoryHeader .sheet-navline{display:flex}
#bankControlsWrap.collapsed{display:none}
.quiz-running #bankControlsWrap{display:none!important}
.quiz-running #bankEditBtn{display:none}
.header-toggle{border:0;background:var(--card);border-radius:9px;padding:6px 8px;font-size:11px;color:#666;white-space:nowrap}
@media(max-width:640px){.summary-btn{font-size:12px}.header-toggle{padding:5px 7px}}


/* 문제풀이 가독성 */
#quizArea{max-width:860px;margin:0 auto}
.question-card{
  padding:20px 22px 18px;
  border-radius:16px;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.q-top{margin-bottom:12px}
.q-tag{font-size:11px;color:#98989f}
.q-progress{font-size:12px;font-weight:650;color:#707077}
.question{
  font-size:20px;
  line-height:1.68;
  font-weight:700;
  letter-spacing:-.015em;
  margin:4px 0 18px;
  padding:15px 16px;
  background:#f7f7f9;
  border-radius:12px;
  white-space:pre-wrap;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
.answer-mask{
  display:inline-block;
  width:4.6em;
  height:1.05em;
  margin:0 .08em;
  border-radius:4px;
  background:#242428;
  color:transparent;
  vertical-align:-.08em;
  user-select:none;
  overflow:hidden;
}
.choices{gap:9px}
.choice{
  min-height:48px;
  padding:12px 13px;
  border-radius:12px;
  line-height:1.5;
  font-size:15px;
  align-items:flex-start;
}
.choice .num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;height:24px;
  flex:0 0 24px;
  border-radius:7px;
  background:#f0f0f3;
  color:#55555c;
  font-size:12px;
  margin-top:-1px;
}
.choice.correct .num{background:#e4f5eb;color:var(--ok)}
.choice.wrong .num{background:#fde7e5;color:var(--bad)}
.quiz-status{margin:0 0 12px}
.quiz-actions{margin-top:14px}
.quiz-actions button{padding:9px 11px}
.quiz-answer{font-size:16px;padding:12px 13px}
.write-answer{font-size:15px;line-height:1.6;padding:12px 13px}
.answer-panel{font-size:14px;line-height:1.65;padding:12px 13px}
@media(min-width:641px) and (max-width:1100px){
  #quizArea{max-width:900px}
  .question-card{padding:17px 18px}
  .question{font-size:19px;line-height:1.62;padding:13px 14px;margin-bottom:15px}
  .choice{font-size:15px;padding:11px 12px}
}
@media(max-width:640px){
  #quizArea{max-width:none}
  .question-card{padding:13px 12px}
  .question{font-size:17px;line-height:1.62;padding:12px 11px;margin:3px 0 13px}
  .choice{font-size:14px;min-height:45px;padding:10px}
  .q-top{margin-bottom:8px}
}


/* 문제풀이 텍스트 색상 보정 */
.question,.choice,.choice span,.quiz-answer,.write-answer,.answer-panel{
  color:#202024;
}
.revealed-answer{display:none!important;color:#202024}
.choice:visited,.choice:focus,.choice:active{color:#202024}
.choice.correct,.choice.correct span{color:#202024}
.choice.wrong,.choice.wrong span{color:#202024}
.answer-panel{background:#f2f2f4}
.revealed-answer{display:none!important;color:#202024}


/* 리더기처럼 오래 읽기 편한 본문 설정 */
body{font-weight:400;letter-spacing:-.01em}
.question{
  font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:600;
  letter-spacing:-.012em;
}
.choice,.quiz-answer,.write-answer,.answer-panel{
  font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:400;
}
.choice .num{font-weight:600}


/* 문제 편집: 긴 내용 전체 표시 */
.bank-edit-table textarea{
  overflow:hidden;
  resize:none;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.bank-edit-table td{vertical-align:top}
.bank-question{font-weight:500}
.bank-answer{font-weight:500}
@media(max-width:640px){
  .bank-edit-table textarea{font-size:14px;line-height:1.55}
}


/* 암기판 밀도 조정 */
#studyView .list{gap:4px}
#studyView .card{
  padding:6px 8px;
  border-radius:10px;
}
#studyView .meta{
  min-height:15px;
  margin-bottom:2px;
  gap:5px;
}
#studyView .category,#studyView .rate{font-size:10px}
#studyView .star{
  font-size:16px;
  line-height:16px;
  height:18px;
}
#studyView .answer-line{gap:4px}
#studyView .answer{
  padding:6px 8px;
  min-height:32px;
}
#studyView .answer-action{
  padding:6px 7px;
  min-height:32px;
  font-size:10px;
}
#studyView .clear-answer{
  width:30px;
  height:32px;
  min-height:32px;
}
#studyView .memo-inline.active{background:#e8e8ec;color:#333}
#studyView .memo{
  margin-top:4px;
  padding:6px 8px;
  background:#f6f6f8;
  border-radius:7px;
  line-height:1.45;
}
#studyView .revealed-answer{display:none!important;
  margin-top:4px;
  padding:6px 8px;
}
#studyView .section-title{padding:4px 2px 2px}
#studyView .section-study-head{margin-top:2px}
@media(min-width:641px) and (max-width:1100px){
  #studyView .card{padding:5px 7px}
  #studyView .answer{padding:5px 7px;min-height:30px}
  #studyView .answer-action{padding:5px 6px;min-height:30px}
  #studyView .clear-answer{height:30px;min-height:30px}
}
@media(max-width:640px){
  #studyView .answer-line{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto 30px;
    gap:4px;
  }
  #studyView .answer-line:not(:has(.memo-inline)){
    grid-template-columns:minmax(0,1fr) auto 30px;
  }

  font-size:12px;font-weight:850;line-height:1;color:transparent;pointer-events:none

}

function findResumeSlot(slotId){

function saveSnapshotToSlot(snapshot,overwriteId=""){

      app.ui.quizResumeSlots[own.key]=app.ui.quizResumeSlots[own.key].map(x=>x.slotId===snapshot.resumeSlotId?updated:x);
      saveLocal();return true;

   진도/화면상태/암기판은 기존 localStorage 저장 구조를 그대로 사용한다. */
const BANK_CACHE_DB="study-jew-bank-cache-v2";
const BANK_CACHE_STORE="bank";
let bankCacheSaveTimer=null;
function openBankCacheDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(BANK_CACHE_DB,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(BANK_CACHE_STORE))db.createObjectStore(BANK_CACHE_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function readBankCache(){
  try{
    const db=await openBankCacheDb();
    const data=await new Promise((resolve,reject)=>{
      const tx=db.transaction(BANK_CACHE_STORE,"readonly");
      const req=tx.objectStore(BANK_CACHE_STORE).get("state");
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
    db.close();return data;
  }catch(e){console.warn("bank cache read failed",e);return null}
}
async function writeBankCacheNow(){
  clearTimeout(bankCacheSaveTimer);bankCacheSaveTimer=null;
  try{
    const db=await openBankCacheDb();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(BANK_CACHE_STORE,"readwrite");
      tx.objectStore(BANK_CACHE_STORE).put({
        sheets:app.bank.sheets,
        trashSheets:app.bank.trashSheets||[],
        contentUpdatedAt:app.bank.contentUpdatedAt||0
      },"state");
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){console.warn("bank cache write failed",e)}
}
function scheduleBankCacheSave(){
  clearTimeout(bankCacheSaveTimer);
  bankCacheSaveTimer=setTimeout(writeBankCacheNow,250);
}
let bankCacheReadyPromise=null;
async function restoreBankCache(){
  const cached=await readBankCache();
  if(!cached?.sheets?.length)return false;
  const localAt=app.bank.contentUpdatedAt||0;
  const cacheAt=cached.contentUpdatedAt||0;
  if(!app.bank.sheets.length||cacheAt>=localAt){
    app.bank.sheets=cached.sheets;
    if(Array.isArray(cached.trashSheets))app.bank.trashSheets=cached.trashSheets;
    app.bank.contentUpdatedAt=Math.max(localAt,cacheAt);
    return true;
  }
  return false;
}
bankCacheReadyPromise=restoreBankCache().then(async restored=>{
  /* 구버전 localStorage에만 문제은행이 있던 첫 실행에서는 IndexedDB에 먼저 안전 복사한 뒤 slim 저장을 허용한다. */
  if(!restored&&app.bank.sheets?.length)await writeBankCacheNow();
  bankCacheReadyForSlimSave=true;
  if(restored){renderQuiz();renderBankEditor();renderWidePlannerSide()}
  return restored;
}).catch(err=>{
  console.warn("bank cache init failed",err);
  bankCacheReadyForSlimSave=false;
  return false;
});

function canonicalProblemKey(item){
  const q=norm(item?.question||""),a=norm(item?.answer||"");
  return q+"\u0001"+a;
}
function canonicalProblemId(item){
  return item?.canonicalId||("q_"+hashString(canonicalProblemKey(item)));
}
function quizItemId(item){
  return item?.id?("i_"+item.id):canonicalProblemId(item);
}
function mergeDuplicateQuizItems(items){
  const map=new Map(),out=[];
  for(const item of items){
    if(!item?.question)continue;
    const key=canonicalProblemKey(item);
    if(!map.has(key)){
      const first={...item};
      first.canonicalId=canonicalProblemId(item);
      first.origins=[{
        source:item.source||"",
        sheetId:item.sheetId||"",
        sheetName:item.sheetName||"",
        category:item.category||""
      }];
      map.set(key,first);out.push(first);
    }else{
      const first=map.get(key);
      const origin={source:item.source||"",sheetId:item.sheetId||"",sheetName:item.sheetName||"",category:item.category||""};
      if(!first.origins.some(o=>o.source===origin.source&&o.sheetId===origin.sheetId&&o.category===origin.category))first.origins.push(origin);
      // 빈 메모/카테고리는 다른 원본의 값을 보충하되 기존 값을 덮어쓰지 않음.
      if(!first.memo&&item.memo)first.memo=item.memo;
      if(!first.category&&item.category)first.category=item.category;
    }
  }
  return out;
}

function bindSafeEnter(el,handler){
  let composing=false;
  let enterDuringComposition=false;
  let moving=false;

  const moveAfterImeSettles=()=>{
    if(moving)return;
    moving=true;
    if(document.activeElement===el)el.blur();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      setTimeout(()=>{
        try{handler()}finally{moving=false}
      },60);
    }));
  };

  el.addEventListener("compositionstart",()=>{
    composing=true;
    enterDuringComposition=false;
  });
  el.addEventListener("compositionend",()=>{
    composing=false;
  });

  el.addEventListener("keydown",e=>{
    if(e.key!=="Enter"||e.shiftKey)return;
    if(composing||e.isComposing||e.keyCode===229){
      enterDuringComposition=true;
      return;
    }
    e.preventDefault();
    enterDuringComposition=false;
    moveAfterImeSettles();
  });

  el.addEventListener("keyup",e=>{
    if(e.key!=="Enter"||e.shiftKey)return;
    if(enterDuringComposition&&!composing&&!e.isComposing&&e.keyCode!==229){
      e.preventDefault();
      enterDuringComposition=false;
      moveAfterImeSettles();
    }
  });

  el.addEventListener("blur",()=>{
    if(!composing)enterDuringComposition=false;
  });
}

function bindLongPressReorder(button,getButtons,getIndex,onMove){
  let timer=null,dragging=false,sx=0,sy=0;
  const clear=()=>{if(timer){clearTimeout(timer);timer=null}};
  button.draggable=false;
  button.addEventListener("dragstart",e=>e.preventDefault());
  button.addEventListener("contextmenu",e=>e.preventDefault());
  button.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;clear();
    timer=setTimeout(()=>{dragging=true;button.classList.add("reorder-dragging");try{button.setPointerCapture(e.pointerId)}catch{}},450);
  });
  button.addEventListener("pointermove",e=>{
    if(!dragging){if(Math.hypot(e.clientX-sx,e.clientY-sy)>12)clear();return}
    e.preventDefault();
    const bs=getButtons();bs.forEach(b=>b.classList.remove("reorder-target"));
    const target=bs.find(b=>{const r=b.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
    if(target&&target!==button)target.classList.add("reorder-target");
  });
  const finish=()=>{
    clear();if(!dragging)return;dragging=false;button.classList.remove("reorder-dragging");
    const bs=getButtons();let to=-1;bs.forEach((b,i)=>{if(b.classList.contains("reorder-target"))to=i;b.classList.remove("reorder-target")});
    if(to>=0)onMove(getIndex(),to);
    button.dataset.skipClick="1";setTimeout(()=>delete button.dataset.skipClick,60);
  };
  button.addEventListener("pointerup",finish);button.addEventListener("pointercancel",finish);
}

    const upper=viewportTop+58,lower=viewportTop+viewportHeight-14;

}

let typingPracticeTimer=null;
let typingPracticeChallenge=null;
const typingPracticeSessions=new Map();

function typingPracticeMode(){
  return app.ui.typingPracticeMode==="recall"?"recall":"copy";
}
function typingPracticeKey(mode=typingPracticeMode()){
  return `${sub().id}::${sh().id}::${mode}`;
}
function typingNormalize(text){
  return String(text||"")
    .normalize("NFC")
    .toLocaleLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu,"");
}
function typingCharCount(text){
  return Array.from(String(text||"")).length;
}
/* 한컴타자 방식에 맞춰 한글은 음절 수가 아니라 자소(초성·중성·종성) 수로 계산.
   영문/숫자/공백/기호는 입력 문자 1개를 1타로 계산한다. */
function typingStrokeCount(text){
  let total=0;
  for(const ch of Array.from(String(text||"").normalize("NFC"))){
    const code=ch.codePointAt(0);
    if(code>=0xAC00&&code<=0xD7A3){
      const syllable=code-0xAC00;
      const jong=syllable%28;
      total+=jong?3:2;
    }else{
      total+=1;
    }
  }
  return total;
}
function typingSpeed(chars,elapsedMs){
  if(!elapsedMs||elapsedMs<1)return 0;
  return Math.round(chars/(elapsedMs/60000));
}
function formatTypingTime(ms){
  const sec=Math.max(0,Number(ms)||0)/1000;
  if(sec<60)return `${sec.toFixed(1)}초`;
  const m=Math.floor(sec/60),r=sec-m*60;
  return `${m}:${r.toFixed(1).padStart(4,"0")}`;
}
function legacyTypingRecord(){
  if(typingPracticeMode()!=="copy")return null;
  return app.study.typingRecords?.[`${sub().id}::${sh().id}`]||null;
}
function typingRecord(){
  const rec=app.study.typingRecords?.[typingPracticeKey()]||legacyTypingRecord();
  if(!rec||typeof rec!=="object")return {bestMs:0,recent:[]};
  if(!Array.isArray(rec.recent))rec.recent=[];
  return rec;
}
function ensureTypingChallenge(){
  const key=typingPracticeKey();
  if(!typingPracticeChallenge||typingPracticeChallenge.key!==key){
    stopTypingPracticeTicker();
    typingPracticeSessions.clear();
    typingPracticeChallenge={
      key,startedAt:0,endedAt:0,completed:false,newBest:false,hints:0,
      rows:new Map(),remaining:0,typedChars:0,targetChars:0
    };
  }
  return typingPracticeChallenge;
}
function typingSession(rowId){
  let session=typingPracticeSessions.get(rowId);
  if(!session){
    session={value:"",hintVisible:false,hintTimer:null};
    typingPracticeSessions.set(rowId,session);
  }
  return session;
}
function registerTypingRow(rowId,target,input){
  const c=ensureTypingChallenge();
  if(c.rows.has(rowId))return c.rows.get(rowId);
  const rawAnswer=String(target||""),rawTyped=String(input?.value||"");
  const answer=typingNormalize(rawAnswer),typed=typingNormalize(rawTyped);
  const done=!!answer&&typed===answer;
  const rawStrokeCount=typingStrokeCount(rawTyped);
  const state={answer,typed,rawTyped,rawStrokeCount,done};
  c.rows.set(rowId,state);
  c.targetChars+=typingStrokeCount(rawAnswer);
  c.typedChars+=rawStrokeCount;
  if(!done)c.remaining++;
  return state;
}
function setTypingPracticeMode(mode){
  if(!["copy","recall"].includes(mode)||typingPracticeMode()===mode)return;
  app.ui.typingPracticeMode=mode;
  resetTypingPracticeSessions();
  saveLocal();renderStudy();
  setTimeout(()=>focusStudyField(document.querySelector(".typing-practice-input")),20);
}
function buildTypingSummaryBar(box){
  if(box.dataset.ready==="1")return;
  box.dataset.ready="1";
  const modes=document.createElement("div");modes.className="typing-mode-switch";
  [["copy","보고 치기"],["recall","안 보고 치기"]].forEach(([value,label])=>{
    const b=document.createElement("button");b.type="button";b.textContent=label;b.dataset.typingMode=value;
    b.onclick=e=>{e.preventDefault();e.stopPropagation();setTypingPracticeMode(value)};

  });

  retry.onclick=e=>{e.preventDefault();e.stopPropagation();resetTypingPracticeChallenge(true)};

function updateTypingChallengeSummary(){
  updateTypingFloatingBadge();
  const box=document.querySelector(".typing-record-bar");
  if(!box||!app.ui.typingPractice)return;
  buildTypingSummaryBar(box);
  const c=ensureTypingChallenge(),rec=typingRecord(),best=Number(rec.bestMs)||0,mode=typingPracticeMode();
  const strong=box.querySelector(".typing-record-main strong");
  const small=box.querySelector(".typing-record-main span");
  box.querySelectorAll("[data-typing-mode]").forEach(b=>b.classList.toggle("active",b.dataset.typingMode===mode));
  box.classList.toggle("best",!!c.newBest);

  let main="",subtext="";
  if(c.completed&&c.startedAt&&c.endedAt){
    const elapsed=c.endedAt-c.startedAt;
    main=`완료 ${formatTypingTime(elapsed)}`;
    subtext=`${typingSpeed(c.targetChars,elapsed)}타`;
    if(mode==="recall"&&c.hints)subtext+=` · 힌트 ${c.hints}`;
    if(c.newBest)subtext+=" · 최고 기록!";
    else if(best)subtext+=` · 최고 ${formatTypingTime(best)}`;
  }else if(c.startedAt){
    const elapsed=Date.now()-c.startedAt;
    main=formatTypingTime(elapsed);
    subtext=`${typingSpeed(Math.max(0,c.typedChars),elapsed)}타`;
    if(c.remaining)subtext+=` · 남은 ${c.remaining}`;
    if(mode==="recall"&&c.hints)subtext+=` · 힌트 ${c.hints}`;
    if(best)subtext+=` · 최고 ${formatTypingTime(best)}`;
  }else{
    main="첫 글자부터 시작";
    if(best){
      const recent=(rec.recent||[]).slice(0,3).map(x=>formatTypingTime(x.ms)).join(" / ");
      subtext=`최고 ${formatTypingTime(best)}${recent?` · 최근 ${recent}`:""}`;
    }else subtext="기록 없음";
  }
  if(strong.textContent!==main)strong.textContent=main;
  if(small.textContent!==subtext)small.textContent=subtext;
}
let typingPracticeFullTickAt=0;
function updateTypingElapsedClockOnly(){
  // 시간 표시는 0.1초 단위로 부드럽게, 무거운 통계/배지는 훨씬 드물게 갱신한다.
  const c=typingPracticeChallenge;
  if(!c?.startedAt||c.completed||!app.ui.typingPractice)return;
  const strong=document.querySelector(".typing-record-bar .typing-record-main strong");
  if(!strong)return;
  const text=formatTypingTime(Date.now()-c.startedAt);
  if(strong.textContent!==text)strong.textContent=text;
}
function stopTypingPracticeTicker(){
  if(typingPracticeTimer){clearInterval(typingPracticeTimer);typingPracticeTimer=null}
  typingPracticeFullTickAt=0;
}
function startTypingPracticeTicker(){
  if(typingPracticeTimer)return;
  typingPracticeFullTickAt=0;
  // 삼성 인터넷/모바일에서는 '시간 숫자 한 곳'만 0.1초마다 바꾼다.
  // 남은 개수·타수·최고기록·고정 배지 등 상대적으로 무거운 요약은 저빈도로 갱신한다.
  const fullEvery=isPhone()?1200:700;
  updateTypingElapsedClockOnly();
  typingPracticeTimer=setInterval(()=>{
    if(!app.ui.typingPractice){stopTypingPracticeTicker();return}
    if(document.hidden)return;
    const now=Date.now();
    updateTypingElapsedClockOnly();
    if(!typingPracticeFullTickAt||now-typingPracticeFullTickAt>=fullEvery){
      typingPracticeFullTickAt=now;
      updateTypingChallengeSummary();
    }
  },100);
}
function rebuildTypingChallengeFromDom(){
  const c=ensureTypingChallenge();

  document.querySelectorAll(".typing-practice-input").forEach(input=>{
    const rowId=input.closest("[data-typing-row-id]")?.dataset.typingRowId||uid();
    registerTypingRow(rowId,input.dataset.target||"",input);
  });
}
function resetTypingPracticeChallenge(focusFirst=false){
  stopTypingPracticeTicker();
  const c=ensureTypingChallenge();

  /* 기존 입력칸의 이벤트 핸들러가 참조하는 state/session 객체를 그대로 초기화한다.
     새 객체로 갈아끼우면 예전 state와 새 challenge가 섞여 typedChars가 음수가 될 수 있다. */
  typingPracticeSessions.forEach(session=>{
    if(session.hintTimer)clearTimeout(session.hintTimer);
    session.hintTimer=null;
    session.hintVisible=false;
    session.value="";
  });

  c.startedAt=0;c.endedAt=0;c.completed=false;c.newBest=false;c.hints=0;
  c.typedChars=0;c.remaining=0;

  c.rows.forEach(state=>{
    state.typed="";
    state.rawTyped="";
    state.rawStrokeCount=0;
    state.done=false;
    if(state.answer)c.remaining++;
  });

  document.querySelectorAll(".typing-practice-input").forEach(el=>{
    el.value="";el.classList.remove("done","mismatch");
  });
  document.querySelectorAll(".typing-practice-guide").forEach(el=>{
    el.classList.toggle("hidden-guide",typingPracticeMode()==="recall");
  });

  /* 화면이 다시 그려져 rows가 비어 있는 예외 상황만 DOM에서 재구축 */
  if(!c.rows.size&&document.querySelector(".typing-practice-input"))rebuildTypingChallengeFromDom();

  updateTypingChallengeSummary();
  if(focusFirst)setTimeout(()=>focusStudyField(document.querySelector(".typing-practice-input")),20);
}

  stopTypingPracticeTicker();

function storeTypingResult(elapsed,hints=0){
  const key=typingPracticeKey();
  if(!app.study.typingRecords||typeof app.study.typingRecords!=="object")app.study.typingRecords={};
  const old=typingRecord(),best=Number(old.bestMs)||0;
  const recent=[{ms:elapsed,at:Date.now(),hints:Number(hints)||0},...(old.recent||[])].slice(0,5);
  const newBest=!best||elapsed<best;
  app.study.typingRecords[key]={bestMs:newBest?elapsed:best,recent,updatedAt:Date.now()};
  return newBest;
}
function finishTypingChallenge(){
  const c=ensureTypingChallenge();
  if(!c.startedAt||c.completed||c.remaining>0)return;
  c.completed=true;c.endedAt=Date.now();
  stopTypingPracticeTicker();
  const elapsed=c.endedAt-c.startedAt;
  c.newBest=storeTypingResult(elapsed,c.hints);
  plannerLog("typing",1);
  markStudyCloud();
  updateTypingChallengeSummary();
  const speed=typingSpeed(c.targetChars,elapsed);
  const hintText=typingPracticeMode()==="recall"&&c.hints?` · 힌트 ${c.hints}`:"";
  toast(c.newBest?`최고 기록 ${formatTypingTime(elapsed)} · ${speed}타${hintText}`:`완료 ${formatTypingTime(elapsed)} · ${speed}타${hintText}`);
}

function bindTypingPracticeEnter(el,handler){
  let composing=false,pending=false,moving=false,inputSerial=0,enterSerial=0,fallback=0;
  const clearFallback=()=>{if(fallback){clearTimeout(fallback);fallback=0}};
  const move=()=>{
    clearFallback();
    if(moving)return;
    moving=true;pending=false;
    // 핵심: blur로 이전 한글 조합의 귀속을 현재 칸에 확정하되,
    // 다음 칸 focus는 같은 작업 안에서 바로 실행해 iOS 키보드가 내려갔다 올라오는 시간을 없앤다.
    if(document.activeElement===el&&!isSamsungInternet()){try{el.blur()}catch{}}
    try{handler()}finally{requestAnimationFrame(()=>{moving=false})}
  };
  const afterCommittedInput=()=>{
    if(!pending||composing)return;
    if(inputSerial>enterSerial){
      // 최종 input 이벤트가 현재 칸에 들어온 것을 확인했으므로 바로 이동한다.
      if(typeof queueMicrotask==="function")queueMicrotask(move);else Promise.resolve().then(move);
      return;
    }
    clearFallback();
    // 일부 Safari는 compositionend 뒤 별도 input을 보내지 않는다. 한 프레임만 기다린다.
    fallback=setTimeout(move,18);
  };
  el.addEventListener("compositionstart",()=>{composing=true;pending=false;clearFallback()});
  el.addEventListener("input",()=>{inputSerial++;afterCommittedInput()});
  el.addEventListener("compositionend",()=>{composing=false;afterCommittedInput()});
  el.addEventListener("keydown",e=>{
    if(e.key!=="Enter"||e.shiftKey||e.repeat)return;
    if(composing||e.isComposing||e.keyCode===229){
      // Enter가 조합 확정 키인 경우 기본 동작은 허용하고, 확정 input을 현재 칸에서 받은 뒤 이동한다.
      pending=true;enterSerial=inputSerial;clearFallback();return;
    }
    e.preventDefault();pending=false;move();
  });
  el.addEventListener("keyup",e=>{
    if(e.key!=="Enter"||e.shiftKey)return;
    if(pending&&!composing&&!e.isComposing&&e.keyCode!==229){e.preventDefault();afterCommittedInput()}
  });
  el.addEventListener("blur",()=>{if(!moving&&!composing){pending=false;clearFallback()}});
}

function makeTypingPracticeField(row,target){
  const wrap=document.createElement("div");wrap.className="typing-practice-field";wrap.dataset.typingRowId=row.id;
  const guide=document.createElement("div");guide.className="typing-practice-guide";guide.textContent=target;
  if(typingPracticeMode()==="recall")guide.classList.add("hidden-guide");

  const line=document.createElement("div");line.className="typing-input-line";
  const input=document.createElement("input");input.type="text";input.className="study-answer typing-practice-input";
  input.dataset.target=target;
  input.autocomplete="off";input.spellcheck=false;input.autocorrect="off";input.autocapitalize="off";
  input.enterKeyHint="next";

  const session=typingSession(row.id);
  input.value=session.value||"";
  const state=registerTypingRow(row.id,target,input);

  const applyState=(typed,rawValue=input.value)=>{
    const c=ensureTypingChallenge();
    const wasDone=state.done;
    const done=!!state.answer&&typed===state.answer;
    if(state.rawTyped!==rawValue){
      const nextStrokeCount=typingStrokeCount(rawValue);
      c.typedChars+=nextStrokeCount-(Number(state.rawStrokeCount)||0);
      if(c.typedChars<0)c.typedChars=0;
      state.rawTyped=rawValue;state.rawStrokeCount=nextStrokeCount;
    }
    state.typed=typed;
    if(done!==wasDone){
      state.done=done;
      c.remaining+=done?-1:1;
    }
    const prefixOk=!typed||state.answer.startsWith(typed);
    input.classList.toggle("done",done);
    input.classList.toggle("mismatch",!!typed&&!done&&!prefixOk);
    return done;
  };
  const changed=()=>{
    const c=ensureTypingChallenge();
    const typed=typingNormalize(input.value); // 현재 칸 하나만 비교
    if(!c.startedAt&&typed){
      c.startedAt=Date.now();c.endedAt=0;c.completed=false;c.newBest=false;
      startTypingPracticeTicker();
    }
    session.value=input.value;
    const done=applyState(typed,input.value);
    if(done&&c.remaining===0)finishTypingChallenge();
  };

  // 타건 중에는 현재 입력칸만 검사. 전체 DOM/전체 문항 순회 없음.
  input.addEventListener("input",changed);
  // 한글 IME 마지막 조합 보정은 compositionend/blur에서 현재 칸만 한 번 더 검사.
  input.addEventListener("compositionend",changed);
  input.addEventListener("blur",changed);
  input.addEventListener("keydown",e=>{
    if(e.key!=="Tab"||typingPracticeMode()!=="recall"||e.isComposing||e.keyCode===229)return;
    e.preventDefault();e.stopPropagation();
    if(e.repeat)return;
    showTypingHint(row.id,guide);
  });
  bindTypingPracticeEnter(input,()=>{
    const done=applyState(typingNormalize(input.value),input.value);
    if(done){
      if(ensureTypingChallenge().remaining===0)finishTypingChallenge();
      focusNextStudyField(input);
    }
  });
  bindStudyArrowNavigation(input);

  line.append(input);
  if(typingPracticeMode()==="recall"){
    const hint=document.createElement("button");hint.type="button";hint.className="typing-hint-btn";hint.textContent="?";
    hint.title="정답 잠깐 보기";hint.setAttribute("aria-label","정답 잠깐 보기");
    keepStudyInputFocusOnTap(hint);
    hint.onclick=e=>{e.preventDefault();e.stopPropagation();showTypingHint(row.id,guide)};
    line.append(hint);
  }
  applyState(typingNormalize(input.value),input.value);
  wrap.append(guide,line);
  return {wrap,input};
}

function moveMajorSectionBlock(index,delta){
  const rows=sh().rows,bounds=majorSectionBounds(rows,index);if(!bounds)return;
  const [a,z]=bounds,block=rows.slice(a,z);

    if(prev<0)return;
    rows.splice(a,z-a);
    rows.splice(prev,0,...block);
  }else{
    let next=-1,nextEnd=rows.length;
    for(let i=z;i<rows.length;i++){if(rows[i]?.type==="section"&&rows[i]?.level==="major"){next=i;break}}

/* Study Excel auto import */
function cellValue(ws,addr){const c=ws[addr];return !c||c.v==null?"":cleanText(c.w!=null?c.w:c.v)}
function colHidden(ws,c){return !!(ws["!cols"]&&ws["!cols"][c]&&ws["!cols"][c].hidden)}
function refsFromFormula(formula,row1){const out=[],re=/(?:'[^']+'!|[A-Za-z0-9_가-힣]+!)?\$?([A-Z]{1,3})\$?(\d+)/g;let m;while((m=re.exec(formula||""))){if(Number(m[2])!==row1)continue;const c=XLSX.utils.decode_col(m[1]);out.push({col:c,addr:XLSX.utils.encode_cell({r:row1-1,c})})}return out}
function detectFormulaRow(ws,r,range){
  let best=null;
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r,c}),cell=ws[addr];if(!cell||!cell.f)continue;
    const refs=refsFromFormula(cell.f,r+1).filter(x=>x.addr!==addr);if(refs.length<2)continue;
    const counts=new Map();refs.forEach(x=>counts.set(x.addr,(counts.get(x.addr)||0)+1));
    const uniq=[...counts.keys()].map(a=>{const p=XLSX.utils.decode_cell(a),v=cellValue(ws,a);let score=counts.get(a)||0;if(v)score+=5;if(colHidden(ws,p.c))score+=8;if(p.c>c)score+=2;return {addr:a,col:p.c,val:v,score,count:counts.get(a)||0}}).sort((a,b)=>b.score-a.score);
    const answer=uniq[0];if(!answer||!answer.val)continue;const input=uniq.slice(1).sort((a,b)=>b.count-a.count)[0];
    let memo="";if(input){const a=XLSX.utils.encode_cell({r,c:input.col+1}),x=ws[a];if(x&&!x.f&&input.col+1!==answer.col)memo=cellValue(ws,a)}
    if(norm(memo)===norm(answer.val))memo="";const cand={answer:answer.val,memo,_score:answer.score};if(!best||cand._score>best._score)best=cand;
  }return best;
}
function headingAt(ws,r,range){const vals=[];for(const c of [0,1,11,13]){if(c<range.s.c||c>range.e.c)continue;const a=XLSX.utils.encode_cell({r,c}),x=ws[a];if(x&&!x.f){const v=cellValue(ws,a);if(v)vals.push(v)}}return vals.find(v=>!/^hint$/i.test(v)&&v!=="정답"&&v!=="오답")||""}
function convertSimpleStudyWorksheet(ws,name){
  if(!ws["!ref"])return null;
  const range=XLSX.utils.decode_range(ws["!ref"]),rows=[];
  const a1=cellValue(ws,"A1"),b1=cellValue(ws,"B1"),c1=cellValue(ws,"C1");
  const hasHeader=/대주제|카테고리|분류|주제/.test(a1)&&/정답|내용|암기/.test(b1);
  const start=Math.max(range.s.r,hasHeader?1:0);

  for(let r=start;r<=range.e.r;r++){
    const a=cellValue(ws,XLSX.utils.encode_cell({r,c:0}));
    const b=cellValue(ws,XLSX.utils.encode_cell({r,c:1}));
    const c=cellValue(ws,XLSX.utils.encode_cell({r,c:2}));
    if(!a&&!b&&!c)continue;

    // 새 간단 형식:
    // A만 있음 = 대주제 / B가 있음 = 암기 항목(A는 카테고리, B는 정답, C는 메모)
    if(a&&!b&&!c){
      rows.push({...sectionRow(),title:a,level:"major"});
      continue;
    }
    if(b){
      rows.push({...studyRow(),category:a||"",correct:b,memo:c||""});
    }
  }
  return rows.some(r=>r.type==="item")?{id:uid(),name,rows}:null;
}
function convertLegacyStudyWorksheet(ws,name){
  if(!ws["!ref"])return null;const range=XLSX.utils.decode_range(ws["!ref"]),det=new Map();
  for(let r=range.s.r;r<=range.e.r;r++){const d=detectFormulaRow(ws,r,range);if(d)det.set(r,d)}
  const rr=[...det.keys()].sort((a,b)=>a-b);if(!rr.length)return null;
  const rows=[];let prev=null,lastSec="";
  rr.forEach(r=>{if(prev==null||r>prev+1){const start=prev==null?Math.max(range.s.r,r-2):prev+1;let h="";for(let x=r-1;x>=start;x--){if(det.has(x))continue;const z=headingAt(ws,x,range);if(z){h=z;break}}if(h&&h!==lastSec){rows.push({...sectionRow(),title:h});lastSec=h}}
    const d=det.get(r);rows.push({...studyRow(),correct:d.answer,memo:d.memo||""});prev=r});
  return {id:uid(),name,rows};
}
function convertStudyWorksheet(ws,name){
  // 예전 수식형 자료가 감지되면 기존 방식 우선. 아니면 앞으로 쓸 간단 3열 형식을 읽는다.
  return convertLegacyStudyWorksheet(ws,name)||convertSimpleStudyWorksheet(ws,name);
}
async function workbookToStudySheets(file){
  const wb=XLSX.read(await file.arrayBuffer(),{cellFormula:true,cellStyles:true}),sheets=[];
  wb.SheetNames.forEach(name=>{
    const x=convertStudyWorksheet(wb.Sheets[name],name);
    if(x&&x.rows.some(r=>r.type==="item"))sheets.push(x);
  });
  if(!sheets.length)throw new Error("정답 위치를 찾지 못함");
  return sheets;
}
async function importStudySheetsToCurrentSubject(files){
  if(typeof XLSX==="undefined")return alert("엑셀 읽기 기능을 불러오지 못했습니다.");

        subject.sheets.push(sheet);made.push(sheet);

  }

}
async function workbookToStudySubject(file){
  const sheets=await workbookToStudySheets(file);
  let name=file.name.replace(/\.(xlsx|xlsm|xlsb|xls)$/i,"");const base=name;let n=2;while(app.study.subjects.some(s=>s.name===name))name=`${base} ${n++}`;
  return {id:uid(),name,currentId:sheets[0].id,sheets};

/* Problem bank importer: A category / B question / C answer / D memo / E,F check flags / G tag */
function bankSheetId(source,name){return "b_"+hashString(source+"\u0000"+name)}
function makeBankItem(sheetId,rowNo,data){return {id:uid(),row:rowNo,...data}}
function isDerivedBankSheet(name){
  return name==="Sheet1"||name==="복습_문제은행";
}
function isLegacyWrongSheet(name){return name==="오답목록"||name==="복습_오답목록"}
function parseBankWorksheet(ws,source,name){
  if(!ws["!ref"])return null;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const hA=cellValue(ws,"A1"),hB=cellValue(ws,"B1"),hC=cellValue(ws,"C1");
  const looksLikeBank=/카테고리|분류/.test(hA)&&/문제|단어/.test(hB)&&/정답/.test(hC);
  if(!looksLikeBank)return null;
  const sid=uid(),items=[];let inheritedCategory="",section="";
  for(let r=1;r<=range.e.r;r++){
    const a=cellValue(ws,XLSX.utils.encode_cell({r,c:0}));
    const q=cellValue(ws,XLSX.utils.encode_cell({r,c:1}));
    const ans=cellValue(ws,XLSX.utils.encode_cell({r,c:2}));
    const memo=cellValue(ws,XLSX.utils.encode_cell({r,c:3}));
    const e=ws[XLSX.utils.encode_cell({r,c:4})]?.v;
    const f=ws[XLSX.utils.encode_cell({r,c:5})]?.v;
    const g=cellValue(ws,XLSX.utils.encode_cell({r,c:6}));
    if(!a&&!q&&!ans&&!memo)continue;
    if(a)inheritedCategory=a;
    if(!q)continue;

    // 확실한 구분행만 제외한다. 애매한 행은 절대 버리지 않는다.
    const qn=norm(q), an=norm(ans);
    const singleLetter=/^[A-Za-z]$/.test(q.trim()) &&
      ((!a)||norm(a)===qn) &&
      ((!ans)||an===qn);
    const sameStructural=!!ans && qn===an && !a && !memo && q.trim().length<=24;
    if(singleLetter||sameStructural){section=q;continue}

    // 영어_단어장처럼 A열이 "001 accuracy 11" 형태의 원본 색인인 경우,
    // 문제와 같은 단어가 두 번 보이지 않도록 화면용 카테고리에서는 제거한다.
    // 원본 A열은 sourceLabel에 보존한다.
    let category=a||inheritedCategory||"";
    let sourceLabel="";
    const numbered=category.match(/^\s*\d{1,4}\s+(.+?)\s+\d{1,4}\s*$/);
    if(numbered && norm(numbered[1])===qn){
      sourceLabel=category;
      category="";
    }

    const made=makeBankItem(sid,r+1,{
      category,section,question:q,answer:ans,memo,
      excelCheck:!!e,excelCheck2:!!f,tag:g||"",sourceLabel,
      legacyWrong:isLegacyWrongSheet(name)
    });
    made.canonicalId=canonicalProblemId(made);
    items.push(made);
  }
  if(!items.length)return null;
  const seen=new Set(),deduped=[];
  for(const item of items){
    const key=[norm(item.category),norm(item.question),norm(item.answer),norm(item.memo),norm(item.section)].join("\u0001");
    if(seen.has(key))continue;
    seen.add(key);deduped.push(item);
  }
  return {id:sid,source,name,legacyWrong:isLegacyWrongSheet(name),archived:false,items:deduped,updatedAt:Date.now()};
}
function uniqueBankSheetName(base){
  const used=new Set(app.bank.sheets.map(x=>x.name));
  if(!used.has(base))return base;
  let n=2,name=`${base} (${n})`;
  while(used.has(name)){n++;name=`${base} (${n})`}
  return name;
}
function normalizeBankSheetRows(sheet){
  (sheet.items||[]).forEach((item,i)=>{if(!item.id)item.id=uid();item.row=i+1});
}
function touchBankSheets(sheets){
  const list=[...new Set((sheets||[]).filter(Boolean))];
  if(!list.length)return;
  const now=Date.now();
  list.forEach(sh=>{sh.updatedAt=now;normalizeBankSheetRows(sh)});
  app.bank.contentUpdatedAt=now;
  saveLocal();scheduleBankCacheSave();
  list.forEach(sh=>reconcileAdventureRoutesForSheet(sh.id,{persist:false}));
  flushAdventureStructureCloud();
  if(cloudUser){
    updateSync("…",true);
    syncImportedBankSheets(list).then(()=>updateSync("✓",true)).catch(e=>{console.error(e);updateSync("!",false)});
  }
}
function moveBankItems(source,target,ids){
  const set=new Set(ids);
  const moving=source.items.filter(x=>set.has(x.id));
  if(!moving.length)return 0;
  source.items=source.items.filter(x=>!set.has(x.id));
  target.items.push(...moving); // 문제 id 그대로 유지 → 오답/진도 정체성 유지
  touchBankSheets([source,target]);
  return moving.length;
}
function makeEmptyBankSheet(name,source="앱에서 생성"){
  return {id:uid(),source,name,legacyWrong:false,archived:false,items:[],updatedAt:Date.now()};
}
let bankImportBusy=false;
async function importBankFiles(files){
  if(bankImportBusy)return toast("가져오는 중입니다");
  if(typeof XLSX==="undefined")return alert("엑셀 읽기 기능을 불러오지 못했습니다.");
  bankImportBusy=true;
  const failed=[],newSheets=[];
  try{
    toast("문제은행 읽는 중…");
    for(const file of files){
      try{
        await new Promise(r=>setTimeout(r,0));
        const source=file.name.replace(/\.(xlsx|xlsm|xlsb|xls)$/i,"");
        const wb=XLSX.read(await file.arrayBuffer(),{cellFormula:true,cellStyles:true});
        for(const name of wb.SheetNames){
          if(isDerivedBankSheet(name))continue;
          const parsed=parseBankWorksheet(wb.Sheets[name],source,name);
          if(parsed){
            parsed.name=uniqueBankSheetName(parsed.name);
            newSheets.push(parsed);
          }
        }
      }catch(e){
        console.error("bank import failed:",file.name,e);
        failed.push(file.name);
      }
    }

    if(newSheets.length){
      // 업로드는 무조건 "추가". 기존 시트를 몰래 교체하거나 전체 통합 계산하지 않는다.
      app.bank.sheets.push(...newSheets);
      cleanExistingBankData();
      app.ui.bankEditSheetId=newSheets[0].id;
      if(!app.ui.quiz.sheetId)app.ui.quiz.sheetId="all";
      app.bank.contentUpdatedAt=Date.now();
      saveLocal();scheduleBankCacheSave();

      const total=newSheets.reduce((n,x)=>n+x.items.length,0);
      renderQuiz();renderBankEditor();
      toast(`${newSheets.length}개 시트 · ${total}문제 추가됨`);

      if(cloudUser){
        updateSync("…",true);
        syncImportedBankSheets(newSheets).then(()=>{
          updateSync("✓",true);
          toast("저장 완료");
        }).catch(e=>{
          console.error(e);updateSync("!",false);
          toast("기기에는 저장됨 · 클라우드 동기화 실패");
        });
      }
    }else if(!failed.length){
      alert("가져올 수 있는 문제 시트를 찾지 못했습니다.\nA열=카테고리/분류, B열=문제/단어, C열=정답 형식인지 확인해 주세요.");
    }
    if(failed.length)alert(`가져오지 못한 파일:\n${failed.join("\n")}`);
  }finally{
    bankImportBusy=false;
  }
}
function bankQuestions(includeLegacy=false){
  return app.bank.sheets.filter(s=>includeLegacy||!s.legacyWrong).flatMap(s=>s.items.map(i=>({...i,sheetId:s.id,sheetName:s.name,source:s.source})));
}
function cleanExistingBankData(){
  if(!app.bank?.sheets)return;
  let changed=false;
  app.bank.sheets.forEach(sheet=>{
    const cleaned=[];
    let section="";
    (sheet.items||[]).forEach(item=>{
      item.question=cleanText(item.question);
      item.answer=cleanText(item.answer);
      item.memo=cleanText(item.memo);
      item.category=cleanText(item.category);
      item.section=cleanText(item.section);

      const q=(item.question||"").trim(), a=(item.answer||"").trim();
      const qn=norm(q), an=norm(a);
      const cid="q_"+hashString(qn+"\u0001"+an);
      if(item.canonicalId!==cid){item.canonicalId=cid;changed=true}

      // 기존에 가져온 영어 단어장 색인(A열)의 반복 표시만 정리.
      const numbered=(item.category||"").match(/^\s*\d{1,4}\s+(.+?)\s+\d{1,4}\s*$/);
      if(numbered && norm(numbered[1])===qn){
        item.sourceLabel=item.sourceLabel||item.category;
        item.category="";
        changed=true;
      }

      // A/B/C가 한 글자 알파벳인 명백한 구분행만 문제에서 제외.
      const single=/^[A-Za-z]$/.test(q) &&
        ((!item.category)||norm(item.category)===qn) &&
        ((!a)||an===qn);
      if(single){section=q;changed=true;return}

      // 문제=정답인 무분류 짧은 구분행(예: 기본이론)만 소제목으로 전환.
      const structural=q&&a&&qn===an&&!item.category&&!item.memo&&q.length<=24;
      if(structural){section=q;changed=true;return}

      if(!item.section&&section){item.section=section;changed=true}

      // 같은 문제/정답/메모가 반복되어도 사용자가 의도한 복습 행으로 보고 그대로 유지.
      cleaned.push(item);
    });
    if(cleaned.length!==sheet.items.length){sheet.items=cleaned;sheet.updatedAt=Date.now()}
  });
  if(changed){app.bank.contentUpdatedAt=Date.now();saveLocal()}
}
function getStat(itemOrId){
  const id=typeof itemOrId==="string"?itemOrId:(itemOrId?.id||canonicalProblemId(itemOrId));
  if(!app.bank.stats[id])app.bank.stats[id]={attempts:0,wrong:0,correct:0,needsReview:false,lastWrongAt:0,flagged:false,flagCount:0};
  if(app.bank.stats[id].flagged==null)app.bank.stats[id].flagged=false;
  if(app.bank.stats[id].flagCount==null)app.bank.stats[id].flagCount=0;
  if(app.bank.stats[id].flagReason==null)app.bank.stats[id].flagReason="";
  return app.bank.stats[id];
}
let roundWrongSaveTimer=0;
function activeRoundForWrongItem(item){
  const sessionRound=quizSession?.plannerRoundId?plannerRoundById(quizSession.plannerRoundId):null;
  const round=sessionRound||activeProgressRound();if(!round||!item?.sheetId)return null;
  if(round.scope?.bankSheetIds?.length&&!round.scope.bankSheetIds.includes(item.sheetId))return null;
  const today=plannerToday(),last=round.reviewDate||plannerAddDays(round.end,1);
  if(today<round.start||today>last)return null;
  return round;
}
function rememberRoundWrong(item){
  const round=activeRoundForWrongItem(item);if(!round)return;
  const id=quizItemId(item);if(!Array.isArray(round.wrongIds))round.wrongIds=[];
  if(round.wrongIds.includes(id))return;
  round.wrongIds.push(id);round.wrongReviewDone=false;plannerSaveLocal();
  clearTimeout(roundWrongSaveTimer);roundWrongSaveTimer=setTimeout(()=>plannerSaveRound(round),700);
}
function recordQuiz(item,ok){
  if(quizSession){
    if(ok)quizSession.correctCount=(quizSession.correctCount||0)+1;else quizSession.wrongCount=(quizSession.wrongCount||0)+1;
    if(!Array.isArray(quizSession.recentAnswered))quizSession.recentAnswered=[];
    quizSession.recentAnswered.push({id:quizItemId(item),question:item.question||"",answer:item.answer||"",memo:item.memo||"",sheetName:item.sheetName||"",category:item.category||item.section||"",ok:!!ok});
    if(quizSession.recentAnswered.length>10)quizSession.recentAnswered.splice(0,quizSession.recentAnswered.length-10);
    if(!ok){if(!Array.isArray(quizSession.wrongItemIds))quizSession.wrongItemIds=[];const qid=quizItemId(item);if(!quizSession.wrongItemIds.includes(qid))quizSession.wrongItemIds.push(qid)}
  }
  if(!ok)rememberRoundWrong(item);
  plannerLog("bank",1);

  const st=getStat(item);st.attempts++;
  if(ok){st.correct++;}else{st.wrong++;st.needsReview=true;st.lastWrongAt=Date.now();if(quizSession?.mastery)quizSession.nextRound.push(item)}
  markBankStatsCloud();
}
function clearWrong(item){const st=getStat(item);st.needsReview=false;markBankStatsCloud();renderQuiz()}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function bankSheetMeta(sheet){
  const name=(sheet?.name||"").trim();
  const ix=name.indexOf("_");
  return ix>0?{subject:name.slice(0,ix).trim(),area:name.slice(ix+1).trim()}:{subject:"기타",area:name||"기타"};
}
function bankSubjects(){
  return [...new Set(activeBankSheets().map(s=>bankSheetMeta(s).subject))];
}
function bankAreas(subject){
  return [...new Set(activeBankSheets().filter(s=>bankSheetMeta(s).subject===subject).map(s=>bankSheetMeta(s).area))];
}
function selectedBankSheets(){
  const q=app.ui.quiz;
  let sheets=activeBankSheets();
  if(q.subject&&q.subject!=="all"){
    sheets=sheets.filter(s=>bankSheetMeta(s).subject===q.subject);
    const areas=bankAreas(q.subject);
    const picked=q.areaSelectionV2?(Array.isArray(q.areas)?q.areas:[]):areas;
    sheets=sheets.filter(s=>picked.includes(bankSheetMeta(s).area));
  }
  return sheets;
}
function quizRangeLabel(){
  const q=app.ui.quiz;
  if(q.subject==="all"||!q.subject)return "전체 과목";
  const all=bankAreas(q.subject),picked=q.areaSelectionV2?(q.areas||[]):all;
  if(picked.length===all.length)return `${q.subject} 전체`;if(!picked.length)return `${q.subject} · 선택 없음`;
  return picked.length===1?`${q.subject} · ${picked[0]}`:`${q.subject} · ${picked[0]} 외 ${picked.length-1}`;
}
function rememberQuizRange(){
  const q=app.ui.quiz,label=quizRangeLabel();
  const key=JSON.stringify([q.subject,[...(q.areas||[])].sort()]);
  q.recentRanges=(q.recentRanges||[]).filter(x=>x.key!==key);
  q.recentRanges.unshift({key,label,subject:q.subject,areas:[...(q.areas||[])]});
  q.recentRanges=q.recentRanges.slice(0,3);
}
function quizItemsFromSheets(sheets,{filter=app.ui.quiz.filter,mode=app.ui.quiz.mode}={}){
  let items=sheets.flatMap(sheet=>{
    const meta=bankSheetMeta(sheet);
    return (sheet.items||[]).map(i=>({...i,sheetId:sheet.id,sheetName:sheet.name,source:sheet.source,subject:meta.subject,area:meta.area}));
  });
  if(filter==="unchecked")items=items.filter(i=>!i.excelCheck);
  if(filter==="checked")items=items.filter(i=>i.excelCheck);
  if(filter==="answered")items=items.filter(i=>i.answer);
  if(filter==="wrong")items=items.filter(i=>getStat(i).needsReview);
  if(filter==="starred")items=items.filter(i=>getStat(i).flagged);
  if(mode!=="write")items=items.filter(i=>i.answer);
  // 엑셀의 각 행은 독립된 문제다. 같은 문제/정답을 일부러 여러 번 넣어도 그대로 출제한다.
  return items;
}
function effectiveQuickOrder(){return app.ui.quiz.order==="random"||app.ui.quiz.groupOrder==="mixed"?"random":"sequence"}
function quizPool(){
  const q=app.ui.quiz;
  let items=quizItemsFromSheets(selectedBankSheets(),{filter:q.filter,mode:q.mode});
  if(effectiveQuickOrder()==="random")return shuffled(items);
  return items;
}
let quizCountCache=new Map();
function quizCountFor(subject="all",areas=[]){
  const stamp=[app.bank.contentUpdatedAt||0,app.bank.statsUpdatedAt||0,app.ui.quiz.filter,app.ui.quiz.mode,subject,[...areas].sort().join("|")].join("::");
  if(quizCountCache.has(stamp))return quizCountCache.get(stamp);
  let sheets=activeBankSheets();
  if(subject&&subject!=="all"){
    const picked=new Set(areas||[]);
    sheets=sheets.filter(s=>bankSheetMeta(s).subject===subject&&(picked.size===0||picked.has(bankSheetMeta(s).area)));
  }
  const n=quizItemsFromSheets(sheets,{filter:app.ui.quiz.filter,mode:app.ui.quiz.mode}).length;
  quizCountCache.set(stamp,n);
  if(quizCountCache.size>120)quizCountCache=new Map([...quizCountCache].slice(-60));
  return n;
}
function activeQuizMode(){return quizSession?.quizMode||app.ui.quiz.mode}
function activeQuizOrder(){return quizSession?.quizOrder||app.ui.quiz.order}

function adventureStore(){
  if(!app.ui.quizAdventure||typeof app.ui.quizAdventure!=="object")app.ui.quizAdventure={activeSheetId:"",configs:{}};
  if(!app.ui.quizAdventure.configs||typeof app.ui.quizAdventure.configs!=="object")app.ui.quizAdventure.configs={};
  return app.ui.quizAdventure;
}
/* 진도길 구조 보정: 기존 ID/완료 기록은 유지하고 새 문제만 안전하게 뒤에 붙인다. */
let adventureStructureDirty=false;
let bankStatsHydrated=false;
function markAdventureStructureDirty(){
  adventureStructureDirty=true;
  saveLocal();
  if(bankStatsHydrated&&cloudUser&&!applyingRemote)flushAdventureStructureCloud();
}
function flushAdventureStructureCloud(){
  if(!adventureStructureDirty||!bankStatsHydrated||!cloudUser||applyingRemote)return false;
  adventureStructureDirty=false;
  app.bank.statsUpdatedAt=Date.now();
  saveLocal();
  scheduleBankStatsCloud();
  return true;
}
function adventureOrdersToReconcile(sheetId){
  const raw=adventureStore().configs?.[sheetId];
  if(!raw||typeof raw!=="object")return [];
  if(raw.paths&&typeof raw.paths==="object"){
    return ["sequence","random"].filter(order=>Array.isArray(raw.paths?.[order]?.orderIds)&&raw.paths[order].orderIds.length);
  }
  if(Array.isArray(raw.orderIds)&&raw.orderIds.length)return [raw.order==="random"?"random":"sequence"];
  return [];
}
function reconcileAdventureRoutesForSheet(sheetId,{persist=true}={}){
  if(!adventureSheet(sheetId))return false;
  const orders=adventureOrdersToReconcile(sheetId);if(!orders.length)return false;
  const before=adventureStructureDirty;
  orders.forEach(order=>adventureConfig(sheetId,{quiet:true,order}));
  if(persist)flushAdventureStructureCloud();
  return adventureStructureDirty!==before;
}
function reconcileExistingAdventureRoutes({persist=true}={}){
  Object.keys(adventureStore().configs||{}).forEach(id=>reconcileAdventureRoutesForSheet(id,{persist:false}));
  if(persist)flushAdventureStructureCloud();
}
function adventureSheet(sheetId){return app.bank.sheets.find(s=>s.id===sheetId&&!s.legacyWrong)}
function adventureBaseItems(sheet,mode="choice"){
  if(!sheet)return [];
  return quizItemsFromSheets([sheet],{filter:"all",mode});
}
function adventureItemId(item){
  return quizItemId(item);
}
function adventureSignature(sheet,mode,items,order="sequence"){
  // 진도 경로는 문제 문구/정답이 아니라 물리 문제 id를 기준으로 함.
  // 따라서 오탈자·문구·정답 수정만으로 완료 기록이 초기화되지 않음.
  const ids=items.map(adventureItemId);
  if(order==="random")ids.sort();
  return hashString([sheet?.id||"",mode,ids.join("|")].join("::"));
}
function migrateAdventureOrderIds(cfg,base){
  const fresh=base.map(adventureItemId);
  if(!Array.isArray(cfg.orderIds)||!cfg.orderIds.length)return null;
  const freshSet=new Set(fresh);
  if(cfg.orderIds.length===fresh.length&&cfg.orderIds.every(id=>freshSet.has(id)))return [...cfg.orderIds];

  // 예전 버전은 문제+정답 해시(canonical id)를 저장했음.
  // 현재 문제와 일치하는 것은 안정 id로 바꾸고, 문구가 수정된 항목은 남은 자리끼리 대응해 진도를 보존함.
  const canonicalToFresh=new Map();
  for(const item of base){
    const cid=canonicalProblemId(item),fid=adventureItemId(item);
    if(!canonicalToFresh.has(cid))canonicalToFresh.set(cid,[]);
    canonicalToFresh.get(cid).push(fid);
  }
  const used=new Set(),mapped=new Array(cfg.orderIds.length).fill(null);
  cfg.orderIds.forEach((oldId,i)=>{
    if(freshSet.has(oldId)&&!used.has(oldId)){mapped[i]=oldId;used.add(oldId);return}
    const candidates=(canonicalToFresh.get(oldId)||[]).filter(id=>!used.has(id));
    if(candidates.length===1){mapped[i]=candidates[0];used.add(candidates[0])}
  });
  const missing=fresh.filter(id=>!used.has(id));
  const holes=mapped.map((v,i)=>v?null:i).filter(i=>i!==null);
  if(mapped.length===fresh.length&&holes.length===missing.length){
    holes.forEach((idx,j)=>mapped[idx]=missing[j]);
    if(new Set(mapped).size===fresh.length)return mapped;
  }
  return null;
}
function newAdventurePath(order="sequence",size=20,mode="choice"){
  return {size,order,mode,signature:"",orderIds:[],completed:{},reviews:{},activeSessions:{},lastTouchedAt:0};
}
function adventureSheetState(sheetId){
  const store=adventureStore();let state=store.configs[sheetId];
  if(!state||typeof state!=="object"){
    state={activeOrder:"sequence",lastOrder:"sequence",paths:{sequence:newAdventurePath("sequence"),random:newAdventurePath("random")},settingsOpen:false};
    store.configs[sheetId]=state;return state;
  }
  // 기존 단일 경로 데이터는 선택했던 순서 경로로 그대로 이관해 진도를 잃지 않음.
  if(!state.paths){
    const old={...state};
    const order=old.order==="random"?"random":"sequence";
    state={
      activeOrder:order,lastOrder:order,settingsOpen:!!old.settingsOpen,

function currentSessionScore(){
  if(!quizSession)return {correct:0,wrong:0};
  let correct=0,wrong=0;
  const seen=new Set();
  const all=[...(quizSession.items||[]),...(quizSession.done||[])];
  for(const it of all){
    const id=canonicalProblemId(it);
    if(seen.has(id))continue;
    seen.add(id);
    const st=quizSession.sessionResults?.[id];
    if(st==="correct")correct++;
    else if(st==="wrong")wrong++;
  }
  if(quizSession.correctCount!=null||quizSession.wrongCount!=null){
    return {correct:quizSession.correctCount||0,wrong:quizSession.wrongCount||0};
  }
  return {correct,wrong};
}

function activeProgressRound(){
  const p=plannerStore();
  if(app.ui.activePlannerRoundId==="__cumulative__")return null;
  const selected=p.rounds.find(r=>r.id===app.ui.activePlannerRoundId);
  if(selected)return selected;
  const today=plannerToday();
  const current=[...p.rounds].filter(r=>r.start<=today&&today<=(r.reviewDate||r.end)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const latest=[...p.rounds].sort((a,b)=>String(b.start||"").localeCompare(String(a.start||""))||(b.createdAt||0)-(a.createdAt||0))[0];
  return current||latest||null;
}

function roundPathMissions(round,sheetId,order){
  if(!round)return [];
  return (round.missions||[]).filter(m=>m.kind==="bankPath"&&m.sheetId===sheetId&&(m.order||"sequence")===(order||"sequence")&&!plannerMissionExcluded(round,m));
}
function roundPathMission(round,sheetId,order,setIndex){
  return roundPathMissions(round,sheetId,order).find(m=>Number(m.setIndex)===Number(setIndex))||null;
}
function roundPathProgress(round,sheetId,order){
  const missions=roundPathMissions(round,sheetId,order);
  const done=missions.filter(m=>plannerMissionDone(round,m)).length,total=missions.length;
  return {done,total,pct:total?Math.round(done/total*100):0};
}

function scheduleQuizMemoAdvance(){
  clearQuizMemoAdvanceTimer();
  if(!quizSession?.awaitingExplanation)return;
  const mode=quizMemoAdvanceMode();

function bankDuplicateAudit(sheet){
  const groups=new Map();
  (sheet?.items||[]).forEach(item=>{
    const q=norm(item.question),a=norm(item.answer);

    const key=q+"\\u0001"+a;

    groups.get(key).push(item);
  });
  return [...groups.values()].filter(g=>g.length>1);
}

/* 뽀개기 planner — v7 fixed-round mission planner */
const PLANNER_VERSION=7;
let plannerBaseCache={key:"",units:[],map:new Map()};
let plannerRealtime={state:"off",uid:"",lastAt:0,error:"",channels:{}};
const plannerPendingWrites=new Set();
let plannerRoundDraft=null;
let plannerFormInteractionUntil=0;
let plannerDeferredFullRenderTimer=0;
function plannerScopeCatalog(){
  const memory=[],bank=[];
  for(const subject of app.study.subjects||[]){
    for(const sheet of subject.sheets||[]){
      if(sheet.archived)continue;
      const count=(sheet.rows||[]).filter(r=>r?.type!=="section"&&(r.correct||r.category||r.memo)).length;
      if(count)memory.push({id:sheet.id,label:`${subject.name} › ${sheet.name}`,count});
    }
  }
  for(const sheet of (app.bank.sheets||[]).filter(x=>!x.legacyWrong&&!x.archived)){
    const meta=bankSheetMeta(sheet);
    bank.push({id:sheet.id,label:`${meta.subject||"문제은행"} › ${meta.area||sheet.name}`,count:(sheet.items||[]).length});
  }
  return {memory,bank};
}
function plannerGetRoundDraft(today=plannerToday(),catalog=plannerScopeCatalog()){
  if(!plannerRoundDraft){
    plannerRoundDraft={
      name:`${plannerNextRoundNumber()}회독`,start:today,end:plannerAddDays(today,13),scopeOpen:false,
      memorySheetIds:new Set(catalog.memory.map(x=>x.id)),bankSheetIds:new Set(catalog.bank.map(x=>x.id))
    };
  }
  if(!(plannerRoundDraft.memorySheetIds instanceof Set))plannerRoundDraft.memorySheetIds=new Set(plannerRoundDraft.memorySheetIds||[]);
  if(!(plannerRoundDraft.bankSheetIds instanceof Set))plannerRoundDraft.bankSheetIds=new Set(plannerRoundDraft.bankSheetIds||[]);
  // 회독 작성 중 시트를 보관함으로 옮겼다면 오래된 draft에 남은 ID만 조용히 제거한다.
  // 새로 활성화된 시트를 draft에 자동 추가하지는 않는다: 사용자가 고른 범위를 존중한다.
  const validMemory=new Set(catalog.memory.map(x=>x.id)),validBank=new Set(catalog.bank.map(x=>x.id));
  plannerRoundDraft.memorySheetIds=new Set([...plannerRoundDraft.memorySheetIds].filter(id=>validMemory.has(id)));
  plannerRoundDraft.bankSheetIds=new Set([...plannerRoundDraft.bankSheetIds].filter(id=>validBank.has(id)));
  return plannerRoundDraft;
}
function plannerTouchRoundForm(ms=2200){plannerFormInteractionUntil=Math.max(plannerFormInteractionUntil,Date.now()+ms)}
function plannerRoundFormInteractionActive(){
  const a=document.activeElement;
  return Date.now()<plannerFormInteractionUntil||!!a?.closest?.(".planner-round-form");
}
function plannerScheduleDeferredFullRender(){
  if(plannerDeferredFullRenderTimer)clearTimeout(plannerDeferredFullRenderTimer);
  plannerDeferredFullRenderTimer=setTimeout(()=>{
    plannerDeferredFullRenderTimer=0;
    if(plannerRoundFormInteractionActive()){plannerScheduleDeferredFullRender();return}
    if(app.study.mode==="planner")renderPlanner();
  },450);
}

function plannerQueueWrite(promise){
  plannerPendingWrites.add(promise);
  plannerSetRealtime("saving");
  promise.then(()=>{
    plannerPendingWrites.delete(promise);
    if(!plannerPendingWrites.size)plannerSetRealtime("saved");
  }).catch(err=>{
    plannerPendingWrites.delete(promise);
    plannerSetRealtime("error",err?.code||"저장 실패");
  });
  return promise;
}
async function plannerWaitPendingWrites(){
  if(!plannerPendingWrites.size)return;
  await Promise.allSettled([...plannerPendingWrites]);
}

function plannerFreshState(){
  return {
    version:PLANNER_VERSION,
    rounds:[],
    missionState:{},
    pathProgress:{},
    manual:{},
    logs:{},
    selectedDate:"",
    calendarMonth:""
  };
}
function plannerStore(){
  if(!app.study.planner||app.study.planner.version!==PLANNER_VERSION){
    app.study.planner=plannerFreshState();
    saveStudyQuickNow();saveLocal();
  }
  const p=app.study.planner;
  if(!Array.isArray(p.rounds))p.rounds=[];
  if(!p.missionState||typeof p.missionState!=="object")p.missionState={};
  if(!p.pathProgress||typeof p.pathProgress!=="object")p.pathProgress={};
  if(!p.manual||typeof p.manual!=="object")p.manual={};
  if(!p.logs||typeof p.logs!=="object")p.logs={};
  if(typeof p.selectedDate!=="string")p.selectedDate="";
  if(typeof p.calendarMonth!=="string")p.calendarMonth="";
  return p;
}

function plannerDateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function plannerDate(key){return new Date(`${key}T12:00:00`)}
function plannerToday(){return plannerDateKey(new Date())}
function plannerMonthKey(key=plannerToday()){return String(key).slice(0,7)}
function plannerAddDays(key,n){const d=plannerDate(key);d.setDate(d.getDate()+n);return plannerDateKey(d)}
function plannerDates(a,b){
  const out=[];for(let k=a;k<=b;k=plannerAddDays(k,1))out.push(k);return out;
}
function plannerCalendarCells(monthKey){
  const safe=/^\d{4}-\d{2}$/.test(String(monthKey||""))?monthKey:plannerMonthKey();
  const [y,m]=safe.split("-").map(Number),first=new Date(y,m-1,1,12),start=new Date(first);
  start.setDate(1-first.getDay());
  return Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return plannerDateKey(d)});
}
function plannerCalendarMonthShift(delta){

  d.setMonth(d.getMonth()+delta);p.calendarMonth=plannerMonthKey(plannerDateKey(d));plannerSaveLocal();renderPlanner();
