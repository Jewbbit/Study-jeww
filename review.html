<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문제은행 검수</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:#e2e2e7;--text:#1f1f23;--sub:#77777f;--soft:#f1f1f4;--ok:#2b7d55;--bad:#ba5149;--warn:#a16b14;--accent:#6357d9}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:940px;margin:auto;padding:8px 10px;display:grid;gap:7px}.topline,.filters,.stats,.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.title{font-size:16px;font-weight:760;margin-right:auto}
button,.pill,select,input[type="search"]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;color:var(--text)}button:active{transform:translateY(1px)}select{max-width:240px;min-width:0}input[type="search"]{min-width:160px;flex:1}.small{font-size:11px;color:var(--sub)}.pill{font-size:11px;background:#fff;padding:5px 8px}.source-pill{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{height:5px;background:#e6e6ea;border-radius:999px;overflow:hidden;flex:1;min-width:100px}.progress>i{display:block;height:100%;width:0;background:#555;border-radius:999px;transition:width .15s}
main{max-width:940px;margin:auto;padding:12px 10px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-height:56vh;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--sub);font-size:11px}.tag{padding:4px 7px;border-radius:999px;background:var(--soft);color:#666}.q{font-size:20px;line-height:1.55;font-weight:720;white-space:pre-wrap;word-break:keep-all}.block{border-top:1px solid #ececef;padding-top:10px}.label{font-size:11px;color:var(--sub);margin-bottom:5px}.answer,.memo{font-size:15px;line-height:1.55;white-space:pre-wrap}.review-note{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:11px;padding:10px;outline:none;background:#fff}.review-note:focus{border-color:#aaa}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:auto}.status-btn{padding:11px 6px;border-radius:11px;background:#f6f6f8;font-size:12px;font-weight:650}.status-btn.active[data-status="keep"]{background:#edf7f1;border-color:#9dcdb3;color:#216d49}.status-btn.active[data-status="delete"]{background:#fff0ef;border-color:#e2aaa6;color:#9e4039}.status-btn.active[data-status="revise"]{background:#fff7e8;border-color:#e3c384;color:#8a5c10}.status-btn.active[data-status="add"]{background:#f0efff;border-color:#bbb5ee;color:#5347b6}
.nav{margin-top:10px;justify-content:space-between}.nav button{min-width:92px}.nav-center{display:flex;gap:6px;align-items:center}.empty{background:#fff;border:1px dashed #cfcfd5;border-radius:14px;padding:44px 18px;text-align:center;color:#777;line-height:1.65}.empty .load{margin-top:12px;background:#222;color:#fff;border-color:#222}.autoadv{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#666}.downloads{display:flex;gap:6px;margin-left:auto}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;border-radius:18px;padding:8px 12px;font-size:11px;opacity:0;pointer-events:none;transition:.18s;z-index:50}.toast.show{opacity:1}.kbd{font-size:10px;color:#999;margin-top:4px;text-align:center}
@media(max-width:680px){.header-inner{padding:7px}.title{width:100%}.filters>*{flex:1 1 42%;max-width:none}.filters input[type="search"]{flex-basis:100%}.source-pill{max-width:100%}main{padding:8px 7px 86px}.card{padding:13px;min-height:62vh}.q{font-size:17px}.status-grid{grid-template-columns:1fr 1fr}.downloads{width:100%;margin-left:0}.downloads button{flex:1}.nav button{min-width:74px;padding:8px 7px}.kbd{display:none}}
</style>
</head>
<body>
<header><div class="header-inner">
  <div class="topline">
    <div class="title">문제은행 카드 검수</div>
    <button id="localBtn" type="button">로컬 다시 읽기</button>
    <button id="fileBtn" type="button">엑셀 불러오기</button>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm" hidden>
    <a href="./edit.html" style="text-decoration:none"><button type="button">메인</button></a>
  </div>
  <div class="filters">
    <select id="subjectSel" aria-label="과목"></select>
    <select id="sheetSel" aria-label="시트"></select>
    <select id="statusSel" aria-label="검수 상태">
      <option value="all">전체</option><option value="unreviewed">미검수</option><option value="keep">유지</option><option value="delete">삭제 후보</option><option value="revise">수정 필요</option><option value="add">추가 필요</option>
    </select>
    <input id="searchBox" type="search" placeholder="문제·정답·카테고리 검색">
  </div>
  <div class="stats">
    <span class="pill source-pill" id="sourceStat">원본 없음</span><span class="pill" id="scopeStat">0/0 검수</span>
    <div class="progress"><i id="progressBar"></i></div><span class="small" id="positionStat">0 / 0</span>
    <label class="autoadv"><input id="autoAdvance" type="checkbox" checked> 판정 후 자동 넘김</label>
    <div class="downloads"><button id="exportSubject" type="button">현재 과목 XLSX</button><button id="exportAll" type="button">전과목 XLSX</button></div>
  </div>
</div></header>
<main>
  <div id="empty" class="empty" hidden></div>
  <section id="card" class="card" hidden>
    <div class="meta" id="meta"></div><div class="q" id="question"></div>
    <div class="block"><div class="label">정답</div><div class="answer" id="answer"></div></div>
    <div class="block" id="originMemoWrap"><div class="label">기존 메모</div><div class="memo" id="originMemo"></div></div>
    <div class="block"><div class="label">검수 메모 · 수정 지시 / 추가할 내용 / 삭제 이유</div><textarea id="reviewNote" class="review-note" placeholder="필요한 경우만 적으세요. 원본 문제은행은 수정하지 않습니다."></textarea></div>
    <div class="status-grid" id="statusGrid"><button class="status-btn" data-status="keep" type="button">1 · 유지</button><button class="status-btn" data-status="delete" type="button">2 · 삭제 후보</button><button class="status-btn" data-status="revise" type="button">3 · 수정 필요</button><button class="status-btn" data-status="add" type="button">4 · 추가 필요</button></div>
  </section>
  <div class="nav"><button id="prevBtn" type="button">← 이전</button><div class="nav-center"><button id="nextUnreviewedBtn" type="button">다음 미검수</button><button id="clearStatusBtn" type="button">판정 해제</button></div><button id="nextBtn" type="button">다음 →</button></div>
  <div class="kbd">←/→ 이동 · 1 유지 · 2 삭제 · 3 수정 · 4 추가 · M 메모 · N 다음 미검수</div>
</main><div id="toast" class="toast"></div>
<script>
(()=>{"use strict";
const APP_KEYS=["study-jew-v4","study-jew-v4-bank","study-jew-bank-v1"];
const REVIEW_KEY="study-jew-bank-review-v1",UI_KEY="study-jew-bank-review-ui-v1";
const STATUS_LABEL={keep:"유지",delete:"삭제 후보",revise:"수정 필요",add:"추가 필요"};
let bankSheets=[],sourceLabel="원본 없음",deck=[],noteTimer=0,swipeStart=null;
let review=loadJson(REVIEW_KEY,{version:1,records:{}});if(!review||typeof review!=="object")review={version:1,records:{}};if(!review.records||typeof review.records!=="object")review.records={};
let ui=loadJson(UI_KEY,{subject:"",sheet:"all",status:"all",search:"",index:0,autoAdvance:true});
const $=id=>document.getElementById(id);function text(v){return String(v??"")}function loadJson(k,f){try{const x=JSON.parse(localStorage.getItem(k)||"null");return x??f}catch{return f}}
function saveReview(){try{localStorage.setItem(REVIEW_KEY,JSON.stringify(review))}catch{toast("검수 메모 저장 실패")}}function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui))}catch{}}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1400)}
function hash(s){let h=2166136261;for(const ch of text(s)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function subjectOf(sheet){const n=text(sheet?.name).trim(),i=n.indexOf("_");return i>0?n.slice(0,i).trim():(n||"기타")}
function activeSheets(){return bankSheets.filter(s=>s&&!s.archived&&!s.versionHidden&&Array.isArray(s.items))}
function stableItemKey(sheet,item){return `${text(sheet.name)}::${text(item.row)}::${hash(`${text(item.category)}|${text(item.question)}|${text(item.answer)}`)}`}
function keyFor(sheet,item){return item.reviewKey||stableItemKey(sheet,item)}function recFor(sheet,item){return review.records[keyFor(sheet,item)]||{status:"",note:"",updatedAt:0}}
function current(){return deck[Math.max(0,Math.min(deck.length-1,Number(ui.index)||0))]||null}
function normalizeSheets(sheets){return (Array.isArray(sheets)?sheets:[]).map((s,si)=>({...s,id:s.id||`sheet:${si}:${hash(s.name)}`,items:(Array.isArray(s.items)?s.items:[]).map((it,ii)=>({...it,row:it.row||ii+2,reviewKey:it.reviewKey||stableItemKey(s,{...it,row:it.row||ii+2})}))}))}
function extractLocalSheets(){for(const key of APP_KEYS){const raw=loadJson(key,null),candidates=[raw?.bank?.sheets,raw?.sheets,raw?.bankSheets];for(const sheets of candidates)if(Array.isArray(sheets)&&sheets.some(s=>Array.isArray(s?.items)&&s.items.length))return {key,sheets}}return null}
function readLocalBank(){const found=extractLocalSheets();if(!found){bankSheets=[];sourceLabel="로컬 문제은행 없음";afterSource(false);return false}bankSheets=normalizeSheets(found.sheets);sourceLabel=`로컬 · ${found.key}`;afterSource(false);toast(`로컬 ${activeSheets().length}개 시트 읽음`);return true}
function cell(ws,addr){const c=ws[addr];return c?text(c.w??c.v).trim():""}
function parseWorkbook(wb,fileName){const out=[];for(const name of wb.SheetNames||[]){const ws=wb.Sheets[name];if(!ws?.["!ref"])continue;const range=XLSX.utils.decode_range(ws["!ref"]),hA=cell(ws,"A1"),hB=cell(ws,"B1"),hC=cell(ws,"C1");if(!/카테고리|분류/i.test(hA)||!/문제|단어/i.test(hB)||!/정답|답안|답/i.test(hC))continue;const items=[];for(let r=1;r<=range.e.r;r++){const category=cell(ws,`A${r+1}`),question=cell(ws,`B${r+1}`),answer=cell(ws,`C${r+1}`),memo=cell(ws,`D${r+1}`);if(!question&&!answer&&!category&&!memo)continue;if(!question)continue;const item={row:r+1,category,section:"",question,answer,memo,tag:cell(ws,`G${r+1}`),sourceLabel:"",reviewKey:""};item.reviewKey=stableItemKey({name},item);items.push(item)}if(items.length)out.push({id:`xlsx:${hash(name)}`,name,source:fileName,archived:false,versionHidden:false,items})}return out}
async function importFile(file){if(!file)return;try{const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:"array",cellDates:false});const sheets=parseWorkbook(wb,file.name);if(!sheets.length){toast("A=카테고리, B=문제, C=정답 형식의 시트를 못 찾았습니다");return}bankSheets=normalizeSheets(sheets);sourceLabel=`엑셀 · ${file.name}`;afterSource(false);toast(`${activeSheets().length}개 시트 · ${allItemsCount()}문제 불러옴`)}catch(e){console.error(e);toast("엑셀을 읽지 못했습니다")}}
function allItemsCount(){let n=0;for(const s of activeSheets())n+=(s.items||[]).filter(i=>text(i.question).trim()).length;return n}
function afterSource(keepCurrent=true){populateSubjects();rebuildDeck({keepCurrent});$("sourceStat").textContent=sourceLabel;render()}
function populateSubjects(){const sel=$("subjectSel"),subs=[...new Set(activeSheets().map(subjectOf))].sort((a,b)=>a.localeCompare(b,"ko"));if(!ui.subject||!subs.includes(ui.subject))ui.subject=subs[0]||"";sel.innerHTML="";for(const s of subs){const o=document.createElement("option");o.value=s;o.textContent=s;sel.append(o)}sel.value=ui.subject;populateSheets()}
function populateSheets(){const sel=$("sheetSel"),list=activeSheets().filter(s=>subjectOf(s)===ui.subject);sel.innerHTML='<option value="all">과목 전체</option>';for(const s of list){const o=document.createElement("option");o.value=text(s.id);o.textContent=s.name||"이름 없는 시트";sel.append(o)}if(ui.sheet!=="all"&&!list.some(s=>text(s.id)===text(ui.sheet)))ui.sheet="all";sel.value=ui.sheet}
function allScopeItems(subject=ui.subject,ignoreSheet=false){const out=[];for(const sheet of activeSheets()){if(subject&&subjectOf(sheet)!==subject)continue;if(!ignoreSheet&&ui.sheet!=="all"&&text(sheet.id)!==text(ui.sheet))continue;for(const item of sheet.items||[])if(item&&text(item.question).trim())out.push({sheet,item})}return out}
function matchesStatus(p){const st=recFor(p.sheet,p.item).status||"";return ui.status==="all"?true:ui.status==="unreviewed"?!st:st===ui.status}
function matchesSearch(p){const q=text(ui.search).trim().toLowerCase();if(!q)return true;const i=p.item;return [i.category,i.section,i.question,i.answer,i.memo,i.tag,i.sourceLabel].some(v=>text(v).toLowerCase().includes(q))}
function rebuildDeck({keepCurrent=true}={}){const before=keepCurrent?current():null,bk=before?keyFor(before.sheet,before.item):"";deck=allScopeItems().filter(matchesStatus).filter(matchesSearch);let idx=bk?deck.findIndex(x=>keyFor(x.sheet,x.item)===bk):-1;if(idx<0)idx=Math.max(0,Math.min(deck.length-1,Number(ui.index)||0));ui.index=idx<0?0:idx;saveUi();render()}
function escapeHtml(s){return text(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){const p=current(),card=$("card"),empty=$("empty");$("sourceStat").textContent=sourceLabel;updateStats();if(!p){card.hidden=true;empty.hidden=false;empty.innerHTML=bankSheets.length?"현재 필터에 해당하는 문제가 없습니다.":`메인 앱의 로컬 문제은행을 이 화면에서 읽지 못했습니다.<br><span class="small">브라우저/PWA 저장공간이 분리된 경우가 있어서, 여기서는 원본 엑셀을 직접 불러오면 됩니다.</span><br><button class="load" id="emptyFileBtn" type="button">원본 엑셀 불러오기</button>`;$("emptyFileBtn")?.addEventListener("click",()=>$("fileInput").click());$("reviewNote").value="";return}empty.hidden=true;card.hidden=false;const {sheet,item}=p,r=recFor(sheet,item),tags=[];tags.push(`<span class="tag">${escapeHtml(subjectOf(sheet))}</span>`,`<span class="tag">${escapeHtml(sheet.name||"")}</span>`);if(text(item.category).trim())tags.push(`<span class="tag">${escapeHtml(item.category)}</span>`);if(text(item.section).trim()&&text(item.section).trim()!==text(item.category).trim())tags.push(`<span class="tag">${escapeHtml(item.section)}</span>`);tags.push(`<span>원본 행 ${escapeHtml(item.row||"")}</span>`);$("meta").innerHTML=tags.join("");$("question").textContent=text(item.question);$("answer").textContent=text(item.answer)||"—";$("originMemo").textContent=text(item.memo)||"—";$("reviewNote").value=r.note||"";document.querySelectorAll(".status-btn").forEach(b=>b.classList.toggle("active",b.dataset.status===r.status));$("positionStat").textContent=`${ui.index+1} / ${deck.length}`}
function updateStats(){const scope=allScopeItems(),done=scope.filter(p=>!!recFor(p.sheet,p.item).status).length,total=scope.length;$("scopeStat").textContent=`${done}/${total} 검수`;$("progressBar").style.width=`${total?done/total*100:0}%`;if(!deck.length)$("positionStat").textContent="0 / 0"}
function setStatus(st){const p=current();if(!p)return;const k=keyFor(p.sheet,p.item),old=recFor(p.sheet,p.item);review.records[k]={...old,status:st,note:$("reviewNote").value||"",updatedAt:Date.now()};saveReview();if(ui.status!=="all"){rebuildDeck({keepCurrent:false});return}render();if(ui.autoAdvance)move(1)}
function clearStatus(){const p=current();if(!p)return;const k=keyFor(p.sheet,p.item),old=recFor(p.sheet,p.item);if(old.note)review.records[k]={status:"",note:old.note,updatedAt:Date.now()};else delete review.records[k];saveReview();rebuildDeck({keepCurrent:true})}
function saveCurrentNote(){const p=current();if(!p)return;const k=keyFor(p.sheet,p.item),old=recFor(p.sheet,p.item),note=$("reviewNote").value||"";if(!old.status&&!note)delete review.records[k];else review.records[k]={...old,note,updatedAt:Date.now()};saveReview()}
function move(d){saveCurrentNote();if(!deck.length)return;ui.index=Math.max(0,Math.min(deck.length-1,ui.index+d));saveUi();render();window.scrollTo({top:0,behavior:"instant"})}
function nextUnreviewed(){saveCurrentNote();const all=allScopeItems().filter(matchesSearch);if(!all.length)return;const cur=current(),ck=cur?keyFor(cur.sheet,cur.item):"",start=Math.max(0,all.findIndex(p=>keyFor(p.sheet,p.item)===ck));for(let n=1;n<=all.length;n++){const p=all[(start+n)%all.length];if(!recFor(p.sheet,p.item).status){ui.status="all";$("statusSel").value="all";deck=allScopeItems().filter(matchesSearch);ui.index=deck.findIndex(x=>keyFor(x.sheet,x.item)===keyFor(p.sheet,p.item));saveUi();render();return}}toast("현재 범위는 모두 검수했습니다")}
function exportRows(subject){const pairs=allScopeItems(subject,true),rows=[];for(const {sheet,item} of pairs){const r=recFor(sheet,item);rows.push({"과목":subjectOf(sheet),"시트명":sheet.name||"","원본행":item.row||"","문제ID":keyFor(sheet,item),"카테고리":item.category||item.section||"","현재 문제":item.question||"","현재 정답":item.answer||"","기존 메모":item.memo||"","판정":STATUS_LABEL[r.status]||"미검수","수정 요청 메모":r.note||"","업데이트 시각":r.updatedAt?new Date(r.updatedAt).toLocaleString("ko-KR"):""})}return rows}
function safeSheetName(s){return text(s||"검수").replace(/[\\/?*\[\]:]/g," ").slice(0,31)||"검수"}
function exportWorkbook(subjectOnly){if(!bankSheets.length){toast("먼저 문제은행을 불러오세요");return}saveCurrentNote();const wb=XLSX.utils.book_new(),subjects=subjectOnly?[ui.subject]:[...new Set(activeSheets().map(subjectOf))].sort((a,b)=>a.localeCompare(b,"ko"));let total=0;for(const s of subjects){const rows=exportRows(s);if(!rows.length)continue;total+=rows.length;const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=[{wch:10},{wch:24},{wch:8},{wch:22},{wch:28},{wch:55},{wch:35},{wch:35},{wch:12},{wch:50},{wch:20}];XLSX.utils.book_append_sheet(wb,ws,safeSheetName(s))}if(!total){toast("내보낼 문제가 없습니다");return}const date=new Date().toISOString().slice(0,10);XLSX.writeFile(wb,subjectOnly?`${ui.subject||"과목"}_문제검수_${date}.xlsx`:`전과목_문제검수_${date}.xlsx`)}
$("localBtn").onclick=()=>readLocalBank();$("fileBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{const f=e.target.files?.[0];if(f)importFile(f);e.target.value=""};
$("subjectSel").onchange=e=>{saveCurrentNote();ui.subject=e.target.value;ui.sheet="all";ui.index=0;populateSheets();rebuildDeck({keepCurrent:false})};$("sheetSel").onchange=e=>{saveCurrentNote();ui.sheet=e.target.value;ui.index=0;rebuildDeck({keepCurrent:false})};$("statusSel").onchange=e=>{saveCurrentNote();ui.status=e.target.value;ui.index=0;rebuildDeck({keepCurrent:false})};$("searchBox").oninput=e=>{ui.search=e.target.value;ui.index=0;rebuildDeck({keepCurrent:false})};$("autoAdvance").onchange=e=>{ui.autoAdvance=e.target.checked;saveUi()};
$("reviewNote").oninput=()=>{clearTimeout(noteTimer);noteTimer=setTimeout(saveCurrentNote,250)};document.querySelectorAll(".status-btn").forEach(b=>b.onclick=()=>setStatus(b.dataset.status));$("clearStatusBtn").onclick=clearStatus;$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);$("nextUnreviewedBtn").onclick=nextUnreviewed;$("exportSubject").onclick=()=>exportWorkbook(true);$("exportAll").onclick=()=>exportWorkbook(false);
document.addEventListener("keydown",e=>{if(e.target===$("reviewNote")){if(e.key==="Escape")e.target.blur();return}if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}else if(e.key==="ArrowRight"){e.preventDefault();move(1)}else if(["1","2","3","4"].includes(e.key)){e.preventDefault();setStatus(({1:"keep",2:"delete",3:"revise",4:"add"})[e.key])}else if(e.key.toLowerCase()==="m"){e.preventDefault();$("reviewNote").focus()}else if(e.key.toLowerCase()==="n"){e.preventDefault();nextUnreviewed()}});
$("card").addEventListener("touchstart",e=>{if(e.target.closest("textarea,button,input,select"))return;const t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY}},{passive:true});$("card").addEventListener("touchend",e=>{if(!swipeStart)return;const t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1)},{passive:true});
window.addEventListener("pagehide",saveCurrentNote);ui.status=["all","unreviewed","keep","delete","revise","add"].includes(ui.status)?ui.status:"all";$("statusSel").value=ui.status;$("searchBox").value=ui.search||"";$("autoAdvance").checked=ui.autoAdvance!==false;readLocalBank();
})();
</script>
</body></html>
