<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문제은행 검수</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:#e3e3e8;--text:#202024;--sub:#7b7b83;--soft:#f3f3f5;--ok:#267653;--bad:#b74843;--warn:#916111;--accent:#5b51c8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:rgba(245,245,247,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.head{max-width:980px;margin:auto;padding:7px 9px;display:grid;gap:6px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.title{font-weight:780;font-size:16px;margin-right:auto}.btn,select,input[type=search]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;color:var(--text)}.btn.primary{background:#222;color:#fff;border-color:#222}.btn.subtle{background:transparent}.small{font-size:11px;color:var(--sub)}.source{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow{flex:1;min-width:120px}.progress{height:5px;background:#e6e6ea;border-radius:999px;overflow:hidden;min-width:100px;flex:1}.progress i{display:block;height:100%;background:#555;width:0}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:5px 8px}
main{max-width:980px;margin:auto;padding:10px 9px 118px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;display:grid;gap:10px;min-height:56vh}.meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--sub)}.tag{background:var(--soft);padding:4px 7px;border-radius:999px}.edit-grid{display:grid;grid-template-columns:1fr;gap:8px}.field{display:grid;gap:4px}.field label{font-size:10px;color:var(--sub);padding-left:2px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;outline:none;resize:vertical;line-height:1.45}.field textarea:focus,.field input:focus{border-color:#aaa}.question-edit{font-size:18px;font-weight:700;min-height:88px}.answer-edit{font-size:15px;font-weight:650;min-height:66px}.memo-edit{min-height:58px}.review-edit{min-height:72px}.edited{border-color:#bcb6ef!important;background:#faf9ff!important}.review-wrap{border-top:1px solid #ededf0;padding-top:9px}.review-head{display:flex;align-items:center;gap:6px}.review-head button{margin-left:auto}.status-inline{display:flex;gap:6px;flex-wrap:wrap}.status-btn{border:1px solid var(--line);background:#f7f7f8;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700}.status-btn.active[data-status=keep]{background:#edf7f1;border-color:#a2ccb5;color:#236a49}.status-btn.active[data-status=delete]{background:#fff0ef;border-color:#e0aaa6;color:#973d38}.status-btn.active[data-status=revise]{background:#fff7e8;border-color:#e1c58f;color:#81570d}.status-btn.active[data-status=add]{background:#f1efff;border-color:#beb8ec;color:#5146ae}.empty{background:#fff;border:1px dashed #cfcfd5;border-radius:14px;padding:44px 18px;text-align:center;color:#777;line-height:1.6}.empty .btn{margin-top:10px}
.dock{position:fixed;z-index:40;left:0;right:0;bottom:0;background:rgba(248,248,250,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.dock-inner{max-width:980px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.dock .navbtn{min-width:78px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px}.dock-status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.dock-status .status-btn{padding:11px 6px}.kbd{text-align:center;font-size:10px;color:#999;margin-top:4px}
@media(max-width:720px){.head{padding:6px}.title{width:100%}.row.filters>*{flex:1 1 42%;max-width:none}.row.filters input{flex-basis:100%}.source{max-width:100%}.edit-grid{grid-template-columns:1fr}.question-edit{font-size:17px;min-height:96px}.card{padding:10px;min-height:62vh}.dock-inner{grid-template-columns:1fr}.dock .navs{display:grid;grid-template-columns:1fr 1fr;gap:6px;order:2}.dock-status{order:1}.dock .navbtn{width:100%}.kbd{display:none}main{padding:7px 7px 150px}.desktop-only{display:none!important}}
</style>
</head>
<body>
<header><div class="head">
  <div class="row"><div class="title">문제은행 빠른 검수</div><span class="pill source" id="sourceStat">원본 없음</span><span class="pill" id="saveStat">저장 준비</span><button class="btn" id="localBtn">메인 로컬 읽기</button><button class="btn primary" id="fileBtn">엑셀/검수내역 불러오기</button><input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm" hidden><a href="./edit.html"><button class="btn">메인</button></a></div>
  <div class="row filters"><select id="subjectSel"></select><select id="sheetSel"></select><select id="statusSel"><option value="all">전체</option><option value="unreviewed">미검수</option><option value="keep">유지</option><option value="delete">삭제 후보</option><option value="revise">수정 필요</option><option value="add">추가 필요</option></select><input id="searchBox" type="search" placeholder="문제·정답·카테고리 검색" class="grow"></div>
  <div class="row"><span class="pill" id="scopeStat">0/0 검수</span><div class="progress"><i id="progressBar"></i></div><span class="small" id="positionStat">0 / 0</span><label class="small"><input id="autoAdvance" type="checkbox" checked> 판정 후 자동 넘김</label><button class="btn" id="nextUnreviewedBtn">다음 미검수</button><button class="btn" id="exportReportBtn">현재 범위 검수내역 XLSX</button><button class="btn" id="exportEditedBtn">현재 범위 수정본 XLSX</button></div>
</div></header>
<main>
  <div id="empty" class="empty" hidden></div>
  <section id="card" class="card" hidden>
    <div class="meta" id="meta"></div>
    <div class="edit-grid"><div class="field"><label>카테고리</label><input id="categoryEdit"></div><div class="field"><label>문제</label><textarea id="questionEdit" class="question-edit"></textarea></div></div>
    <div class="field"><label>정답</label><textarea id="answerEdit" class="answer-edit"></textarea></div>
    <div class="field"><label>기존 메모 / 해설</label><textarea id="memoEdit" class="memo-edit"></textarea></div>
    <div class="review-wrap"><div class="review-head"><strong style="font-size:12px">검수 메모</strong><span class="small">GPT에게 줄 수정 지시·삭제 이유·추가 아이디어</span><button class="btn subtle" id="resetEditsBtn">직접수정 되돌리기</button></div><div class="field"><textarea id="reviewNote" class="review-edit" placeholder="필요할 때만 적으세요."></textarea></div></div>
    <div class="status-inline desktop-only" id="statusInline"><button class="status-btn" data-status="keep">1 유지</button><button class="status-btn" data-status="delete">2 삭제</button><button class="status-btn" data-status="revise">3 수정</button><button class="status-btn" data-status="add">4 추가</button><button class="btn" id="clearStatusBtn">판정 해제</button></div>
  </section>
</main>
<div class="dock"><div class="dock-inner"><div class="navs"><button class="navbtn" id="prevBtn">← 이전</button><button class="navbtn" id="nextBtn">다음 →</button></div><div class="dock-status"><button class="status-btn" data-status="keep">1 유지</button><button class="status-btn" data-status="delete">2 삭제</button><button class="status-btn" data-status="revise">3 수정</button><button class="status-btn" data-status="add">4 추가</button></div><div class="desktop-only small">←/→ 이동 · 1~4 판정 · M 메모 · N 다음 미검수</div></div><div class="kbd">카드를 좌우로 밀어 이동할 수도 있습니다</div></div>
<script>
(()=>{"use strict";
const APP_KEYS=["study-jew-v4","study-jew-v4-bank","study-jew-bank-v1"],LEGACY_KEY="study-jew-bank-review-v1",UI_KEY="study-jew-bank-review-ui-v2",DB_NAME="study-jew-bank-review-v2",RECORD_STORE="records",SOURCE_STORE="sources";
const STATUS_LABEL={keep:"유지",delete:"삭제 후보",revise:"수정 필요",add:"추가 필요"},STATUS_CODE={"유지":"keep","삭제 후보":"delete","삭제":"delete","수정 필요":"revise","수정":"revise","추가 필요":"add","추가":"add","미검수":""};
const $=id=>document.getElementById(id),text=v=>String(v??"");
let bankSheets=[],sourceLabel="원본 없음",deck=[],review={records:{}},ui=loadJson(UI_KEY,{subject:"",sheet:"all",status:"all",search:"",index:0,autoAdvance:true}),db=null,swipeStart=null,inputTimer=0;
function loadJson(k,f){try{const x=JSON.parse(localStorage.getItem(k)||"null");return x??f}catch{return f}}function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui))}catch{}}
function setSaveState(t,bad=false){const e=$("saveStat");e.textContent=t;e.style.color=bad?"#a33":""}
function openDb(){return new Promise(resolve=>{try{const r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(RECORD_STORE))d.createObjectStore(RECORD_STORE,{keyPath:"key"});if(!d.objectStoreNames.contains(SOURCE_STORE))d.createObjectStore(SOURCE_STORE,{keyPath:"key"})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}})}
function dbAll(){return new Promise(resolve=>{if(!db)return resolve([]);try{const r=db.transaction(RECORD_STORE,"readonly").objectStore(RECORD_STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])}catch{resolve([])}})}
function dbGetSource(){return new Promise(resolve=>{if(!db||!db.objectStoreNames.contains(SOURCE_STORE))return resolve(null);try{const r=db.transaction(SOURCE_STORE,"readonly").objectStore(SOURCE_STORE).get("last");r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch{resolve(null)}})}
function dbSaveSource(){if(!db||!bankSheets.length||!db.objectStoreNames.contains(SOURCE_STORE))return;try{db.transaction(SOURCE_STORE,"readwrite").objectStore(SOURCE_STORE).put({key:"last",sourceLabel,bankSheets,savedAt:Date.now()})}catch{}}
function fallbackSave(){try{localStorage.setItem(LEGACY_KEY,JSON.stringify({version:2,records:review.records}));setSaveState("저장됨")}catch{setSaveState("기기 저장공간 부족",true)}}
function recordEmpty(r){return !r||(!r.status&&!text(r.note).trim()&&(!r.edits||!Object.keys(r.edits).length))}
function dbPut(k,v){if(!db){fallbackSave();return}try{const tx=db.transaction(RECORD_STORE,"readwrite"),s=tx.objectStore(RECORD_STORE);if(recordEmpty(v))s.delete(k);else s.put({key:k,...v});tx.oncomplete=()=>setSaveState("저장됨");tx.onerror=()=>{setSaveState("저장 주의",true);fallbackSave()}}catch{fallbackSave()}}
async function loadReview(){db=await openDb();const rows=await dbAll();if(rows.length){for(const x of rows){const {key,...r}=x;review.records[key]=r}}else{const old=loadJson(LEGACY_KEY,null);if(old?.records&&typeof old.records==="object"){review.records={...old.records};for(const [k,v] of Object.entries(review.records))dbPut(k,v)}}setSaveState(db?"저장됨":"로컬 저장")}
function hash(s){let h=2166136261;for(const ch of text(s)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}function subjectOf(s){const n=text(s?.name).trim(),i=n.indexOf("_");return i>0?n.slice(0,i).trim():(n||"기타")}
function stableKey(sheet,item){return `${text(sheet.name)}::${text(item.row)}::${hash(`${text(item.category)}|${text(item.question)}|${text(item.answer)}`)}`}function keyFor(s,i){return i.reviewKey||stableKey(s,i)}function recFor(s,i){return review.records[keyFor(s,i)]||{status:"",note:"",edits:{},updatedAt:0}}
function activeSheets(){return bankSheets.filter(s=>s&&!s.archived&&!s.versionHidden&&Array.isArray(s.items))}function normalizeSheets(xs){return (Array.isArray(xs)?xs:[]).map((s,si)=>({...s,id:s.id||`s:${si}:${hash(s.name)}`,items:(s.items||[]).map((it,ii)=>{const row=it.row||ii+2;return {...it,row,reviewKey:it.reviewKey||stableKey(s,{...it,row})}})}))}
function extractLocal(){for(const k of APP_KEYS){const raw=loadJson(k,null);for(const xs of [raw?.bank?.sheets,raw?.sheets,raw?.bankSheets])if(Array.isArray(xs)&&xs.some(s=>Array.isArray(s?.items)&&s.items.length))return {k,xs}}return null}
function readLocal(){const f=extractLocal();if(!f)return false;bankSheets=normalizeSheets(f.xs);sourceLabel=`메인 로컬 · ${f.k}`;dbSaveSource();afterSource(false);return true}
function cell(ws,a){const c=ws[a];return c?text(c.w??c.v).trim():""}function rowVal(r,...names){for(const n of names)if(Object.prototype.hasOwnProperty.call(r,n)&&text(r[n]).trim()!=="")return text(r[n]);return ""}
function parseOriginalWorkbook(wb,file){const out=[];for(const name of wb.SheetNames||[]){const ws=wb.Sheets[name];if(!ws?.["!ref"])continue;const rg=XLSX.utils.decode_range(ws["!ref"]),hA=cell(ws,"A1"),hB=cell(ws,"B1"),hC=cell(ws,"C1");if(!/카테고리|분류/i.test(hA)||!/문제|단어/i.test(hB)||!/정답|답안|답/i.test(hC))continue;const items=[];for(let r=1;r<=rg.e.r;r++){const item={row:r+1,category:cell(ws,`A${r+1}`),question:cell(ws,`B${r+1}`),answer:cell(ws,`C${r+1}`),memo:cell(ws,`D${r+1}`),tag:cell(ws,`G${r+1}`)};if(!item.question)continue;item.reviewKey=stableKey({name},item);items.push(item)}if(items.length)out.push({id:`xlsx:${hash(name)}`,name,source:file,items})}return out}
function parseReviewWorkbook(wb){const groups=new Map(),imported=[];for(const tab of wb.SheetNames||[]){const ws=wb.Sheets[tab];if(!ws?.["!ref"])continue;const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:false});if(!rows.length)continue;const headers=Object.keys(rows[0]);if(!headers.includes("문제ID")&&!headers.includes("현재문제")&&!headers.includes("현재 문제"))continue;for(const r of rows){const sheetName=rowVal(r,"시트명")||tab,row=Number(rowVal(r,"원본행"))||2,subject=rowVal(r,"과목");const origCat=rowVal(r,"원본카테고리","카테고리"),curCat=rowVal(r,"현재카테고리","현재 카테고리","카테고리")||origCat;const origQ=rowVal(r,"원본문제","현재 문제","현재문제"),curQ=rowVal(r,"현재문제","현재 문제")||origQ;if(!curQ&&!origQ)continue;const origA=rowVal(r,"원본정답","현재 정답","현재정답"),curA=rowVal(r,"현재정답","현재 정답")||origA;const origM=rowVal(r,"원본메모","기존 메모","현재 메모","현재메모"),curM=rowVal(r,"현재메모","현재 메모")||origM;const item={row,category:origCat,question:origQ||curQ,answer:origA||curA,memo:origM,reviewKey:rowVal(r,"문제ID")};if(!item.reviewKey)item.reviewKey=stableKey({name:sheetName},item);if(!groups.has(sheetName))groups.set(sheetName,{id:`restore:${hash(sheetName)}`,name:sheetName,subjectHint:subject,items:[]});groups.get(sheetName).items.push(item);const edits={};if(curCat!==origCat)edits.category=curCat;if(curQ!==(origQ||curQ))edits.question=curQ;if(curA!==(origA||curA))edits.answer=curA;if(curM!==origM)edits.memo=curM;const status=STATUS_CODE[rowVal(r,"판정")]??"",note=rowVal(r,"검수 메모","수정 요청 메모");const rec={status,note,edits,updatedAt:Date.now()};if(!recordEmpty(rec))imported.push({key:item.reviewKey,rec,subject:subject||sheetName})}}
return {sheets:[...groups.values()],records:imported}}
function looksLikeReviewWorkbook(wb){for(const n of wb.SheetNames||[]){const ws=wb.Sheets[n];if(!ws?.["!ref"])continue;const headers=XLSX.utils.sheet_to_json(ws,{header:1,range:0,blankrows:false})[0]||[];if(headers.includes("문제ID")&&(headers.includes("판정")||headers.includes("현재문제")||headers.includes("현재 문제")))return true}return false}
async function importFile(file){if(!file)return;try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});if(looksLikeReviewWorkbook(wb)){const restored=parseReviewWorkbook(wb);if(!restored.sheets.length){alert("검수내역에서 문제를 찾지 못했습니다.");return}bankSheets=normalizeSheets(restored.sheets);const tally={};for(const x of restored.records){review.records[x.key]=x.rec;dbPut(x.key,x.rec);tally[x.subject]=(tally[x.subject]||0)+1}sourceLabel=`복원 · ${file.name}`;const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0];if(best)ui.subject=best;ui.sheet="all";ui.index=0;dbSaveSource();afterSource(false);alert(`어제 검수내역을 복원했습니다. ${restored.records.length}개 판정/메모를 다시 불러왔습니다.`);return}
const xs=parseOriginalWorkbook(wb,file.name);if(!xs.length){alert("문제은행 또는 검수내역 형식의 시트를 찾지 못했습니다.");return}bankSheets=normalizeSheets(xs);sourceLabel=`엑셀 · ${file.name}`;ui.sheet="all";ui.index=0;dbSaveSource();afterSource(false)}catch(e){console.error(e);alert("엑셀을 읽지 못했습니다.")}}
async function restoreLastSource(){const x=await dbGetSource();if(!x?.bankSheets?.length)return false;bankSheets=normalizeSheets(x.bankSheets);sourceLabel=x.sourceLabel||"이전 검수 원본";afterSource(false);return true}
function afterSource(keep=true){populateSubjects();rebuild({keepCurrent:keep});$("sourceStat").textContent=sourceLabel}function populateSubjects(){const a=[...new Set(activeSheets().map(subjectOf))].sort((a,b)=>a.localeCompare(b,"ko"));if(!a.includes(ui.subject))ui.subject=a[0]||"";$("subjectSel").innerHTML=a.map(x=>`<option>${escapeHtml(x)}</option>`).join("");$("subjectSel").value=ui.subject;populateSheets()}function populateSheets(){const a=activeSheets().filter(s=>subjectOf(s)===ui.subject);$("sheetSel").innerHTML='<option value="all">과목 전체</option>'+a.map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");if(ui.sheet!=="all"&&!a.some(s=>text(s.id)===text(ui.sheet)))ui.sheet="all";$("sheetSel").value=ui.sheet;updateExportLabels()}
function allScope(subject=ui.subject,ignoreSheet=false){const out=[];for(const s of activeSheets()){if(subject&&subjectOf(s)!==subject)continue;if(!ignoreSheet&&ui.sheet!=="all"&&text(s.id)!==text(ui.sheet))continue;for(const i of s.items||[])if(i&&text(i.question).trim())out.push({sheet:s,item:i})}return out}function effective(s,i){const e=recFor(s,i).edits||{};return {category:e.category??i.category??i.section??"",question:e.question??i.question??"",answer:e.answer??i.answer??"",memo:e.memo??i.memo??""}}function matches(p){const r=recFor(p.sheet,p.item),q=text(ui.search).trim().toLowerCase();if(ui.status!=="all"&&(ui.status==="unreviewed"?!!r.status:r.status!==ui.status))return false;if(!q)return true;const e=effective(p.sheet,p.item);return [e.category,e.question,e.answer,e.memo,r.note].some(v=>text(v).toLowerCase().includes(q))}function current(){return deck[Math.max(0,Math.min(deck.length-1,ui.index||0))]||null}function rebuild({keepCurrent=true}={}){const before=keepCurrent?current():null,k=before?keyFor(before.sheet,before.item):"";deck=allScope().filter(matches);let ix=k?deck.findIndex(p=>keyFor(p.sheet,p.item)===k):-1;if(ix<0)ix=Math.max(0,Math.min(deck.length-1,ui.index||0));ui.index=Math.max(0,ix);saveUi();render()}
function escapeHtml(s){return text(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function setField(id,val,orig){const e=$(id);e.value=val;e.classList.toggle("edited",text(val)!==text(orig))}
function render(){const p=current();updateStats();updateExportLabels();$("sourceStat").textContent=sourceLabel;if(!p){$("card").hidden=true;$("empty").hidden=false;$("empty").innerHTML=bankSheets.length?"현재 필터에 해당하는 문제가 없습니다.":'저장된 검수 원본을 찾지 못했습니다.<br><span class="small">어제 받은 검수내역 XLSX도 그대로 다시 넣을 수 있습니다.</span><br><button class="btn primary" id="emptyLoad">엑셀/검수내역 불러오기</button>';$("emptyLoad")?.addEventListener("click",()=>$("fileInput").click());return}$("empty").hidden=true;$("card").hidden=false;const {sheet,item}=p,r=recFor(sheet,item),e=effective(sheet,item);$("meta").innerHTML=`<span class="tag">${escapeHtml(subjectOf(sheet))}</span><span class="tag">${escapeHtml(sheet.name)}</span><span>원본 행 ${escapeHtml(item.row)}</span>${r.status?`<span class="tag">${STATUS_LABEL[r.status]}</span>`:""}`;setField("categoryEdit",e.category,item.category??item.section??"");setField("questionEdit",e.question,item.question??"");setField("answerEdit",e.answer,item.answer??"");setField("memoEdit",e.memo,item.memo??"");$("reviewNote").value=r.note||"";document.querySelectorAll(".status-btn").forEach(b=>b.classList.toggle("active",b.dataset.status===r.status));$("positionStat").textContent=`${ui.index+1} / ${deck.length}`}
function updateStats(){const a=allScope(),done=a.filter(p=>!!recFor(p.sheet,p.item).status).length;$("scopeStat").textContent=`${done}/${a.length} 검수`;$("progressBar").style.width=`${a.length?done/a.length*100:0}%`;if(!deck.length)$("positionStat").textContent="0 / 0"}
function collectEdits(p){const {item}=p,e={};for(const [k,id] of [["category","categoryEdit"],["question","questionEdit"],["answer","answerEdit"],["memo","memoEdit"]]){const base=k==="category"?text(item.category??item.section??""):text(item[k]??"");const v=$(id).value;if(v!==base)e[k]=v}return e}function persistCurrent(){const p=current();if(!p)return;clearTimeout(inputTimer);const k=keyFor(p.sheet,p.item),old=recFor(p.sheet,p.item),next={...old,note:$("reviewNote").value||"",edits:collectEdits(p),updatedAt:Date.now()};if(recordEmpty(next))delete review.records[k];else review.records[k]=next;dbPut(k,next)}function schedulePersist(){clearTimeout(inputTimer);setSaveState("저장 중…");inputTimer=setTimeout(persistCurrent,180)}function move(d){persistCurrent();if(!deck.length)return;ui.index=Math.max(0,Math.min(deck.length-1,ui.index+d));saveUi();render();window.scrollTo({top:0,behavior:"instant"})}
function setStatus(st){const p=current();if(!p)return;persistCurrent();const k=keyFor(p.sheet,p.item),r=recFor(p.sheet,p.item);r.status=st;r.updatedAt=Date.now();review.records[k]=r;dbPut(k,r);render();if(ui.autoAdvance)move(1)}function clearStatus(){const p=current();if(!p)return;persistCurrent();const k=keyFor(p.sheet,p.item),r=recFor(p.sheet,p.item);r.status="";r.updatedAt=Date.now();if(recordEmpty(r))delete review.records[k];else review.records[k]=r;dbPut(k,r);render()}function resetEdits(){const p=current();if(!p)return;const k=keyFor(p.sheet,p.item),r=recFor(p.sheet,p.item);r.edits={};r.updatedAt=Date.now();review.records[k]=r;dbPut(k,r);render()}
function nextUnreviewed(){persistCurrent();const a=allScope().filter(p=>{const q=text(ui.search).trim().toLowerCase();if(!q)return true;const e=effective(p.sheet,p.item);return [e.category,e.question,e.answer,e.memo].some(v=>text(v).toLowerCase().includes(q))});if(!a.length)return;const c=current(),ck=c?keyFor(c.sheet,c.item):"",start=Math.max(0,a.findIndex(p=>keyFor(p.sheet,p.item)===ck));for(let n=1;n<=a.length;n++){const p=a[(start+n)%a.length];if(!recFor(p.sheet,p.item).status){ui.status="all";$("statusSel").value="all";deck=allScope().filter(matches);ui.index=deck.findIndex(x=>keyFor(x.sheet,x.item)===keyFor(p.sheet,p.item));saveUi();render();return}}alert("현재 범위는 모두 검수했습니다.")}
function selectedSheets(){const all=activeSheets();if(ui.sheet!=="all"){const one=all.find(s=>text(s.id)===text(ui.sheet));return one?[one]:[]}return all.filter(s=>!ui.subject||subjectOf(s)===ui.subject)}function exportScopeLabel(){const xs=selectedSheets();if(ui.sheet!=="all"&&xs[0])return xs[0].name||ui.subject||"문제";return ui.subject||"문제"}function updateExportLabels(){const one=ui.sheet!=="all";$("exportReportBtn").textContent=one?"현재 시트 검수내역 XLSX":"현재 과목 검수내역 XLSX";$("exportEditedBtn").textContent=one?"현재 시트 수정본 XLSX":"현재 과목 수정본 XLSX"}
function reportRowsForSheet(sheet){return (sheet.items||[]).filter(item=>item&&text(item.question).trim()).map(item=>{const r=recFor(sheet,item),e=effective(sheet,item);return {과목:subjectOf(sheet),시트명:sheet.name,원본행:item.row,문제ID:keyFor(sheet,item),원본카테고리:item.category??item.section??"",현재카테고리:e.category,원본문제:item.question??"",현재문제:e.question,원본정답:item.answer??"",현재정답:e.answer,원본메모:item.memo??"",현재메모:e.memo,판정:STATUS_LABEL[r.status]||"미검수","검수 메모":r.note||""}})}function safeName(s){return text(s||"검수").replace(/[\\/?*\[\]:]/g," ").slice(0,31)||"검수"}
function exportReport(){persistCurrent();const sheets=selectedSheets();if(!sheets.length){alert("내보낼 시트를 선택하세요.");return}const wb=XLSX.utils.book_new();for(const s of sheets){const rows=reportRowsForSheet(s);if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),safeName(s.name))}if(!wb.SheetNames.length){alert("내보낼 문제가 없습니다.");return}XLSX.writeFile(wb,`${safeName(exportScopeLabel())}_검수내역_${new Date().toISOString().slice(0,10)}.xlsx`)}function exportEdited(){persistCurrent();const sheets=selectedSheets();if(!sheets.length){alert("내보낼 시트를 선택하세요.");return}const wb=XLSX.utils.book_new();for(const s of sheets){const rows=[["카테고리","문제","정답","메모"]];for(const item of s.items||[]){if(!text(item.question).trim())continue;const e=effective(s,item);rows.push([e.category,e.question,e.answer,e.memo])}if(rows.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),safeName(s.name))}if(!wb.SheetNames.length){alert("내보낼 문제가 없습니다.");return}XLSX.writeFile(wb,`${safeName(exportScopeLabel())}_직접수정본_${new Date().toISOString().slice(0,10)}.xlsx`)}
["categoryEdit","questionEdit","answerEdit","memoEdit","reviewNote"].forEach(id=>$(id).addEventListener("input",schedulePersist));document.querySelectorAll(".status-btn").forEach(b=>b.onclick=()=>setStatus(b.dataset.status));$("prevBtn").onclick=()=>move(-1);$("nextBtn").onclick=()=>move(1);$("nextUnreviewedBtn").onclick=nextUnreviewed;$("clearStatusBtn")?.addEventListener("click",clearStatus);$("resetEditsBtn").onclick=resetEdits;$("localBtn").onclick=()=>{if(!readLocal())alert("메인 앱 로컬 문제은행은 이 화면에서 보이지 않습니다. 엑셀을 불러오세요.")};$("fileBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{const f=e.target.files?.[0];if(f)importFile(f);e.target.value=""};$("exportReportBtn").onclick=exportReport;$("exportEditedBtn").onclick=exportEdited;
$("subjectSel").onchange=e=>{persistCurrent();ui.subject=e.target.value;ui.sheet="all";ui.index=0;populateSheets();rebuild({keepCurrent:false})};$("sheetSel").onchange=e=>{persistCurrent();ui.sheet=e.target.value;ui.index=0;updateExportLabels();rebuild({keepCurrent:false})};$("statusSel").onchange=e=>{persistCurrent();ui.status=e.target.value;ui.index=0;rebuild({keepCurrent:false})};$("searchBox").oninput=e=>{ui.search=e.target.value;ui.index=0;rebuild({keepCurrent:false})};$("autoAdvance").onchange=e=>{ui.autoAdvance=e.target.checked;saveUi()};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select")){if(e.key==="Escape")e.target.blur();return}if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else if(["1","2","3","4"].includes(e.key))setStatus(({1:"keep",2:"delete",3:"revise",4:"add"})[e.key]);else if(e.key.toLowerCase()==="m")$("reviewNote").focus();else if(e.key.toLowerCase()==="n")nextUnreviewed()});$("card").addEventListener("touchstart",e=>{if(e.target.closest("input,textarea,button,select"))return;const t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY}},{passive:true});$("card").addEventListener("touchend",e=>{if(!swipeStart)return;const t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1)},{passive:true});window.addEventListener("pagehide",persistCurrent);
(async()=>{await loadReview();ui.status=["all","unreviewed","keep","delete","revise","add"].includes(ui.status)?ui.status:"all";$("statusSel").value=ui.status;$("searchBox").value=ui.search||"";$("autoAdvance").checked=ui.autoAdvance!==false;if(!(await restoreLastSource())&&!readLocal()){bankSheets=[];sourceLabel="원본 없음";afterSource(false)}})();
})();
</script>
