<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문제은행 검수</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--line:#e2e2e7;--text:#1f1f23;--sub:#77777f;--soft:#f1f1f4;--ok:#2b7d55;--bad:#ba5149;--warn:#a16b14;--accent:#6357d9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:940px;margin:auto;padding:8px 10px;display:grid;gap:7px}
.topline,.filters,.stats,.nav,.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.title{font-size:16px;font-weight:760;margin-right:auto}
button,.pill,select,input[type="search"]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;color:var(--text)}
button:active{transform:translateY(1px)}
select{max-width:240px;min-width:0}
input[type="search"]{min-width:160px;flex:1}
.small{font-size:11px;color:var(--sub)}
.pill{font-size:11px;background:#fff;padding:5px 8px}
.progress{height:5px;background:#e6e6ea;border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.progress>i{display:block;height:100%;width:0;background:#555;border-radius:999px;transition:width .15s}
main{max-width:940px;margin:auto;padding:12px 10px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-height:56vh;display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--sub);font-size:11px}
.tag{padding:4px 7px;border-radius:999px;background:var(--soft);color:#666}
.q{font-size:20px;line-height:1.55;font-weight:720;white-space:pre-wrap;word-break:keep-all}
.block{border-top:1px solid #ececef;padding-top:10px}
.label{font-size:11px;color:var(--sub);margin-bottom:5px}
.answer,.memo{font-size:15px;line-height:1.55;white-space:pre-wrap}
.review-note{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:11px;padding:10px;outline:none;background:#fff}
.review-note:focus{border-color:#aaa}
.status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:auto}
.status-btn{padding:11px 6px;border-radius:11px;background:#f6f6f8;font-size:12px;font-weight:650}
.status-btn.active[data-status="keep"]{background:#edf7f1;border-color:#9dcdb3;color:#216d49}
.status-btn.active[data-status="delete"]{background:#fff0ef;border-color:#e2aaa6;color:#9e4039}
.status-btn.active[data-status="revise"]{background:#fff7e8;border-color:#e3c384;color:#8a5c10}
.status-btn.active[data-status="add"]{background:#f0efff;border-color:#bbb5ee;color:#5347b6}
.nav{margin-top:10px;justify-content:space-between}
.nav button{min-width:92px}
.nav-center{display:flex;gap:6px;align-items:center}
.empty{background:#fff;border:1px dashed #cfcfd5;border-radius:14px;padding:44px 18px;text-align:center;color:#777;line-height:1.6}
.autoadv{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#666}
.downloads{display:flex;gap:6px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;border-radius:18px;padding:8px 12px;font-size:11px;opacity:0;pointer-events:none;transition:.18s;z-index:50}.toast.show{opacity:1}
.kbd{font-size:10px;color:#999;margin-top:2px;text-align:center}
@media(max-width:680px){
 .header-inner{padding:7px}.title{width:100%}.filters>*{flex:1 1 42%;max-width:none}.filters input[type="search"]{flex-basis:100%}
 main{padding:8px 7px 86px}.card{padding:13px;min-height:62vh}.q{font-size:17px}.status-grid{grid-template-columns:1fr 1fr}.downloads{width:100%;margin-left:0}.downloads button{flex:1}.nav button{min-width:74px;padding:8px 7px}.kbd{display:none}
}
</style>
</head>
<body>
<header><div class="header-inner">
  <div class="topline">
    <div class="title">문제은행 카드 검수</div>
    <button id="reloadBtn" type="button">문제은행 다시 읽기</button>
    <a href="./edit.html" style="text-decoration:none"><button type="button">메인</button></a>
  </div>
  <div class="filters">
    <select id="subjectSel" aria-label="과목"></select>
    <select id="sheetSel" aria-label="시트"></select>
    <select id="statusSel" aria-label="검수 상태">
      <option value="all">전체</option>
      <option value="unreviewed">미검수</option>
      <option value="keep">유지</option>
      <option value="delete">삭제 후보</option>
      <option value="revise">수정 필요</option>
      <option value="add">추가 필요</option>
    </select>
    <input id="searchBox" type="search" placeholder="문제·정답·카테고리 검색">
  </div>
  <div class="stats">
    <span class="pill" id="scopeStat">0/0 검수</span>
    <div class="progress"><i id="progressBar"></i></div>
    <span class="small" id="positionStat">0 / 0</span>
    <label class="autoadv"><input id="autoAdvance" type="checkbox" checked> 판정 후 자동 넘김</label>
    <div class="downloads">
      <button id="exportSubject" type="button">현재 과목 검수 XLSX</button>
      <button id="exportAll" type="button">전체 검수 XLSX</button>
    </div>
  </div>
</div></header>
<main>
  <div id="empty" class="empty" hidden></div>
  <section id="card" class="card" hidden>
    <div class="meta" id="meta"></div>
    <div class="q" id="question"></div>
    <div class="block">
      <div class="label">정답</div>
      <div class="answer" id="answer"></div>
    </div>
    <div class="block" id="originMemoWrap">
      <div class="label">기존 메모</div>
      <div class="memo" id="originMemo"></div>
    </div>
    <div class="block">
      <div class="label">검수 메모 · 수정 지시 / 추가할 내용 / 삭제 이유</div>
      <textarea id="reviewNote" class="review-note" placeholder="필요한 경우만 적으세요. 이 내용은 원본 문제은행을 수정하지 않고 별도로 저장됩니다."></textarea>
    </div>
    <div class="status-grid" id="statusGrid">
      <button class="status-btn" data-status="keep" type="button">1 · 유지</button>
      <button class="status-btn" data-status="delete" type="button">2 · 삭제 후보</button>
      <button class="status-btn" data-status="revise" type="button">3 · 수정 필요</button>
      <button class="status-btn" data-status="add" type="button">4 · 추가 필요</button>
    </div>
  </section>
  <div class="nav">
    <button id="prevBtn" type="button">← 이전</button>
    <div class="nav-center">
      <button id="nextUnreviewedBtn" type="button">다음 미검수</button>
      <button id="clearStatusBtn" type="button">판정 해제</button>
    </div>
    <button id="nextBtn" type="button">다음 →</button>
  </div>
  <div class="kbd">키보드: ←/→ 이동 · 1 유지 · 2 삭제 · 3 수정 · 4 추가 · M 메모 · N 다음 미검수</div>
</main>
<div id="toast" class="toast"></div>
<script>
(()=>{
"use strict";
const APP_KEY="study-jew-v4";
const REVIEW_KEY="study-jew-bank-review-v1";
const UI_KEY="study-jew-bank-review-ui-v1";
const STATUS_LABEL={keep:"유지",delete:"삭제 후보",revise:"수정 필요",add:"추가 필요"};
let bankSheets=[];
let review=loadJson(REVIEW_KEY,{version:1,records:{}});
if(!review||typeof review!=="object")review={version:1,records:{}};
if(!review.records||typeof review.records!=="object")review.records={};
let ui=loadJson(UI_KEY,{subject:"",sheet:"all",status:"all",search:"",index:0,autoAdvance:true});
let deck=[];
let noteTimer=0;
let swipeStart=null;

const $=id=>document.getElementById(id);
function loadJson(key,fallback){try{const x=JSON.parse(localStorage.getItem(key)||"null");return x??fallback}catch{return fallback}}
function saveReview(){try{localStorage.setItem(REVIEW_KEY,JSON.stringify(review))}catch(e){toast("검수 저장 실패: 저장 공간을 확인하세요")}}
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify(ui))}catch{}}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),1300)}
function subjectOf(sheet){const name=String(sheet?.name||"").trim();const i=name.indexOf("_");return i>0?name.slice(0,i).trim():(name||"기타")}
function activeSheets(){return bankSheets.filter(s=>s&&!s.archived&&!s.versionHidden&&Array.isArray(s.items))}
function keyFor(sheet,item){return `${String(sheet.id||sheet.name)}::${String(item.id||item.canonicalId||item.row||"")}`}
function recFor(sheet,item){const k=keyFor(sheet,item);return review.records[k]||{status:"",note:"",updatedAt:0}}
function current(){return deck[Math.max(0,Math.min(deck.length-1,Number(ui.index)||0))]||null}
function text(v){return String(v??"")}
function readBank(){
  const raw=loadJson(APP_KEY,null);
  const sheets=raw?.bank?.sheets;
  bankSheets=Array.isArray(sheets)?sheets:[];
  populateSubjects();
  rebuildDeck({keepCurrent:false});
}
function populateSubjects(){
  const sel=$("subjectSel"),subjects=[...new Set(activeSheets().map(subjectOf))].sort((a,b)=>a.localeCompare(b,"ko"));
  if(!ui.subject||!subjects.includes(ui.subject))ui.subject=subjects[0]||"";
  sel.innerHTML="";
  for(const s of subjects){const o=document.createElement("option");o.value=s;o.textContent=s;sel.append(o)}
  sel.value=ui.subject;
  populateSheets();
}
function populateSheets(){
  const sel=$("sheetSel"),list=activeSheets().filter(s=>subjectOf(s)===ui.subject);
  sel.innerHTML='<option value="all">과목 전체</option>';
  for(const s of list){const o=document.createElement("option");o.value=String(s.id);o.textContent=s.name||"이름 없는 시트";sel.append(o)}
  if(ui.sheet!=="all"&&!list.some(s=>String(s.id)===String(ui.sheet)))ui.sheet="all";
  sel.value=ui.sheet;
}
function allScopeItems(subject=ui.subject){
  const out=[];
  for(const sheet of activeSheets()){
    if(subject&&subjectOf(sheet)!==subject)continue;
    if(ui.sheet!=="all"&&String(sheet.id)!==String(ui.sheet))continue;
    for(const item of sheet.items||[]){if(!item||!text(item.question).trim())continue;out.push({sheet,item})}
  }
  return out;
}
function matchesStatus(pair){
  const st=recFor(pair.sheet,pair.item).status||"";
  if(ui.status==="all")return true;
  if(ui.status==="unreviewed")return !st;
  return st===ui.status;
}
function matchesSearch(pair){
  const q=text(ui.search).trim().toLowerCase();if(!q)return true;
  const i=pair.item;
  return [i.category,i.section,i.question,i.answer,i.memo,i.tag,i.sourceLabel].some(v=>text(v).toLowerCase().includes(q));
}
function rebuildDeck({keepCurrent=true}={}){
  const before=keepCurrent?current():null,beforeKey=before?keyFor(before.sheet,before.item):"";
  deck=allScopeItems().filter(matchesStatus).filter(matchesSearch);
  let idx=beforeKey?deck.findIndex(x=>keyFor(x.sheet,x.item)===beforeKey):-1;
  if(idx<0)idx=Math.max(0,Math.min(deck.length-1,Number(ui.index)||0));
  ui.index=idx<0?0:idx;
  saveUi();render();
}
function render(){
  const pair=current(),card=$("card"),empty=$("empty");
  updateStats();
  if(!pair){
    card.hidden=true;empty.hidden=false;
    empty.innerHTML=bankSheets.length?"현재 필터에 해당하는 문제가 없습니다.<br><span class='small'>상단 필터를 바꾸거나 ‘문제은행 다시 읽기’를 눌러보세요.</span>":"이 브라우저의 로컬 문제은행을 찾지 못했습니다.<br><span class='small'>같은 브라우저에서 메인 앱의 문제은행을 한 번 연 뒤 다시 오세요. 로그인은 필요 없습니다.</span>";
    $("reviewNote").value="";return;
  }
  empty.hidden=true;card.hidden=false;
  const {sheet,item}=pair,r=recFor(sheet,item),tags=[];
  tags.push(`<span class="tag">${escapeHtml(subjectOf(sheet))}</span>`);
  tags.push(`<span class="tag">${escapeHtml(sheet.name||"")}</span>`);
  if(text(item.category).trim())tags.push(`<span class="tag">${escapeHtml(item.category)}</span>`);
  if(text(item.section).trim()&&text(item.section).trim()!==text(item.category).trim())tags.push(`<span class="tag">${escapeHtml(item.section)}</span>`);
  tags.push(`<span>원본 행 ${escapeHtml(item.row||"")}</span>`);
  $("meta").innerHTML=tags.join("");
  $("question").textContent=text(item.question);
  $("answer").textContent=text(item.answer)||"(정답 없음)";
  $("originMemo").textContent=text(item.memo);
  $("originMemoWrap").hidden=!text(item.memo).trim();
  $("reviewNote").value=text(r.note);
  document.querySelectorAll(".status-btn").forEach(b=>b.classList.toggle("active",b.dataset.status===r.status));
  $("positionStat").textContent=`${ui.index+1} / ${deck.length}`;
  $("prevBtn").disabled=ui.index<=0;
  $("nextBtn").disabled=ui.index>=deck.length-1;
}
function updateStats(){
  const scope=allScopeItems(ui.subject),reviewed=scope.filter(x=>!!recFor(x.sheet,x.item).status).length,total=scope.length;
  $("scopeStat").textContent=`${reviewed}/${total} 검수`;
  $("progressBar").style.width=total?`${reviewed/total*100}%`:"0%";
  if(!deck.length)$("positionStat").textContent="0 / 0";
}
function move(delta){if(!deck.length)return;ui.index=Math.max(0,Math.min(deck.length-1,(Number(ui.index)||0)+delta));saveUi();render();scrollTopCard()}
function scrollTopCard(){window.scrollTo({top:0,behavior:"instant"})}
function setStatus(status){
  const pair=current();if(!pair)return;
  flushNote();
  const k=keyFor(pair.sheet,pair.item),old=review.records[k]||{};
  review.records[k]={...old,status,updatedAt:Date.now()};saveReview();
  if($("autoAdvance").checked){
    if(ui.status!=="all")rebuildDeck({keepCurrent:false});
    else if(ui.index<deck.length-1){ui.index++;saveUi();render();scrollTopCard()}else render();
  }else render();
}
function clearStatus(){
  const pair=current();if(!pair)return;flushNote();
  const k=keyFor(pair.sheet,pair.item),old=review.records[k]||{};
  review.records[k]={...old,status:"",updatedAt:Date.now()};saveReview();rebuildDeck({keepCurrent:true});
}
function scheduleNote(){clearTimeout(noteTimer);noteTimer=setTimeout(flushNote,180)}
function flushNote(){
  clearTimeout(noteTimer);noteTimer=0;const pair=current();if(!pair)return;
  const k=keyFor(pair.sheet,pair.item),old=review.records[k]||{},note=$("reviewNote").value;
  if(text(old.note)===note)return;
  if(!note&&!old.status){delete review.records[k]}else review.records[k]={...old,note,updatedAt:Date.now()};
  saveReview();
}
function nextUnreviewed(){
  flushNote();
  const scope=allScopeItems(ui.subject),start=current(),startKey=start?keyFor(start.sheet,start.item):"",startIx=Math.max(0,scope.findIndex(x=>keyFor(x.sheet,x.item)===startKey));
  let found=null;
  for(let step=1;step<=scope.length;step++){const p=scope[(startIx+step)%scope.length];if(!recFor(p.sheet,p.item).status){found=p;break}}
  if(!found){toast("현재 범위는 모두 검수했습니다");return}
  ui.status="all";$("statusSel").value="all";ui.search="";$("searchBox").value="";
  deck=scope;ui.index=deck.findIndex(x=>keyFor(x.sheet,x.item)===keyFor(found.sheet,found.item));saveUi();render();scrollTopCard();
}
function escapeHtml(s){return text(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function exportRows(subject){
  const rows=[];
  for(const sheet of activeSheets()){
    if(subject&&subjectOf(sheet)!==subject)continue;
    for(const item of sheet.items||[]){
      if(!item||!text(item.question).trim())continue;
      const r=recFor(sheet,item);if(!r.status&&!text(r.note).trim())continue;
      rows.push({
        "과목":subjectOf(sheet),"시트명":sheet.name||"","문제ID":item.id||"","canonicalId":item.canonicalId||"","원본행":item.row||"",
        "카테고리":item.category||"","영역/구분":item.section||"","현재 문제":item.question||"","현재 정답":item.answer||"","기존 메모":item.memo||"",
        "판정":STATUS_LABEL[r.status]||"미검수","검수 메모(수정·추가 지시)":r.note||"","검수시각":r.updatedAt?new Date(r.updatedAt).toLocaleString("ko-KR"):""
      });
    }
  }
  return rows;
}
function downloadRows(rows,base){
  if(!rows.length){toast("내보낼 검수 내역이 없습니다");return}
  if(window.XLSX){
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"검수내역");
    ws["!cols"]=[{wch:9},{wch:28},{wch:22},{wch:22},{wch:8},{wch:24},{wch:22},{wch:58},{wch:38},{wch:38},{wch:12},{wch:55},{wch:20}];
    XLSX.writeFile(wb,`${base}_${dateStamp()}.xlsx`);return;
  }
  const heads=Object.keys(rows[0]);const csv=[heads,...rows.map(r=>heads.map(h=>r[h]??""))].map(row=>row.map(csvCell).join(",")).join("\n");
  const blob=new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${base}_${dateStamp()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvCell(v){return `"${text(v).replace(/"/g,'""')}"`}
function dateStamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`}

$("subjectSel").onchange=e=>{flushNote();ui.subject=e.target.value;ui.sheet="all";ui.index=0;populateSheets();saveUi();rebuildDeck({keepCurrent:false})};
$("sheetSel").onchange=e=>{flushNote();ui.sheet=e.target.value;ui.index=0;saveUi();rebuildDeck({keepCurrent:false})};
$("statusSel").onchange=e=>{flushNote();ui.status=e.target.value;ui.index=0;saveUi();rebuildDeck({keepCurrent:false})};
$("searchBox").oninput=e=>{ui.search=e.target.value;ui.index=0;saveUi();rebuildDeck({keepCurrent:false})};
$("autoAdvance").onchange=e=>{ui.autoAdvance=!!e.target.checked;saveUi()};
$("reviewNote").addEventListener("input",scheduleNote);
$("prevBtn").onclick=()=>{flushNote();move(-1)};$("nextBtn").onclick=()=>{flushNote();move(1)};
$("nextUnreviewedBtn").onclick=nextUnreviewed;$("clearStatusBtn").onclick=clearStatus;
$("reloadBtn").onclick=()=>{flushNote();readBank();toast("로컬 문제은행을 다시 읽었습니다")};
$("exportSubject").onclick=()=>{flushNote();downloadRows(exportRows(ui.subject),`${ui.subject||"과목"}_문제은행_검수`)};
$("exportAll").onclick=()=>{flushNote();downloadRows(exportRows(""),"전과목_문제은행_검수")};
document.querySelectorAll(".status-btn").forEach(b=>b.onclick=()=>setStatus(b.dataset.status));

document.addEventListener("keydown",e=>{
  const typing=e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||e.target instanceof HTMLSelectElement;
  if(typing){if(e.key==="Escape"){e.target.blur();e.preventDefault()}return}
  if(e.key==="ArrowRight"){e.preventDefault();move(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();move(-1)}
  else if(e.key==="1"){e.preventDefault();setStatus("keep")}
  else if(e.key==="2"){e.preventDefault();setStatus("delete")}
  else if(e.key==="3"){e.preventDefault();setStatus("revise")}
  else if(e.key==="4"){e.preventDefault();setStatus("add")}
  else if(e.key.toLowerCase()==="m"){e.preventDefault();$("reviewNote").focus()}
  else if(e.key.toLowerCase()==="n"){e.preventDefault();nextUnreviewed()}
});
$("card").addEventListener("pointerdown",e=>{if(e.target.closest("button,input,textarea,select"))return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId}});
$("card").addEventListener("pointerup",e=>{if(!swipeStart||swipeStart.id!==e.pointerId)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25){flushNote();move(dx<0?1:-1)}});
window.addEventListener("pagehide",flushNote);document.addEventListener("visibilitychange",()=>{if(document.hidden)flushNote()});
window.addEventListener("storage",e=>{if(e.key===APP_KEY)toast("메인 문제은행 변경 감지 · 다시 읽기를 누르세요")});

$("statusSel").value=ui.status||"all";$("searchBox").value=ui.search||"";$("autoAdvance").checked=ui.autoAdvance!==false;
readBank();
})();
