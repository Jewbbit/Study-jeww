name: Apply orientation layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orientation-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/apply_orientation_layout.py
      - run: |
          rm -f .github/scripts/apply_orientation_layout.py .github/workflows/orientation-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch responsive mode by orientation"
          git push origin main
