name: Patch zero quiz key
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core key mapping
        shell: python
        run: |
          from pathlib import Path
          p=Path('edit.html')
          s=p.read_text(encoding='utf-8')
          old='''    else if(e.key==="9")n=1;\n    else if(e.key==="6")n=2;'''
          new='''    else if(e.key==="0")n=4;\n    else if(e.key==="9")n=1;\n    else if(e.key==="6")n=2;'''
          if old not in s: raise SystemExit('key mapping anchor not found')
          s=s.replace(old,new,1)
          old='''    else if(e.code==="Digit9"||e.code==="Numpad9")n=1;\n    else if(e.code==="Digit6"||e.code==="Numpad6")n=2;'''
          new='''    else if(e.code==="Digit0"||e.code==="Numpad0")n=4;\n    else if(e.code==="Digit9"||e.code==="Numpad9")n=1;\n    else if(e.code==="Digit6"||e.code==="Numpad6")n=2;'''
          if old not in s: raise SystemExit('code mapping anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          old='const CACHE_NAME="study-jew-pwa-v33-core-quiz";'
          if old not in w: raise SystemExit('cache version anchor not found')
          w=w.replace(old,'const CACHE_NAME="study-jew-pwa-v34-zero-key";',1)
          sw.write_text(w,encoding='utf-8')
          Path('.github/workflows/patch-zero-key.yml').unlink(missing_ok=True)
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('edit.html').read_text(encoding='utf-8')
          assert 'else if(e.key==="0")n=4;' in s
          assert 'else if(e.code==="Digit0"||e.code==="Numpad0")n=4;' in s
          assert 'else if(e.key==="9")n=1;' in s
          assert 'else if(e.key==="6")n=2;' in s
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Map 0 key to quiz choice 4"
          git push origin main
